# The board defconfig has the console; the board glue (nanopc_t6.c) arms the
# watchdog. The five device_map()s of the sample (CRU, PMU, SPI2, the GPU QoS,
# the GPU) come on top of the glue's three; the arm64 MMU code k_panic()s when
# its translation tables run out, so this gives it twice the default 8.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=16
