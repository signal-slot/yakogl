# As t6_fw (the board defconfig has the console and CACHE_MANAGEMENT; the board
# glue arms the watchdog). Z4 adds __nocache storage for what the GPU and the MCU
# share with the CPU: the frame's five arenas, the geometry buffer, the target,
# the CS ring buffer, the sync object and the heap context (about 130 KiB with
# the firmware's shared section; main.c lists each region). The tiler heap's
# 2 MiB first chunk is GPU-only and plain bss. Each nocache region and each
# device_map() takes translation-table pages, so MAX_XLAT_TABLES is twice
# t6_fw's; the arm64 MMU code k_panic()s when they run out.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=32
CONFIG_NOCACHE_MEMORY=y
