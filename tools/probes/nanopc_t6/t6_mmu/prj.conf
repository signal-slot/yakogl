# As t6_gpu (the board defconfig has the console and CACHE_MANAGEMENT; the
# board glue arms the watchdog). The sample's five device_map()s come on top
# of the glue's three; the arm64 MMU code k_panic()s when its translation
# tables run out, so this gives it twice the default 8. The GPU's page
# tables are in the image's .bss, not a device_map().
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=16
