# As t6_display (the board defconfig has the console and CACHE_MANAGEMENT;
# the board glue arms the watchdog). The probe's ten device_map()s (the
# VOP, vop_mmu, the PMU, the CRU with the PMU1 CRU, sys_grf, vop_grf,
# vo1_grf, the PHY and its GRF, the HDMI controller, 260 KiB together) come
# on top of the glue's two (WDT0, the CRU: nanopc_t6.c) and the drivers'
# own (the console UART, the GIC's distributor and redistributors, about
# 1.1 MiB). The arm64 MMU code k_panic()s when its translation tables run
# out. With 32-bit VAs and 4 KiB pages it takes one table for the base
# level, one per GiB touched and one per 2 MiB touched in 4 KiB pages: the
# base, the first GiB's (the image and every mapping, all inside
# KERNEL_VM 0x10000000-0x2fffffff), at most two for the image's first
# 4 MiB, and at most two for the mappings, which device_map() places next
# to each other. That is 6 at most; 24 leaves room. The 3 MiB frame buffer
# is in the image's .bss, not a device_map().
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=24
