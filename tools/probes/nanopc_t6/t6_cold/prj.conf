# As t6_display (the board defconfig has the console and CACHE_MANAGEMENT;
# the board glue arms the watchdog). The probe's ten device_map()s (the
# VOP, vop_mmu, the PMU, the CRU with the PMU1 CRU, sys_grf, vop_grf,
# vo1_grf, the PHY and its GRF, the HDMI controller) come on top of the
# glue's three; the arm64 MMU code k_panic()s when its translation tables
# run out, so this gives it three times the default 8. The 3 MiB frame
# buffer is in the image's .bss, not a device_map().
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=24
