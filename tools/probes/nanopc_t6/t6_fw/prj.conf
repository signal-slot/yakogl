# As t6_mmu (the board defconfig has the console and CACHE_MANAGEMENT; the
# board glue arms the watchdog; the sample's device_map()s come on top of the
# glue's, and the arm64 MMU code k_panic()s when its translation tables run
# out). The firmware's shared section is backed by __nocache storage (the
# MCU's interface is uncached for the CPU too), which needs NOCACHE_MEMORY.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_MAX_XLAT_TABLES=16
CONFIG_NOCACHE_MEMORY=y
