# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the mailbox asks the firmware for the
# framebuffer.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=45
CONFIG_YAKOGL_RPI5_MBOX=y
# device_map() of the display blocks and the mailbox above 4 GiB; the arm64
# MMU code k_panic()s when its translation tables run out.
CONFIG_MAX_XLAT_TABLES=16
