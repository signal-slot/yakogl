# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the mailbox asks the firmware for the
# framebuffer.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=45
CONFIG_YAKOGL_RPI5_MBOX=y
# rpi_mbox.c cleans and invalidates its message buffer with sys_cache_data_*();
# without CACHE_MANAGEMENT those do nothing (-ENOTSUP) and the firmware reads
# stale memory. The 2026-11-19 run, where every mailbox request returned -EIO,
# was built without it (candidate cause of docs/rpi5-display.md Q1). Kconfig
# selects it with the mailbox now; set here so the image says so.
CONFIG_CACHE_MANAGEMENT=y
# device_map() of the display blocks (hvs, two pixel valves, the hd region),
# iommu4, the mailbox above 4 GiB, and a plane or framebuffer of a few MiB: the
# arm64 MMU code k_panic()s when its translation tables run out. rpi5_clear
# needed 16 for five blocks; this maps more, and a first run is where the real
# number is learned, so the usage report is on: its last "peak N of M allocated"
# line is the lower bound MAX must take (arch/arm64/core/Kconfig:421-429).
CONFIG_MAX_XLAT_TABLES=64
# The console this image draws into is the framebuffer: fbcon.c installs a printk
# hook, and a hook is reached only on printk's own char-out path. With CONFIG_LOG
# and any mode but minimal, CONFIG_LOG_PRINTK (default y when PRINTK=y,
# zephyr:subsys/logging/Kconfig.processing:5-8) sends printk into the logging
# subsystem first (zephyr:subsys/logging/log_core.c:223-231 with
# lib/os/printk.c:100-103), and the hook sees nothing. LOG_MODE_MINIMAL keeps
# CONFIG_LOG_PRINTK unselectable (Kconfig.processing:5 `if !LOG_MODE_MINIMAL`), so
# printk and LOG_* both reach the hook: the same choice the repo's fbcon boards make
# (driver/samples/zephyr/gl_test/boards/rpi_4b.conf, driver/samples/zephyr/deqp,
# driver/zephyr/lib/board/imx8mp/Kconfig:271-277). It also keeps the xlat-table
# "peak N of M" lines above (arch/arm64/core/mmu.c:61-67 logs them).
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_ARM64_MMU_REPORT_XLAT_TABLES_USAGE=y
