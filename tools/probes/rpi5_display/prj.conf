# The board defconfig has the console (uart10). The watchdog is the board
# layer's (driver/zephyr/lib/board/rpi4/rpi_wdog.c), armed before anything else;
# the shortest hold the Kconfig allows, so the reset comes back to Linux soon.
# The mailbox (rpi_mbox.c) is linked for the steps that follow the skeleton.
# The firmware's scanout and the display blocks lie above the image RAM, so the
# arm64 MMU code gets spare translation tables for device_map().
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=10
CONFIG_YAKOGL_RPI5_MBOX=y
CONFIG_MAX_XLAT_TABLES=16
