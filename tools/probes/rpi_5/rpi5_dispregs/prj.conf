# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the image stops feeding it after its
# end line (rpi_wdog_alive in src/main.c) and the board returns to Linux.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
# 17 mailbox transactions of at most about 1.1 s each (the bounds of
# rpi_mbox.c's transact(), copied in src/main.c) fit well inside the hold.
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=60
# Without it every sys_cache_data_*() is -ENOTSUP and the mailbox answer is
# never seen (rpi5_mbox, section 4 Q1): the clean before and the invalidate
# after are the "clear" way of rpi5_mbox, the one that answered.
CONFIG_CACHE_MANAGEMENT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the mailbox, the HVS, two pixel valves, the HDMI hd block and
# the two hdmi blocks: the arm64 MMU code k_panic()s when its translation
# tables run out (rpi5_scanout16 maps the same HVS and valves with 64).
CONFIG_MAX_XLAT_TABLES=64
CONFIG_ARM64_MMU_REPORT_XLAT_TABLES_USAGE=y
