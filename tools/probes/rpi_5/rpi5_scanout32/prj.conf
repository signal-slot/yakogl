# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the image stops feeding it after its
# end line (rpi_wdog_alive in src/main.c) and the board returns to Linux.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=45
# The later display-list and buffer writes need the clean/invalidate calls to
# work (without this every sys_cache_data_*() is -ENOTSUP and does nothing).
CONFIG_CACHE_MANAGEMENT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the HVS (and later the pixel valve): the arm64 MMU code
# k_panic()s when its translation tables run out.
CONFIG_MAX_XLAT_TABLES=16
