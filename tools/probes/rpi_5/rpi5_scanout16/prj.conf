# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the image stops feeding it after its
# result line (rpi_wdog_alive in src/main.c) and the board returns to Linux.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
# Fed at most 280 s: the hold (RPI5_SCANOUT16_HOLD_MS, 240 s by default) is
# clamped to 280 - 10 s since boot, and the reset follows the result line
# within one watchdog period, well inside board.sh pi5's RUN_BOUND of 420 s.
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=280
CONFIG_CACHE_MANAGEMENT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the HVS, the pixel valves, iommu4 and the adopted plane (a
# few MiB at an address the firmware chose): the arm64 MMU code k_panic()s
# when its translation tables run out. rpi5_display maps the same and more with
# 64; the usage report's "peak N of M" line says what the run needed.
CONFIG_MAX_XLAT_TABLES=64
CONFIG_ARM64_MMU_REPORT_XLAT_TABLES_USAGE=y
