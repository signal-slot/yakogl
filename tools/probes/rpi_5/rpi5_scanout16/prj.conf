# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the image stops feeding it after its
# end line (rpi_wdog_alive in src/main.c).
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=45
# Cache maintenance for the plane the later stages write (without it every
# sys_cache_data_*() is -ENOTSUP; the BCM2712 SoC does not turn it on).
CONFIG_CACHE_MANAGEMENT=y
# Fatal handler output in order with printk before the watchdog resets.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the HVS, two pixel valves and later HDMI0's blocks and the
# plane, all above 4 GiB (rpi5_display needs more blocks than 32; the later
# stage raises this if the board says so).
CONFIG_MAX_XLAT_TABLES=32
