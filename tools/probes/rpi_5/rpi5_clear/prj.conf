# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the mailbox switches the V3D clock.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=30
CONFIG_YAKOGL_RPI5_MBOX=y
# The GPU's buffers are statics written through the data cache:
# sys_cache_data_*() is -ENOTSUP and does nothing without this, and the BCM2712
# SoC does not turn it on (the BCM2711's Kconfig.defconfig does).
CONFIG_CACHE_MANAGEMENT=y
# v3d_hw.c reports its timeouts and faults with LOG_ERR, in order with printk.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the hub, the core, pm, the SMS and the mailbox above 4 GiB;
# the arm64 MMU code k_panic()s when its translation tables run out.
CONFIG_MAX_XLAT_TABLES=16
