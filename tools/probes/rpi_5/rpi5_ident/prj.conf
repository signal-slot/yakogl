# The board defconfig has the console (uart10). The watchdog is the board
# layer's (driver/zephyr/lib/board/rpi4/rpi_wdog.c), armed before anything else.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=30
# A fault on a read reaches Zephyr's fatal handler, which reports through LOG;
# immediate mode keeps it in order with printk before the watchdog resets.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the hub and the core above 4 GiB; the arm64 MMU code
# k_panic()s when its translation tables run out.
CONFIG_MAX_XLAT_TABLES=16
