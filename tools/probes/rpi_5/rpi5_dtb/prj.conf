# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else. The DTB the firmware hands over lies
# above the image RAM, so main.c device_map()s it; the arm64 MMU code
# k_panic()s when its translation tables run out, so there are spare ones.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=30
CONFIG_MAX_XLAT_TABLES=16
