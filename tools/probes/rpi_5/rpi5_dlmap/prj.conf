# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else; the image stops feeding it after its
# end line (rpi_wdog_alive in src/main.c) and the board returns to Linux.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
# The probe reads the HVS once (about 24 k words) and prints a few hundred
# lines: a short hold is plenty.
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=60
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of the HVS only (rpi5_scanout16 maps the same block with 64).
CONFIG_MAX_XLAT_TABLES=64
CONFIG_ARM64_MMU_REPORT_XLAT_TABLES_USAGE=y
