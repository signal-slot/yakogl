# The board defconfig has the console (uart10). The watchdog is the board
# layer's (driver/zephyr/lib/board/rpi4/rpi_wdog.c), armed before anything
# else and fed until 30 s after boot: the image ends at ~3 s, the board then
# resets itself back into Linux, the way every other tools/probes/rpi_5 probe
# is carried. Nothing else is needed.
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=30
