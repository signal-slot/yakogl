# The board defconfig has the console (uart10). The watchdog is the board
# layer's, armed before anything else. Up to 21 mailbox transactions of at most
# about 1.1 s each (rpi_mbox.c's bounds) fit in the hold; the image stops the
# feeding itself after its end line (rpi_wdog_alive in src/main.c).
CONFIG_PRINTK=y
CONFIG_YAKOGL_RPI5_WDOG=y
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=60
CONFIG_YAKOGL_RPI5_MBOX=y
# rpi5_clear's setting, which rpi5_display's prj.conf lacks. Without it every
# sys_cache_data_*() is -ENOTSUP and does nothing (the BCM2712 SoC does not
# turn it on). The "display" way of src/main.c skips the cache calls to run
# what rpi5_display's image ran; the "clear" and "board" ways make them.
CONFIG_CACHE_MANAGEMENT=y
# A fault reaches Zephyr's fatal handler, which reports through LOG; immediate
# mode keeps it in order with printk before the watchdog resets.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# device_map() of pm and the mailbox above 4 GiB (twice: the board layer's and
# this probe's) and one low page; the arm64 MMU code k_panic()s when its
# translation tables run out (rpi5_clear maps five blocks with 16).
CONFIG_MAX_XLAT_TABLES=16
