# WDOG3 is armed by the board glue at PRE_KERNEL_1 as in every image, and
# never fed: its timeout (60 s) is the pass. The lifetime's PSCI reset comes
# later (150 s) and only if WDOG3 did not bite; main() says FAIL first.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_YAKOGL_VERDIN_IMX95_WDOG_FEED=n
CONFIG_YAKOGL_VERDIN_IMX95_LIFETIME_S=150
CONFIG_YAKOGL_VERDIN_IMX95_SCMI=y
