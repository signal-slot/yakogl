# The raw SCMI channel (DISPLAY and CAMERA on and off), the two LPI2C buses
# and the module's PCAL6416A through Zephyr's drivers (the board devicetree
# keeps them zephyr,deferred-init: the probe turns their SCMI clocks on
# first, as verdin_imx95_display.c does); WDOG3 as in every image.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_YAKOGL_VERDIN_IMX95_SCMI=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_GPIO_PCA_SERIES_INTERRUPT=n
