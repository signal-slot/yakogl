#
# ramlog.conf -- one Kconfig fragment that turns the opt-in RAM ring on for a
# build of an STM32MP257F-DK image. The ring (CONFIG_YAKOGL_RAMLOG,
# driver/zephyr/lib/board/common/ramlog.c; its byte format is documented at
# the top of that file) mirrors every printk character into a DDR ring behind
# a 32-byte header (magic 0x474C4B59, the bytes 'YKLG'), mapped Normal
# non-cacheable, so a blind run reads its console text back after the reset.
# No board defconfig, sample conf or app conf sets these options: the ring is
# opt-in and this fragment is what a build appends to turn it on.
#
# Build flag. The workspace's Zephyr is 4.4, whose CMake reads
# EXTRA_CONF_FILE for conf fragments (cmake/modules/configuration_files.cmake
# also accepts the older name OVERLAY_CONFIG as an alias). Absolute path,
# after the `--`:
#
#   west build -p always -b stm32mp257f_dk/stm32mp257fxx/a35 <app> -- \
#     -DEXTRA_CONF_FILE=<yakogl>/tools/probes/stm32mp257f_dk/ramlog_conf/ramlog.conf
#
# <yakogl> is the checkout's absolute path. Alongside the flag, the DK's gate
# rows pass -DZEPHYR_MODULES=..., -DYAKOGL_DIR=... and -DYAKOGL_WERROR=ON
# (tools/check.sh, zephyr_werror_image). Build-checked 2026-11-23 with
# -DYAKOGL_WERROR=ON on tools/probes/stm32mp257f_dk/mp2_hello and
# driver/samples/zephyr/gc_fence; each build's zephyr/.config then holds the
# three CONFIG_YAKOGL_RAMLOG* lines below (commit record).
#
# U-Boot read-back: the runner's hook runs the one command line of
# tools/probes/stm32mp257f_dk/ramlog/uboot_snippet.txt, with its own
# yako_ramlog_addr = CONFIG_YAKOGL_RAMLOG_ADDR and yako_ramlog_size =
# CONFIG_YAKOGL_RAMLOG_SIZE: itest.l *${yako_ramlog_addr} == 0x474C4B59, then
# ext4write mmc ${boot_instance}:${yako_part} ${yako_ramlog_addr}
# /yakogl/ramlog.bin ${yako_ramlog_size} (the bootfs file the host reads as
# /boot/yakogl/ramlog.bin), then mw.l clears the magic so a later boot does
# not save the same ring again. Host side, the decoder (exit codes in
# tools/probes/stm32mp257f_dk/ramlog/README.md):
#
#   python3 -I <yakogl>/tools/probes/stm32mp257f_dk/ramlog/ramlog_decode.py \
#     ramlog.bin > console.txt

CONFIG_YAKOGL_RAMLOG=y

# Address: the ramlog-study's pick (plan #349, item ramlog-study) for a region
# the DK's warm resets (PSCI SYSTEM_RESET; the SMC watchdog) leave untouched:
# System RAM above the image's load window, below the GPU carveout, in no
# reserved region of the boot chain's map. Checked against the DK map (the
# board dts header driver/boards/st/stm32mp257f_dk/, docs/notes/
# stm32mp257f-dk-uboot-boot.md section 3, docs/notes/pre-study-stm32mp257f-dk.md
# section 5), all sizes as ST's r3.1 tree reports them:
#   0x80000000..0x83ffffff  reserved below System RAM, no-map (the M33/TF-M
#                           windows, IPC buffers, op-tee@82000000 of 32 MiB)
#   0x84000000..0xfa7fffff  System RAM (the board's reading under ST's Linux)
#     0x84000000..0x88000000  U-Boot's kernel_comp_addr_r / SYS_LOAD_ADDR,
#                             fastboot buffer; kernel_addr_r 0x8a000000
#     0x90000000..0x90400000+ fdt_addr_r, scriptaddr, pxefile_addr_r,
#                             fdtoverlay_addr_r, ramdisk_addr_r (ST's U-Boot's
#                             compiled-in *_{ADDR,R} values)
#     0xa0000000..0xb0000000  the image's own RAM: zephyr,sram, the link
#                             address, the runner's load window (LOAD_END in
#                             tools/board-stm32mp2.sh; the load scripts guard
#                             the file and the image's footprint below
#                             0xb0000000, so nothing of the image is here)
#     ~0xf0000000..0xfa7fffff  U-Boot proper, its malloc pool and its stack:
#                             relocation takes a block at or above ~0xf0000000
#                             near the top of RAM (the stored environment's
#                             fdtcontroladdr f80048b0; the bdinfo reading of
#                             relocaddr is a board-run TODO of the uboot-boot
#                             note -- a source reading, not a measurement)
#   0xfa800000..0xfe7fffff  gpu-reserved, no-map, 64 MiB (the GPU carveout)
#   0xfe800000, 0xff000000  the two LTDC secure-layer areas (8 MiB, 16 MiB)
#   (TF-A BL31 and the M33 code sit in internal SRAM at 0x0a000000-0x0a09ffff,
#    not in DDR at all; the digits are easy to confuse with 0xa0000000.)
# The ring is 0xb0100000..0xb010ffff: it starts 1 MiB above the load window's
# end, ends about 1.16 GiB below the GPU carveout, and lies inside no region
# above. During ST's Linux this range is ordinary System RAM (its 128 MiB CMA
# pool may use it), but the ring's life ends before Linux boots: the image
# writes it, the warm reset preserves it, the preboot snippet saves it in
# U-Boot, the snippet then clears the magic, and bootcmd boots ST's Linux
# afterwards.
# MEASURED 2026-11-24 (item ramlog-fix, U-Boot's console): the premise above
# does not hold. The DK's warm resets, PSCI SYSTEM_RESET and the IWDG reset
# alike, do not keep DDR. Words planted from U-Boot at this address and at
# 13 others across System RAM all read back as uniform 0x00000000 or
# 0xffffffff after the reset, so no DDR address can carry the ring. Also read
# there, U-Boot's bdinfo: relocaddr 0xfa024000, malloc base 0xf8022000, stack near
# 0xf8003ee8. See ../ramlog/README.md "Limit".
CONFIG_YAKOGL_RAMLOG_ADDR=0xb0100000

# Size: the Kconfig default (range 0x1000-0x10000000): 32-byte header plus
# 0xffe0 (65 504) data bytes. The uboot_snippet.txt files and ramlog_decode.py
# name no size of their own (the runner sets yako_ramlog_size from the
# image's .config), so the fragment keeps the default. The snippet's
# ext4write count is this whole number (the decoder wants 32 + data-size
# bytes in the file). A run's console text is kilobytes; 0x10000 holds one
# bounded run without wrapping (the decoder reports wrap and lost bytes when
# it does wrap).
CONFIG_YAKOGL_RAMLOG_SIZE=0x10000
