# The board defconfig has the console; the board layer (stm32mp2.c) prints
# the banner and the hand-over record and resets through PSCI at the end;
# stm32mp2_wdog.c arms OP-TEE's watchdog at boot.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_YAKOGL_STM32MP2_WDOG=y

# The display path: the four drivers are enabled by the overlay's nodes.
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_MIPI_DSI=y
CONFIG_GPIO=y

# Translation tables. Zephyr's default 8 ran out on the DK right after
# "display_power: up" (board-display2: "CONFIG_MAX_XLAT_TABLES is too small",
# ELR in arch/arm64/core/mmu.c new_table): the base table, an L2 table for
# each GiB touched (0x4xxxxxxx: the GIC; 0x8xxxxxxx-0xbxxxxxxx: the image,
# the VM region and the frame buffer) and an L3 table for each 2 MiB window
# mapped in pages: the image (text/rodata/data split), the GIC, the top of
# the 8 MiB VM region where device_map puts USART2, RCC, SYSCFG (6 pages),
# RIFSC, GPIOB, GPIOF, I2C2, the DSI host and the LTDC, and the frame
# buffer's direct map at 0xb0000000 (fb-size 8 MiB, 2 MiB blocks when
# aligned). mp2_gpu_scanout gets 256 from the Vivante driver's default
# (driver/zephyr/Kconfig); without the GPU nothing raises it. 64 is several
# times what that list can take (8 tables were 32 KiB, 64 are 256 KiB).
CONFIG_MAX_XLAT_TABLES=64

# A thread that overruns its stack is stopped at its next context switch
# (K_ERR_STACK_CHK_FAIL: "mp2: fatal error 2" without CONFIG_LOG), not later
# as a corrupted neighbour (the board layer's MAIN_STACK_SIZE default,
# driver/zephyr/lib/board/stm32mp2/Kconfig).
CONFIG_STACK_SENTINEL=y

# The layer resets the board this long after boot; the probe holds the
# picture CONFIG_MP2_DISPLAY_HOLD_S (60) after its verdict, so it must be
# well beyond that.
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=150
