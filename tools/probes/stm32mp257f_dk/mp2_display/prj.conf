# The board defconfig has the console; the board layer (stm32mp2.c) prints
# the banner and the hand-over record and resets through PSCI at the end;
# stm32mp2_wdog.c arms OP-TEE's watchdog at boot.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_YAKOGL_STM32MP2_WDOG=y

# The display path: the four drivers are enabled by the overlay's nodes.
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_MIPI_DSI=y
CONFIG_GPIO=y

# The layer resets the board this long after boot; the probe holds the
# picture CONFIG_MP2_DISPLAY_HOLD_S (60) after its verdict, so it must be
# well beyond that.
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=150
