# The board defconfig has the console; the board layer (stm32mp2.c) prints
# the banner and the hand-over record. The layer's own watchdog
# (stm32mp2_wdog.c) stays off: this image is the watchdog's only client.
# The refresh is the yakogl-drivers crate's, linked by the board layer's
# YAKOGL_STM32MP2_GPU (feature stm32mp2; no GPU driver, no GPU access).
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_YAKOGL_STM32MP2_WDOG=n
CONFIG_YAKOGL_STM32MP2_GPU=y
# The layer's PSCI reset only if the watchdog did not fire: 60 s of
# petting, 32 s to the IWDG's reset, then a margin.
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=150
