# The board defconfig has the console; the board layer (stm32mp2.c) prints
# the banner and the hand-over record and resets through PSCI at the end;
# stm32mp2_wdog.c arms OP-TEE's watchdog at boot and pets it.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_YAKOGL_STM32MP2_WDOG=y

# The GPU: the Vivante driver on the overlay's &gpu, powered by the board
# layer (gc_power_mp2.c), as the board layer's app.conf has it for
# gc_triangle. FPU sharing off for the reason app.conf gives (printk from an
# interrupt handler with the FPU disabled in exception context).
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_FPU_SHARING=n

# The display path: the four drivers are enabled by the overlay's nodes.
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_MIPI_DSI=y
CONFIG_GPIO=y

# The layer resets the board this long after boot; the probe holds the
# picture CONFIG_MP2_GPU_SCANOUT_HOLD_S (60) after its verdict, so it must be
# well beyond that.
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=150
