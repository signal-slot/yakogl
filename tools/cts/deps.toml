git clone --no-checkout https://github.com/glmark2/glmark2 "$DEPS/glmark2-src.part"
git -C "$DEPS/glmark2-src.part" checkout --detach 22c527cb0556f3a1ac4445aaa52cc532760928d5
mv "$DEPS/glmark2-src.part" "$DEPS/glmark2-src"
'''
packages.apt = ["git"]
packages.portage = ["dev-vcs/git"]

[[dep]]
name = "DEQP_GLES3_TEST_DIR"
path = "VK-GL-CTS-gles3/data/gles3/shaders"
marker = "VK-GL-CTS-gles3/data/gles3/shaders/arrays.test"
note = "the dEQP GLES3 shader corpus (*.test) of VK-GL-CTS at 93bca01, the commit DEQP_WORK pins: the corpus part of tests/es3_shaderc_corpus.rs runs only when this names it. A sparse checkout of data/gles3/shaders alone (no external/fetch_sources.py), in a directory of its own: DEQP_WORK takes any $DEPS/VK-GL-CTS/.git as a complete tree, so a partial one there would break the board build. DEQP_WORK's clone is the source when it has the commit (no network), else one blobless commit from GitHub. Test data: read it, never run anything from it"
build = '''
want=93bca01861b0e3ef3c387027a9791e6d065f900c
part="$DEPS/VK-GL-CTS-gles3.part"
rm -rf "$part"
if git -C "$DEPS/VK-GL-CTS" cat-file -e "$want^{commit}" 2>/dev/null; then
  git clone -q --no-checkout "$DEPS/VK-GL-CTS" "$part"
else
  git init -q "$part"
  git -C "$part" remote add origin https://github.com/KhronosGroup/VK-GL-CTS
  git -C "$part" fetch -q --depth 1 --filter=blob:none origin "$want"
fi
git -C "$part" sparse-checkout set --no-cone /data/gles3/shaders/
git -C "$part" checkout -q --detach "$want"
mv "$part" "$DEPS/VK-GL-CTS-gles3"
'''
packages.apt = ["git"]
packages.portage = ["dev-vcs/git"]

[[dep]]
name = "LZ4"
path = "lz4/bin/lz4"
marker = "lz4/bin/lz4"
note = "the lz4 command of the am62p second-stage LZ4 vectors (tools/am62p-mkboot.py reads $LZ4, else lz4 on PATH), built from the upstream v1.10.0 release without root; the distribution package (ZEPHYR_WS packages) is the other way to have it"
build = '''
rm -rf "$DEPS/lz4.part"
mkdir -p "$DEPS/lz4.part/src"
tar -xzf "$DEPS/downloads/lz4-1.10.0.tar.gz" -C "$DEPS/lz4.part/src" --strip-components=1
make -C "$DEPS/lz4.part/src" -j"$(nproc)" lz4
mkdir -p "$DEPS/lz4.part/bin"
cp "$DEPS/lz4.part/src/programs/lz4" "$DEPS/lz4.part/bin/lz4"
rm -rf "$DEPS/lz4.part/src" "$DEPS/lz4"
mv "$DEPS/lz4.part" "$DEPS/lz4"
'''
packages.apt = ["make", "gcc"]
packages.portage = ["dev-build/make", "sys-devel/gcc"]

[[dep.inputs]]
url = "https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[[dep]]
name = "PVR_FW_BLOB"
path = "pvr_fw_blob.h"
marker = "pvr_fw_blob.h"
note = "not reproducible: the header is made from the board's PowerVR firmware file with driver/tools/mkfwblob.sh (driver/README.md) and is never committed; copy the host's existing one"

[[dep]]
name = "MALI_CSFFW"
path = "mali-csffw/mali_csffw.bin"
marker = "mali-csffw/mali_csffw.bin"
note = "the Mali-G610's CSF firmware (Arm's, LICENCE.mali_csffw of linux-firmware): the NanoPC-T6's Armbian file /lib/firmware/arm/mali/arch10.8/mali_csffw.bin is byte for byte linux-firmware's at 930ef904 (282624 bytes, the sha256 below, checked 2026-10-28), so it is fetched from there; never committed; driver/tools/mkmalifw.sh makes the header; without it the firmware row of tools/check.sh is a gap. The gate workflow builds this one entry when it is absent (a single pinned file, no tree)"
build = '''
mkdir -p "$DEPS/mali-csffw"
cp "$DEPS/downloads/mali_csffw.bin" "$DEPS/mali-csffw/mali_csffw.bin.part"
mv "$DEPS/mali-csffw/mali_csffw.bin.part" "$DEPS/mali-csffw/mali_csffw.bin"
'''

[[dep.inputs]]
url = "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/930ef9046e3848df688d98b7d5e68154b031dc66/arm/mali/arch10.8/mali_csffw.bin"
sha256 = "a27847ea11f8efb3136340c3ba8aab413ae25145eeb4a7f64ff5edd829a2405b"

# With a board.

[[dep]]
name = "DEQP_WORK"
path = "deqp-stage1-{board}"
marker = "deqp-stage1-{board}/build"
board = "*"
requires = ["WEST_VENV", "ZEPHYR_SDK_INSTALL_DIR"]
note = "the board's dEQP stage-1 tree (tools/cts/cts-build-zephyr.sh, tools/cts/README.md, docs/release/building.md section 9): VK-GL-CTS at 93bca01 with the two yakogl patches, built with the Zephyr SDK compiler; about 1.9 GB. It is built in place (the CMake cache holds absolute paths) and a failed build removes the directory, so the marker only ever means a complete tree"
build = '''
case "$BOARD_NAME" in
  am62p)  zboard=verdin_am62p/am62p54/a53 ;;
  imx8mp) zboard=verdin_imx8mp/mimx8ml8/a53 ;;
  rpi_4b) zboard=rpi_4b ;;
  *) echo "DEQP_WORK: name a board (--board am62p | imx8mp | rpi_4b)" >&2; exit 2 ;;
esac
repo=$PWD
if [ ! -d "$DEPS/VK-GL-CTS/.git" ]; then
  rm -rf "$DEPS/VK-GL-CTS.part"
  git clone --no-checkout https://github.com/KhronosGroup/VK-GL-CTS "$DEPS/VK-GL-CTS.part"
  git -C "$DEPS/VK-GL-CTS.part" checkout --detach 93bca01861b0e3ef3c387027a9791e6d065f900c
  (cd "$DEPS/VK-GL-CTS.part" && python3 external/fetch_sources.py)
  mv "$DEPS/VK-GL-CTS.part" "$DEPS/VK-GL-CTS"
fi
work="$DEPS/deqp-stage1-$BOARD_NAME"
trap 'rc=$?; [ "$rc" -eq 0 ] || rm -rf "$work"' EXIT
. "$DEPS/zephyr-ws/.venv/bin/activate"
export ZEPHYR_BASE="$DEPS/zephyr-ws/zephyr"
export ZEPHYR_SDK_INSTALL_DIR="$DEPS/zephyr-sdk-1.0.1" ZEPHYR_TOOLCHAIN_VARIANT=zephyr   # the SDK's host tools (dtc) come with the variant
export ZEPHYR_MODULES="$("$repo/tools/cts/zephyr-modules.sh" "$DEPS/zephyr-ws")"
export CFLAGS=-O2 CXXFLAGS=-O2   # libpng's NEON code does not build at -O0 (docs/release/building.md section 9)
CTS="$DEPS/VK-GL-CTS" WORK="$work" BOARD="$zboard" tools/cts/cts-build-zephyr.sh
'''
packages.apt = ["git", "python3-venv", "cmake", "ninja-build", "gperf", "ccache", "device-tree-compiler"]
packages.portage = ["dev-vcs/git", "dev-build/cmake", "dev-build/ninja", "dev-util/gperf", "dev-util/ccache", "sys-apps/dtc"]

[[dep]]
name = "SLINT_NOSTD_DIR"
path = "slint-nostd"
marker = "slint-nostd/internal"
board = "*"
note = "Slint's no_std tree (the Slint demo image): upstream at 1007c032 plus examples/nostd/slint-nostd.patch (docs/release/building.md section 7); the cargo build of a sample still fetches crates.io, so it needs network once"
build = '''
repo=$PWD
rm -rf "$DEPS/slint-nostd.part"
mkdir "$DEPS/slint-nostd.part"
git -C "$DEPS/slint-nostd.part" init -q
git -C "$DEPS/slint-nostd.part" fetch -q --depth 1 https://github.com/slint-ui/slint.git 1007c032ca1573e60dce2113e802e0ccb91c2641
git -C "$DEPS/slint-nostd.part" checkout -q --detach FETCH_HEAD
(cd "$DEPS/slint-nostd.part" && patch -p1 < "$repo/examples/nostd/slint-nostd.patch")
mv "$DEPS/slint-nostd.part" "$DEPS/slint-nostd"
'''
packages.apt = ["git", "patch"]
packages.portage = ["dev-vcs/git", "sys-devel/patch"]

[[dep]]
name = "NOSTD_PATCH_DIR"
path = "nostd"
marker = "nostd/Cargo.toml"
board = "*"
note = "the no_std patch workspace (femtovg 0.26.0, glow 0.18.0; docs/release/building.md section 8). The two crates come through `cargo vendor`, which checks them against the crates.io index; the repository pins no digest for them"
build = '''
repo=$PWD
n=$repo/examples/nostd
rm -rf "$DEPS/nostd.part" "$DEPS/nostd.fetch"
mkdir -p "$DEPS/nostd.fetch/src" "$DEPS/nostd.part"
: > "$DEPS/nostd.fetch/src/lib.rs"
printf '[package]\nname = "fetch"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\nfemtovg = "=0.26.0"\nglow = "=0.18.0"\n' > "$DEPS/nostd.fetch/Cargo.toml"
(cd "$DEPS/nostd.fetch" && cargo vendor -q vendor > /dev/null)
for c in femtovg glow; do
  cp -r "$DEPS/nostd.fetch/vendor/$c" "$DEPS/nostd.part/$c"
  rm -f "$DEPS/nostd.part/$c/.cargo-checksum.json"
done
(cd "$DEPS/nostd.part/femtovg" && patch -p1 < "$n/femtovg-0.26.0-nostd.patch")
(cd "$DEPS/nostd.part/glow" && patch -p1 < "$n/glow-0.18.0-nostd.patch")
cp "$n/nostd-workspace.Cargo.toml" "$DEPS/nostd.part/Cargo.toml"
rm -rf "$DEPS/nostd.fetch"
mv "$DEPS/nostd.part" "$DEPS/nostd"
'''
packages.apt = ["patch"]
packages.portage = ["sys-devel/patch"]

[[dep]]
name = "NOTO_SANS_DIR"
path = "noto"
marker = "noto/NotoSans-Regular.ttf"
board = "*"
note = "the Noto Sans fonts of the Slint host replay (optional; NotoSans-Light/-Regular/-SemiBold.ttf), copied from the distribution package"
build = '''
src=
for d in /usr/share/fonts/truetype/noto /usr/share/fonts/noto /usr/share/fonts/NotoSans; do
  if [ -f "$d/NotoSans-Regular.ttf" ]; then src=$d; break; fi
done
[ -n "$src" ] || { echo "NOTO_SANS_DIR: no NotoSans-Regular.ttf in the system fonts; install the package (deps-env.sh --packages)" >&2; exit 1; }
rm -rf "$DEPS/noto.part"
mkdir "$DEPS/noto.part"
cp "$src/NotoSans-Light.ttf" "$src/NotoSans-Regular.ttf" "$src/NotoSans-SemiBold.ttf" "$DEPS/noto.part/"
mv "$DEPS/noto.part" "$DEPS/noto"
'''
packages.apt = ["fonts-noto-core"]
packages.portage = ["media-fonts/noto"]

[[dep]]
name = "IMX8MP_OUT"
path = "imx8mp-out"
marker = "imx8mp-out"
board = "imx8mp"
note = "any empty directory: the i.MX8MP scripts write images and logs there"
build = '''
mkdir -p "$DEPS/imx8mp-out"
'''

[[dep]]
name = "DEQP_STAGE1"
path = "deqp-stage1-imx8mp"
marker = "deqp-stage1-imx8mp/build"
