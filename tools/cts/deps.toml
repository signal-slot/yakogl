#
# deps.toml -- every external dependency of the gate and of the board tools:
# what it is called, where it lives, how a usable one is recognised, and how
# to make one. This is the one place; tools/cts/deps-env.sh reads it, and
# tools/setup-gate-host.sh takes its distribution packages from it.
#
# A change that adds a gate row (or a board tool) needing a tree that is not
# in the repository adds its [[dep]] here, in the same commit.
#
# Layout directory ($DEPS in a build command): deps_env.py layout(), printed by
# deps-env.sh --layout: $CONNECTED_DEPS_DIR (or $CCFARM_DEPS_DIR) when set,
# else ~/.local/share/connected/deps/yakogl. One [[dep]] per entry, in the order
# deps-env.sh prints them. Keys:
#
#   name      the environment variable deps-env.sh prints.
#   aliases   more variables with the same value.
#   path      the value, relative to the layout directory ("{board}" is the
#             board given to deps-env.sh).
#   command   instead of path: a program found on PATH (else /usr/bin/<it>);
#             the value and the marker are its path.
#   rustup_target  instead of path: a rustup target of the toolchain in effect
#             (RUSTUP_TOOLCHAIN, else the default); the value and the marker are
#             <rustc --print sysroot>/lib/rustlib/<target>/lib, which only an
#             installed target has.
#   marker    relative to the layout directory: the file only a usable tree
#             has (an empty directory or a venv without west is "missing").
#             "." is the layout directory itself.
#   board     the entry belongs to a board's set only: a board name
#             (am62p | imx8mp | rpi_4b), or "*" for every named board.
#             Without it the entry is in every set.
#   create    deps-env.sh (printing) makes the directory when it is absent.
#   requires  entries that must be present before this one is built.
#   build     a shell command that makes the entry from nothing. It runs with
#             `bash -eu -o pipefail` from the repository root, with $DEPS set
#             to the layout directory, $BOARD_NAME to the board given to
#             deps-env.sh (empty without one) and the inputs in
#             $DEPS/downloads/. It
#             must leave the marker only when the entry is complete (build in
#             a ".part" directory and rename). No build: see note.
#   note      what to know when there is no build, or about the build.
#   inputs    the downloads a build needs ([[dep.inputs]]): url, and the
#             digest as sha256 (pinned here), or sha256_from = "<file in the
#             repo>:<key>" (a "key: value" line, e.g.
#             third_party/mesa-26.2.1/UPSTREAM). The digest is always pinned in
#             the repository, never read from the download's own server.
#             deps-env.sh --build fetches them into
#             $DEPS/downloads/<name of the url> and checks the digest.
#   packages  distribution packages the build needs, per family:
#             packages.apt, packages.portage, packages.brew (brew only when
#             known). A host or image recipe installs them before building:
#             tools/setup-gate-host.sh, `deps-env.sh --packages apt`.
#
# deps-env.sh --check is what every host and image is judged by. --build is
# for hosts and images, run on purpose; the gate never builds these, but for
# MALI_CSFFW: one pinned file, fetched by .github/workflows/gate.yml when a
# runner lacks it (its note).

[[dep]]
name = "ZEPHYR_WS"
aliases = ["ZEPHYR_WORKSPACE"]
path = "zephyr-ws"
marker = "zephyr-ws/.west/config"
note = "the west workspace: Zephyr, the modules west.yml allows, and the yakogl manifest clone (docs/es3/zephyr-env.md)"
build = '''
rm -rf "$DEPS/zephyr-ws.part" "$DEPS/zephyr-ws.boot"
python3 -m venv "$DEPS/zephyr-ws.boot"
"$DEPS/zephyr-ws.boot/bin/pip" install west
# the repository is private: https works only with credentials, so ssh is the fallback
if ! GIT_TERMINAL_PROMPT=0 "$DEPS/zephyr-ws.boot/bin/west" init -m https://github.com/signal-slot/yakogl --mr main "$DEPS/zephyr-ws.part"; then
  rm -rf "$DEPS/zephyr-ws.part"
  "$DEPS/zephyr-ws.boot/bin/west" init -m git@github.com:signal-slot/yakogl.git --mr main "$DEPS/zephyr-ws.part"
fi
(cd "$DEPS/zephyr-ws.part" && "$DEPS/zephyr-ws.boot/bin/west" update)
mv "$DEPS/zephyr-ws.part" "$DEPS/zephyr-ws"
rm -rf "$DEPS/zephyr-ws.boot"
'''
packages.apt = ["git", "python3-venv", "python3-pip", "cmake", "ninja-build", "gperf", "ccache", "device-tree-compiler", "xz-utils", "make"]
packages.portage = ["dev-vcs/git", "dev-build/cmake", "dev-build/ninja", "dev-util/gperf", "dev-util/ccache", "sys-apps/dtc"]

[[dep]]
name = "WEST_VENV"
aliases = ["ZEPHYR_VENV"]
path = "zephyr-ws/.venv"
marker = "zephyr-ws/.venv/bin/west"
requires = ["ZEPHYR_WS"]
note = "west and zephyr/scripts/requirements-base.txt, in the workspace"
build = '''
rm -rf "$DEPS/zephyr-ws/.venv"
python3 -m venv "$DEPS/zephyr-ws/.venv"
"$DEPS/zephyr-ws/.venv/bin/pip" install west -r "$DEPS/zephyr-ws/zephyr/scripts/requirements-base.txt"
'''

[[dep]]
name = "HAL_NXP_DIR"
path = "zephyr-ws/modules/hal/nxp"
marker = "zephyr-ws/modules/hal/nxp/zephyr/module.yml"
requires = ["WEST_VENV"]
note = "hal_nxp, the i.MX8MP register check; west update of the workspace fetches it (the generator pins 1e91007b)"
build = '''
cd "$DEPS/zephyr-ws" && .venv/bin/west update hal_nxp
'''

[[dep]]
name = "ZEPHYR_SDK_INSTALL_DIR"
path = "zephyr-sdk-1.0.1"
marker = "zephyr-sdk-1.0.1/sdk_version"
note = "the Zephyr SDK 1.0.1, minimal bundle plus the aarch64 toolchain (docs/es3/zephyr-env.md); no cmake package registration. No `setup.sh -h`: its host tools (dtc, ...) need /lib/ld-linux-x86-64.so.2, which a distribution may lack (Gentoo), and Zephyr then prefers them to the working ones; the host's cmake, ccache, dtc and gperf are used (packages below)"
build = '''
rm -rf "$DEPS/zephyr-sdk-1.0.1.part"
mkdir "$DEPS/zephyr-sdk-1.0.1.part"
tar -C "$DEPS/zephyr-sdk-1.0.1.part" --strip-components=1 -xf "$DEPS/downloads/zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz"
"$DEPS/zephyr-sdk-1.0.1.part/setup.sh" -t aarch64-zephyr-elf
mv "$DEPS/zephyr-sdk-1.0.1.part" "$DEPS/zephyr-sdk-1.0.1"
'''
packages.apt = ["xz-utils", "file", "wget", "cmake", "ccache", "device-tree-compiler", "gperf"]
packages.portage = ["dev-build/cmake", "dev-util/ccache", "sys-apps/dtc", "dev-util/gperf", "net-misc/wget"]

[[dep.inputs]]
url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz"
sha256 = "ca9bc0ff66fafca1dac9d592a36d953cf16d096a9d09b1c0357f021cf9f6a7eb"

[[dep]]
name = "PCO_SHC"
path = "PCO_SHC/pco_shc"
marker = "PCO_SHC/pco_shc"
note = "Mesa 26.2.1's PowerVR shader compiler (tools/pco_shc/README.md); the toolchain id glsl2usc records depends on the compiler and LLVM versions"
build = '''
if [ -z "${LLVM_DIR-}" ] && [ -d /usr/lib/llvm-21 ]; then export LLVM_DIR=/usr/lib/llvm-21; fi
tools/pco_shc/build_pco_shc.sh "$DEPS/downloads/mesa-26.2.1.tar.xz" "$DEPS/PCO_SHC.src"
mkdir -p "$DEPS/PCO_SHC"
cp "$DEPS/PCO_SHC.src/mesa-26.2.1/build/src/imagination/vulkan/pco_shc" "$DEPS/PCO_SHC/pco_shc.part"
mv "$DEPS/PCO_SHC/pco_shc.part" "$DEPS/PCO_SHC/pco_shc"
'''
packages.apt = [
  "clang-21", "llvm-21-dev", "libclang-21-dev", "libclc-21-dev", "llvm-spirv-21", "libllvmspirvlib-21-dev",
  "spirv-tools", "spirv-tools-dev", "spirv-headers", "glslang-tools", "meson", "ninja-build",
  "python3-mako", "python3-yaml", "python3-packaging", "libdrm-dev", "libexpat1-dev", "zlib1g-dev", "libzstd-dev",
]
packages.portage = [
  "llvm-core/clang", "llvm-core/llvm", "dev-util/spirv-llvm-translator", "dev-util/spirv-tools", "dev-util/spirv-headers",
  "dev-util/glslang", "dev-build/meson", "dev-build/ninja", "dev-python/mako", "dev-python/pyyaml", "dev-python/packaging",
  "x11-libs/libdrm", "dev-libs/expat", "sys-libs/zlib", "app-arch/zstd",
]

[[dep.inputs]]
url = "https://archive.mesa3d.org/mesa-26.2.1.tar.xz"
sha256_from = "third_party/mesa-26.2.1/UPSTREAM:tarball-sha256"

[[dep]]
name = "PCO_SPM_LOAD_CAPTURE"
path = "PCO_SHC/capture_spm_load"
marker = "PCO_SHC/capture_spm_load"
requires = ["PCO_SHC"]
note = "capture_spm_load of the pco_shc build (tools/pco_shc/capture_spm_load.c): prints the partial render's background-object load shader as Mesa 26.2.1's pco makes it, for the regenerate-and-compare row of tools/check.sh (tools/pco_shc/README.md); without it that row is a gap, never a pass. A host prepared before this entry has pco_shc and not this program: --build PCO_SPM_LOAD_CAPTURE makes it from the tree PCO_SHC's build left in PCO_SHC.src, or builds that tree again (the same tarball, patches and options, so pco_shc, which is not touched, stays what GLSL2USC_CACHE is keyed by)"
build = '''
if [ -z "${LLVM_DIR-}" ] && [ -d /usr/lib/llvm-21 ]; then export LLVM_DIR=/usr/lib/llvm-21; fi
src="$DEPS/PCO_SHC.src/mesa-26.2.1"
# A tree built from a checkout before capture_spm_load.c has no rule for it.
if ! grep -q 'capture_spm_load' "$src/build/build.ninja" 2>/dev/null; then
  tools/pco_shc/build_pco_shc.sh "$DEPS/downloads/mesa-26.2.1.tar.xz" "$DEPS/PCO_SHC.src"
fi
ninja -C "$src/build" src/imagination/vulkan/capture_spm_load
mkdir -p "$DEPS/PCO_SHC"
cp "$src/build/src/imagination/vulkan/capture_spm_load" "$DEPS/PCO_SHC/capture_spm_load.part"
mv "$DEPS/PCO_SHC/capture_spm_load.part" "$DEPS/PCO_SHC/capture_spm_load"
'''
packages.apt = [
  "clang-21", "llvm-21-dev", "libclang-21-dev", "libclc-21-dev", "llvm-spirv-21", "libllvmspirvlib-21-dev",
  "spirv-tools", "spirv-tools-dev", "spirv-headers", "glslang-tools", "meson", "ninja-build",
  "python3-mako", "python3-yaml", "python3-packaging", "libdrm-dev", "libexpat1-dev", "zlib1g-dev", "libzstd-dev",
]
packages.portage = [
  "llvm-core/clang", "llvm-core/llvm", "dev-util/spirv-llvm-translator", "dev-util/spirv-tools", "dev-util/spirv-headers",
  "dev-util/glslang", "dev-build/meson", "dev-build/ninja", "dev-python/mako", "dev-python/pyyaml", "dev-python/packaging",
  "x11-libs/libdrm", "dev-libs/expat", "sys-libs/zlib", "app-arch/zstd",
]

[[dep.inputs]]
url = "https://archive.mesa3d.org/mesa-26.2.1.tar.xz"
sha256_from = "third_party/mesa-26.2.1/UPSTREAM:tarball-sha256"

[[dep]]
name = "MESA_PAN_TREE"
path = "mesa-pan/mesa-26.2.1"
marker = "mesa-pan/mesa-26.2.1/build-pan/build.ninja"
note = "Mesa 26.2.1's panfrost tree with pan_shc built in build-pan (tools/mali/build_pan_shc.sh); the gate workflow puts /usr/lib/llvm-21/bin on PATH"
build = '''
if [ -z "${LLVM_DIR-}" ] && [ -d /usr/lib/llvm-21 ]; then export LLVM_DIR=/usr/lib/llvm-21; fi
tools/mali/build_pan_shc.sh "$DEPS/downloads/mesa-26.2.1.tar.xz" "$DEPS/mesa-pan"
