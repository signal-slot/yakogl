build = 'true'

[[dep]]
name = "MALI_DEQP_TOOLCHAIN"
path = "debian-trixie-arm64-cross"
marker = "debian-trixie-arm64-cross/bin/aarch64-linux-gnu-g++"
board = "nanopc_t6"
note = "Debian trixie's own arm64 cross toolchain (g++-14-aarch64-linux-gnu 14.2.0-19cross1, binutils 2.44-3, the cross glibc 2.41-11cross1 and libstdc++ 14.2.0), which tools/cts/mali-deqp-build.sh builds deqp-gles2 with for the NanoPC-T6's Armbian trixie: its floors are GLIBC 2.41, GLIBCXX 3.4.33, CXXABI 1.3.15. The packages of `apt install g++-aarch64-linux-gnu` in a debian:trixie image, unpacked without root or docker: the .debs of snapshot.debian.org at 20261101T000000Z (trixie 13.7), with the trixie amd64 libraries the compiler and binutils load (isl, mpc, mpfr, gmp, jansson, sframe) in usr/lib/x86_64-linux-gnu. bin/ holds the drivers to use: each sets LD_LIBRARY_PATH to those libraries and --sysroot to this directory. Runs on an x86_64 host with glibc >= 2.38, zstd and zlib"
build = '''
part="$DEPS/debian-trixie-arm64-cross.part"
rm -rf "$part"
mkdir -p "$part/bin"
for deb in \
  gcc-14-aarch64-linux-gnu-base_14.2.0-19cross1_amd64.deb cpp-14-aarch64-linux-gnu_14.2.0-19cross1_amd64.deb \
  gcc-14-aarch64-linux-gnu_14.2.0-19cross1_amd64.deb g++-14-aarch64-linux-gnu_14.2.0-19cross1_amd64.deb \
  binutils-aarch64-linux-gnu_2.44-3_amd64.deb \
  libc6-arm64-cross_2.41-11cross1_all.deb libc6-dev-arm64-cross_2.41-11cross1_all.deb \
  linux-libc-dev-arm64-cross_6.12.38-1cross1_all.deb \
  libgcc-s1-arm64-cross_14.2.0-19cross1_all.deb libgcc-14-dev-arm64-cross_14.2.0-19cross1_all.deb \
  libatomic1-arm64-cross_14.2.0-19cross1_all.deb \
  libstdc++6-arm64-cross_14.2.0-19cross1_all.deb libstdc++-14-dev-arm64-cross_14.2.0-19cross1_all.deb \
  libisl23_0.27-1_amd64.deb libmpc3_1.3.1-1+b3_amd64.deb libmpfr6_4.2.2-1_amd64.deb \
  libgmp10_6.3.0+dfsg-3_amd64.deb libjansson4_2.14-2+b3_amd64.deb libsframe1_2.44-3_amd64.deb; do
  member=$(ar t "$DEPS/downloads/$deb" | grep '^data\.tar')
  case "$member" in *.xz) z=-J ;; *.zst) z=--zstd ;; *.gz) z=-z ;; *) z= ;; esac
  ar p "$DEPS/downloads/$deb" "$member" | tar -x $z -f - -C "$part"
done
for t in gcc g++ ar ranlib strip nm objdump readelf; do
  real=aarch64-linux-gnu-$t
  case $t in gcc | g++) real=$real-14 ;; esac
  [ -x "$part/usr/bin/$real" ] || { echo "MALI_DEQP_TOOLCHAIN: no usr/bin/$real in the packages" >&2; exit 1; }
  sysroot=
  case $t in gcc | g++) sysroot='--sysroot="$root"' ;; esac
  printf '#!/bin/sh\n# MALI_DEQP_TOOLCHAIN (tools/cts/deps.toml): Debian trixie'"'"'s %s with its own host libraries.\nroot=$(cd "$(dirname "$0")/.." && pwd)\nLD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$root/usr/bin/%s" %s "$@"\n' \
    "$real" "$real" "$sysroot" > "$part/bin/aarch64-linux-gnu-$t"
  chmod +x "$part/bin/aarch64-linux-gnu-$t"
done
"$part/bin/aarch64-linux-gnu-g++" --version > /dev/null
mv "$part" "$DEPS/debian-trixie-arm64-cross"
'''
packages.apt = ["binutils", "xz-utils", "zstd", "libzstd1", "zlib1g", "cmake", "ninja-build", "python3", "git"]
packages.portage = ["sys-devel/binutils", "app-arch/xz-utils", "app-arch/zstd", "sys-libs/zlib", "dev-build/cmake", "dev-build/ninja", "dev-vcs/git"]

