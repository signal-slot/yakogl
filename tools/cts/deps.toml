[[dep]]
name = "DEQP_GLES3_TEST_DIR"
path = "VK-GL-CTS-gles3/data/gles3/shaders"
marker = "VK-GL-CTS-gles3/data/gles3/shaders/arrays.test"
note = "the dEQP GLES3 shader corpus (*.test) of VK-GL-CTS at 93bca01, the commit DEQP_WORK pins: the corpus part of tests/es3_shaderc_corpus.rs runs only when this names it. A sparse checkout of data/gles3/shaders alone (no external/fetch_sources.py), in a directory of its own: DEQP_WORK takes any $DEPS/VK-GL-CTS/.git as a complete tree, so a partial one there would break the board build. DEQP_WORK's clone is the source when it has the commit (no network), else one blobless commit from GitHub. Test data: read it, never run anything from it"
build = '''
want=93bca01861b0e3ef3c387027a9791e6d065f900c
part="$DEPS/VK-GL-CTS-gles3.part"
rm -rf "$part"
if git -C "$DEPS/VK-GL-CTS" cat-file -e "$want^{commit}" 2>/dev/null; then
  git clone -q --no-checkout "$DEPS/VK-GL-CTS" "$part"
else
  git init -q "$part"
  git -C "$part" remote add origin https://github.com/KhronosGroup/VK-GL-CTS
  git -C "$part" fetch -q --depth 1 --filter=blob:none origin "$want"
fi
git -C "$part" sparse-checkout set --no-cone /data/gles3/shaders/
git -C "$part" checkout -q --detach "$want"
mv "$part" "$DEPS/VK-GL-CTS-gles3"
'''
packages.apt = ["git"]
packages.portage = ["dev-vcs/git"]

[[dep]]
name = "LZ4"
path = "lz4/bin/lz4"
marker = "lz4/bin/lz4"
note = "the lz4 command of the am62p second-stage LZ4 vectors (tools/am62p-mkboot.py reads $LZ4, else lz4 on PATH), built from the upstream v1.10.0 release without root; the distribution package (ZEPHYR_WS packages) is the other way to have it"
build = '''
rm -rf "$DEPS/lz4.part"
mkdir -p "$DEPS/lz4.part/src"
tar -xzf "$DEPS/downloads/lz4-1.10.0.tar.gz" -C "$DEPS/lz4.part/src" --strip-components=1
make -C "$DEPS/lz4.part/src" -j"$(nproc)" lz4
mkdir -p "$DEPS/lz4.part/bin"
cp "$DEPS/lz4.part/src/programs/lz4" "$DEPS/lz4.part/bin/lz4"
rm -rf "$DEPS/lz4.part/src" "$DEPS/lz4"
mv "$DEPS/lz4.part" "$DEPS/lz4"
'''
packages.apt = ["make", "gcc"]
packages.portage = ["dev-build/make", "sys-devel/gcc"]

[[dep.inputs]]
url = "https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[[dep]]
name = "MP2_QEMU"
path = "mp2-qemu/bin/qemu-system-aarch64"
marker = "mp2-qemu/bin/qemu-system-aarch64"
note = "the qemu-system-aarch64 of the uboot-mp2 qemu row of tools/check.sh (driver/tools/uboot-mp2/qemu/run.sh reads $MP2_QEMU; without it the row is a gap): upstream QEMU 10.0.2, the version that row was first tested with, aarch64-softmmu only, with the virt machine, sdhci-pci, sd-card, e1000 and user-mode networking (slirp, TFTP). Built without root and without a distribution package beyond the gate's own build tools: glib 2.84.1 (with pcre2 10.45 and libffi 3.4.8 linked in) and libslirp 4.9.1 are built from their pinned sources, with QEMU's own bundled meson (the host's may be older than glib's minimum). What stays is bin/qemu-system-aarch64, the two libraries it loads in lib/ (found through an $ORIGIN rpath, so the directory can be moved) and e1000's option ROM in share/qemu/, 35 MB; the build fails unless the binary has the devices drive.py asks for. The bundled dtc builds with -Werror, and the const-preserving memchr of a newer glibc (2.43, checked 2026-11-23) makes two of its lines warn, so that one warning stays a warning. About 7 minutes on 4 cores (431 s, 2026-11-23), once. The gate workflow builds this entry when it is absent"
build = '''
p="$DEPS/mp2-qemu.part"
rm -rf "$p"
mkdir -p "$p/src" "$p/lib" "$p/share/qemu"
cd "$p/src"
for t in qemu-10.0.2.tar.xz pcre2-10.45.tar.gz libffi-3.4.8.tar.gz glib-2.84.1.tar.xz libslirp-v4.9.1.tar.gz; do
  tar -xf "$DEPS/downloads/$t"
done
# QEMU's own meson for every meson build: the host's may be older than glib's minimum.
python3 -m venv venv
venv/bin/pip install -q --no-index qemu-10.0.2/python/wheels/meson-*.whl
# the libraries go to a prefix of the build only; QEMU's lib/ gets the two it loads
pre="$p/src/prefix"
export PATH="$p/src/venv/bin:$PATH" PKG_CONFIG_PATH="$pre/lib/pkgconfig"
j=$(nproc)
(cd pcre2-10.45 && ./configure -q --prefix="$pre" --libdir="$pre/lib" --disable-shared --with-pic && make -s -j"$j" && make -s install) > /dev/null
(cd libffi-3.4.8 && ./configure -q --prefix="$pre" --libdir="$pre/lib" --disable-shared --with-pic --disable-docs && make -s -j"$j" && make -s install) > /dev/null
meson setup --wrap-mode=nodownload --prefix="$pre" --libdir=lib --buildtype=release \
  -Dtests=false -Dintrospection=disabled -Dnls=disabled -Dman-pages=disabled -Ddocumentation=false \
  -Dselinux=disabled -Dxattr=false -Dlibmount=disabled -Dsysprof=disabled -Dlibelf=disabled \
  glib-2.84.1/build glib-2.84.1
meson install -C glib-2.84.1/build --quiet
meson setup --wrap-mode=nodownload --prefix="$pre" --libdir=lib --buildtype=release libslirp-v4.9.1/build libslirp-v4.9.1
meson install -C libslirp-v4.9.1/build --quiet
mkdir qemu-build
cd qemu-build
../qemu-10.0.2/configure --prefix="$p/src/qemu" --target-list=aarch64-softmmu \
  --without-default-features --enable-tcg --enable-slirp --enable-fdt=internal \
  --disable-docs --disable-werror --disable-debug-info --disable-install-blobs \
  --extra-cflags=-Wno-error=discarded-qualifiers \
  --extra-ldflags='-Wl,-rpath,$ORIGIN/../lib -Wl,--disable-new-dtags'
make -s -j"$j" qemu-system-aarch64
cd ..
mkdir "$p/bin"
cp qemu-build/qemu-system-aarch64 "$p/bin/"
cp -P "$pre"/lib/libglib-2.0.so.0* "$pre"/lib/libslirp.so.0* "$p/lib/"
# e1000's option ROM (QEMU loads it from <bin>/../share/qemu)
cp qemu-10.0.2/pc-bios/efi-e1000.rom "$p/share/qemu/"
cd "$p"
rm -rf "$p/src"
# what run.sh (drive.py) asks for: the virt machine and these devices
devs=$(bin/qemu-system-aarch64 -machine virt -device help)
for d in sdhci-pci sd-card e1000; do
  grep -q "name \"$d\"" <<<"$devs" || { echo "MP2_QEMU: no device $d"; exit 1; }
done
nets=$(bin/qemu-system-aarch64 -machine virt -netdev help)
grep -qx user <<<"$nets" || { echo "MP2_QEMU: no user-mode network"; exit 1; }
rm -rf "$DEPS/mp2-qemu"
mv "$p" "$DEPS/mp2-qemu"
'''
packages.apt = ["gcc", "make", "python3", "python3-venv", "ninja-build", "pkg-config", "xz-utils", "zlib1g-dev"]
packages.portage = ["sys-devel/gcc", "dev-build/make", "dev-lang/python", "dev-build/ninja", "virtual/pkgconfig", "app-arch/xz-utils", "sys-libs/zlib"]

[[dep.inputs]]
url = "https://download.qemu.org/qemu-10.0.2.tar.xz"
sha256 = "ef786f2398cb5184600f69aef4d5d691efd44576a3cff4126d38d4c6fec87759"

