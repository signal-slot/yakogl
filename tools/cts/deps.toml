note = "the host tools of the Verdin iMX95's microSD card that a host may lack, unpacked without root: Debian trixie's debootstrap 1.0.141 (its first stage under fakeroot), debian-archive-keyring 2025.1 (the keys debootstrap checks the trixie Release with) and mtools 4.0.48 (the card's FAT partition, no loop mount), .debs of snapshot.debian.org at 20261101T000000Z. Run debootstrap with DEBOOTSTRAP_DIR=<this>/usr/share/debootstrap"
build = '''
part="$DEPS/debian-trixie-sdtools.part"
rm -rf "$part"
mkdir -p "$part"
for deb in debootstrap_1.0.141_all.deb debian-archive-keyring_2025.1_all.deb mtools_4.0.48-1_amd64.deb; do
  member=$(ar t "$DEPS/downloads/$deb" | grep '^data\.tar')
  case "$member" in *.xz) z=-J ;; *.zst) z=--zstd ;; *.gz) z=-z ;; *) z= ;; esac
  ar p "$DEPS/downloads/$deb" "$member" | tar -x $z -f - -C "$part"
done
"$part/usr/bin/mcopy" --version > /dev/null
mv "$part" "$DEPS/debian-trixie-sdtools"
'''
packages.apt = ["binutils", "xz-utils", "zstd", "fakeroot", "wget", "dosfstools", "e2fsprogs", "fdisk"]
packages.portage = ["sys-devel/binutils", "app-arch/xz-utils", "app-arch/zstd", "sys-apps/fakeroot", "net-misc/wget", "sys-fs/dosfstools", "sys-fs/e2fsprogs", "sys-apps/util-linux"]

