note = "Debian trixie's qemu-system-arm 10.0.13 with the trixie amd64 libraries it loads (all but libc6, which is the host's: glibc >= 2.41), unpacked without root: the microSD card's second debootstrap stage runs in it on the generic virt machine (tools/mali/panthor/imx95-sdcard.sh). The .debs of snapshot.debian.org at 20261101T000000Z, the closure of `apt install qemu-system-arm` less the essential set. bin/qemu-system-aarch64 sets LD_LIBRARY_PATH to those libraries and QEMU_MODULE_DIR to its own modules (a host's qemu modules of another build abort it)"
