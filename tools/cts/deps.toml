  ar p "$DEPS/downloads/$deb" "$member" | tar -x $z -f - -C "$part"
done
printf '#!/bin/sh\n# IMX95_QEMU_SYSTEM (tools/cts/deps.toml): Debian trixie'"'"'s qemu-system-aarch64 with its own host libraries.\nroot=$(cd "$(dirname "$0")/.." && pwd)\nexport QEMU_MODULE_DIR="$root/usr/lib/x86_64-linux-gnu/qemu"\nLD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$root/usr/bin/qemu-system-aarch64" -L "$root/usr/share/qemu" "$@"\n' > "$part/bin/qemu-system-aarch64"
chmod +x "$part/bin/qemu-system-aarch64"
"$part/bin/qemu-system-aarch64" --version > /dev/null
mv "$part" "$DEPS/qemu-system-arm-trixie"
'''
