# Opt-in console for the i.MX8MP dEQP images (IMX8MP_CONSOLE=1 in
# tools/cts/imx8mp-deqp-build.sh): the Verdin UART_3 (i.MX8MP UART3, Linux
# ttymxc2) on the Mallow debug header X11. The board devicetree already has
# zephyr,console = &uart3, so no overlay is needed.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
