# Opt-in UART console for the i.MX8MP dEQP image: IMX8MP_CONSOLE=1 tools/cts/imx8mp-deqp-build.sh ...
# appends this fragment. The board DTS (driver/boards/toradex/verdin_imx8mp) already chooses
# zephyr,console = &uart3 (the Verdin UART_3, i.MX8MP UART3) at 115200 8N1, so no overlay is needed.
# The image then prints the sample's "deqp: <Status> <case>" lines (tools/cts/deqp-uart-tally.py reads
# them), the "gc_wdog_arm: armed" line and any GPU recovery message. The default image has none of this:
# the board conf leaves CONFIG_UART_CONSOLE=n.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
