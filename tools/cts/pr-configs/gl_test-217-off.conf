#
# gl_test case 217 (forcedpr), the partial-render knob OFF, the free list
# capped at 512 pages (tools/cts/log/2026-11-02-pr-217probe image A,
# tools/cts/log/2026-10-31-pr-negative): the known negative, the
# out-of-memory notice at a list at its maximum ending in the at-maximum
# stop, cause 2. pr-session.sh --leg 217-off builds with this file; it
# pairs with gl_test-217-on.conf, which differs only in the knob;
# tools/cts/pr-configs/selftest.sh keeps that so.
CONFIG_GL_TEST_CASES="217"
CONFIG_YAKOGL_DRV_GPU_PVR_PARTIAL_RENDER=n
CONFIG_YAKOGL_DRV_GPU_PVR_FL_PROBE_MAX_PAGES=512
CONFIG_GL_TEST_FORCEDPR_LAYERS=1220
