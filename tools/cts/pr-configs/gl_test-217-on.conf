#
# gl_test case 217 (forcedpr), the partial-render knob ON, the free list
# capped at 512 pages (tools/cts/log/2026-11-02-pr-217probe image B). Pairs
# with gl_test-217-off.conf, which differs only in the knob;
# tools/cts/pr-configs/selftest.sh keeps that so.
CONFIG_GL_TEST_CASES="217"
CONFIG_YAKOGL_DRV_GPU_PVR_PARTIAL_RENDER=y
CONFIG_YAKOGL_DRV_GPU_PVR_FL_PROBE_MAX_PAGES=512
CONFIG_GL_TEST_FORCEDPR_LAYERS=1220
