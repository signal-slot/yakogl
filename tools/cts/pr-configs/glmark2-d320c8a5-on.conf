#
# glmark2 in d320c8a5's configuration (one kick in flight; AM62P 2026-10-04,
# docs/notes/pvr-render-pool.md "The one-kick-in-flight run: d320c8a5"), the
# partial-render knob ON: the refused grow at A = 0 must complete through the
# firmware's partial render (the note's "first board measurement", step 2).
# The same Kconfig that `tools/cts/pr-session.sh <name> --knob on --glmark2
# --one-in-flight` passes to the glmark2 image as -D options;
# tools/cts/pr-configs/selftest.sh keeps the two equal.
CONFIG_GLMARK2_PVR_ONE_KICK_IN_FLIGHT=y
CONFIG_YAKOGL_DRV_GPU_PVR_PARTIAL_RENDER=y
CONFIG_YAKOGL_DRV_GPU_PVR_FL_PROBE_MAX_PAGES=0
