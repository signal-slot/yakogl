#
# gl_test case 217 (forcedpr), run C's fallback configuration, the
# partial-render knob OFF: no grow reserve, no cap (the list is free to ask
# for a grow), 1220 layers (tools/cts/log/2026-11-02-pr-217probe image C is
# the knob-on image of this configuration). Pairs with
# gl_test-217-runC-on.conf, which differs only in the knob;
# tools/cts/pr-configs/selftest.sh keeps that so.
CONFIG_GL_TEST_CASES="217"
CONFIG_YAKOGL_DRV_GPU_PVR_PARTIAL_RENDER=n
CONFIG_YAKOGL_DRV_GPU_PVR_FL_PROBE_MAX_PAGES=0
CONFIG_YAKOGL_DRV_GPU_PVR_FL_PROBE_NO_RESERVE=y
CONFIG_GL_TEST_FORCEDPR_LAYERS=1220
