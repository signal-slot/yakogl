#
# The triangle example's staticlib (examples/triangle): the scene (vertices,
# clear colour, shader texts) and the check, both from the check crate
# (../check), behind the C entry points main.c calls. A workspace member, so
# the image builds it the way it builds every Rust archive
# (yakogl_add_rust_archive, capi/yakogl_capi.cmake): the workspace's release
# profile, and -Z build-std=core only when the toolchain has no core for the
# target.
[package]
name = "yakogl-example-triangle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "triangle_sample"
path = "src/lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
triangle-check = { package = "yakogl-triangle-check", path = "../check", features = ["printk"] }
