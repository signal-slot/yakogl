#
# The triangle and its check, the one definition for both triangle examples
# (examples/triangle and examples/triangle-rust, driver/docs/one-method.md
# section 5, step 3): the vertices, the clear colour and the shader texts
# they draw, v3d_gl_triangle's whole-window classification of the result,
# the report they print and the PICTURE record's words. no_std, no
# dependencies: both examples' staticlibs link it for aarch64-unknown-none, and
# `cargo test -p yakogl-triangle-check` runs it on the host against
# synthetic frames.
[package]
name = "yakogl-triangle-check"
description = "The triangle examples' scene and frame check, the same on every board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "triangle_check"
path = "src/lib.rs"
doctest = false
bench = false

[features]
# The Zephyr console (src/console.rs): a writer over printk, for the
# examples' image builds only (aarch64-unknown-none); the host tests leave it
# off.
printk = []
