# The one Slint sample: the same configuration on every board. What a board
# needs beyond it (its GPU driver, display path, memory) is the board
# layer's app.conf and app.overlay, selected by the Zephyr board; the window, the screen, the watchdog, the
# records and the end of the run are the board layer's (yakogl_board.h).
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y
# The in-process shader compiler on every board (the offline table is being
# retired; the V3D has no other back end).
CONFIG_YAKOGL_SHADERC_ONLINE=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y

# Slint's gauge geometry and FemtoVG's tessellation are float work; the Rust
# archive is hard-float.
CONFIG_FPU=y

# Slint layout and FemtoVG path flattening have deep call chains and the item
# tree renders recursively; the online compiler needs 256 KiB too.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_STACK_SENTINEL=y

# Slint and FemtoVG allocate from the UI heap in src/main.c (a sys_heap); the
# C heap holds glShaderSource's copies only.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
