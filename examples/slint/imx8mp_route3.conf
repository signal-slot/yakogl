# SafeUI route 3 on the Verdin iMX8M Plus direct image
# (docs/notes/imx8mp-direct-boot.md, "Route 3"), on top of the board's
# conf for slint (driver/zephyr/lib/board/imx8mp/slint_direct.conf):
#
#   west build -b verdin_imx8mp/mimx8ml8/a53/direct examples/slint -- \
#       -DEXTRA_CONF_FILE=imx8mp_route3.conf \
#       -DCONFIG_YAKOGL_BOARD_IMX8MP_ROUTE3_M7_ELF=\"<the SafeUI M7 ELF>\" ...
#
# The image carries the M7 firmware, brings the panel up on the first frame,
# releases the M7 and publishes every later frame to the SafeUI frame ring;
# the M7 blends the safety layer in and flips the panel. The cluster is drawn
# without the safe core's elements, over a flat background, from the vehicle
# state the M7 publishes. Two windows (the direct conf's), so the one drawn is
# never the one the M7 or the LCDIF reads.
CONFIG_YAKOGL_BOARD_IMX8MP_ROUTE3=y
# (The demo runs for ever and WDOG1 is fed while the loop is alive: the
# board's direct conf says so for both images.)
