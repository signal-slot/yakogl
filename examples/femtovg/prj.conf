# The femtovg example: the same configuration on every board. What a board
# needs beyond it (its GPU driver, display path, memory) is the board layer's
# app.conf and app.overlay (driver/zephyr/lib/board/<board>/), which
# ../zephyr.cmake applies for the Zephyr board; the window, the screen, the
# watchdog, the records and the end of the run are the board layer's too
# (yakogl_board.h).
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y
# The in-process shader compiler on every board (the V3D has no other back
# end): femtovg's programs are built from its shader text at run time.
CONFIG_YAKOGL_SHADERC_ONLINE=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y

# femtovg's tessellation is float work; the Rust archive is hard-float.
CONFIG_FPU=y

# femtovg's path flattening has deep call chains, and the online compiler
# runs on this thread and needs 256 KiB (zephyr/Kconfig,
# YAKOGL_SHADERC_ONLINE).
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_STACK_SENTINEL=y

# femtovg allocates through the C heap (rust/src/lib.rs: aligned_alloc and
# free): its canvas, path and gradient buffers, the old samples' 16 MiB.
# glShaderSource keeps a copy of each source there too.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216
