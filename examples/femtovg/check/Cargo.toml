#
# The femtovg example's scene and its check (examples/femtovg): what the
# example draws with femtovg (a clear, a rounded rect, a gradient rect and a
# stroked polyline), v3d_gl_femtovg's whole-window classification of the
# result, the report it prints and the record words. no_std: the example's
# staticlib links it for aarch64-unknown-none, and
# `cargo test -p yakogl-femtovg-check` runs it on the host against synthetic
# frames. The window reader, the console and PICTURE's packing are the
# triangle check's, by path (one copy).
[package]
name = "yakogl-femtovg-check"
description = "The femtovg example's scene and frame check, the same on every board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "femtovg_check"
path = "src/lib.rs"
doctest = false
bench = false

[dependencies]
triangle-check = { package = "yakogl-triangle-check", path = "../../triangle/check" }

[features]
# The Zephyr console (triangle_check's console.rs), for the example's image
# build only (aarch64-unknown-none); the host tests leave it off.
printk = ["triangle-check/printk"]
