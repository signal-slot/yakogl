# The display driver alone: no panel console, no GPU. main() fills a buffer
# of its own with a colour ramp and asks the driver to scan it out.
CONFIG_SAFEUI_GPU_VIVANTE=n
CONFIG_GC_COMMON_PANEL_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_CACHE_MANAGEMENT=y
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
