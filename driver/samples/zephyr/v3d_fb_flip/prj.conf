# The console is the mini UART only: the framebuffer holds the test pattern.
CONFIG_PRINTK=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_MAIN_STACK_SIZE=8192
# The 1920x1440 framebuffer (about 11 MiB) and the mailbox and PM blocks are
# mapped with device_map(): room for them in the kernel's virtual space.
CONFIG_MAX_XLAT_TABLES=32
CONFIG_KERNEL_VM_SIZE=0x8000000
