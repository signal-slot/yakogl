CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_SAFEUI_GPU_VIVANTE_LOG_LEVEL_DBG=y

CONFIG_LOG=y
CONFIG_CACHE_MANAGEMENT=y

# The console is the DSI panel: this carrier has no reachable UART, so printk
# is rendered into the framebuffer Linux left scanning out (gc_common).
# LOG_MODE_MINIMAL sends LOG_* through printk; the board defconfig turns the
# UART console on, and only prj.conf can turn it back off.
CONFIG_GC_COMMON_PANEL_CONSOLE=y
# ... and when Linux left the panel off (the normal kexec route), turn it on
# ourselves. The bridge is on I2C behind a GPIO, so the display driver needs
# both subsystems; without them CONFIG_SAFEUI_DISPLAY_IMX8MP compiles out and
# only the adopt path is left.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UART_CONSOLE=n

# The way back to Linux: reset the SoC through PSCI when done.
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y
