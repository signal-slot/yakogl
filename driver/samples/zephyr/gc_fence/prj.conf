# gc_fence: the same configuration on every board. The GPU driver, the
# display path, the memory and the watchdog are the board layer's app.conf
# (driver/zephyr/lib/board/<board>/), which examples/zephyr.cmake applies; the
# record and the end of the run are the board layer's too (yakogl_board.h).
# No GL call is made, but the board layer is compiled against YakoGL's EGL
# headers (board_imx8mp.c, sample_glue.c), so YakoGL is on.
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
