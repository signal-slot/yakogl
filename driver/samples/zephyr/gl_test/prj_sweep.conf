# The full-list sweep: 48 case numbers per run from GC_GL_TEST_SWEEP_FIRST,
# each result in the SNVS SWEEP record (gc_result.h) as it finishes, with the
# in-process online compiler and the ES 1.00 shader set (build with
# -DGL_TEST_ES100=ON) and the 256 KiB main stack the online compiler needs.
#
#   west build ... gc_gl_test -- -DEXTRA_CONF_FILE=prj_sweep.conf -DGL_TEST_ES100=ON \
#       -DCONFIG_GC_GL_TEST_SWEEP_FIRST=48
CONFIG_GC_GL_TEST_SWEEP=y
CONFIG_YAKOGL_SHADERC_ONLINE=y
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_STACK_SENTINEL=y

# 48 cases on one context take far longer than one; the supervisor's deadline
# is the run's bound (the watchdog stays fed by the supervisor until the
# deadline, then the board comes back).
CONFIG_GC_GL_TEST_DEADLINE_SECONDS=900

# Minutes-long by design, not hung: stress (25), heavy (26) and perf (39) are
# for their own runs.
CONFIG_GC_GL_TEST_SKIP="25,26,39"
