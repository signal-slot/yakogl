# The i.MX8M Plus boards (verdin_imx8mp, armadillo_x2): added by CMakeLists.txt.
# The Vivante GC7000UL driver and YakoGL's Vivante backend, and the board
# support of yakogl_gc_board: the GIC EOI fix, the interrupt guard, the
# watchdog, the SNVS result record, the panel console.
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
CONFIG_YAKOGL_GC_BOARD=y

# The console is the DSI panel (the board layer); LOG_* through printk. The
# suite prints one line per case, which is more than a panel holds, so the
# verdict travels in the hold time instead (see src/main_imx8mp.c).
CONFIG_GC_COMMON_PANEL_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UART_CONSOLE=n
CONFIG_GC_COMMON_PANEL_CONSOLE_SCALE=2

CONFIG_FPU_SHARING=n

# The way back to Linux: reset the SoC through PSCI when done.
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=y
