# YakoGL on the NanoPC-T6's Mali-G610, with the in-process compiler (the
# Mali's only shader back end), over our own kernel side
# (src/osal/zephyr_mali.c, board::nanopc_t6_osal). The carve-out and the
# tiler heap's chunks keep zephyr/Kconfig's defaults (32 MiB, five 2 MiB
# chunks): with them the image takes about 81 MiB of the board's 256 MiB
# window (nanopc_t6.dts, zephyr,sram). That memory is .noinit, so it is not
# in zephyr.bin (about 4 MiB; kexec_zephyr reads at most 64 MiB): raise
# either with the window in view.
CONFIG_YAKOGL_GPU_MALI=y

# The console is uart2 (the board defconfig), the record the runner keeps;
# LOG_* through printk, so no line waits in a log thread when the image
# resets.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y

# A stack overflow must fault where it happens (as the AM62P image): the
# sentinel checks the lowest stack word at every context switch.
CONFIG_STACK_SENTINEL=y

# The MMU's tables: the image's regions (text, rodata, data, bss, noinit;
# the OSAL makes its block of noinit uncached in place, in whole 2 MiB
# entries that take no table) and the device maps (the GPU's 2.5 MiB, the
# CRU, the PMU, SPI2, the GPU's QoS, WDT0, uart2, the GIC). t6_submit has 32
# for a 4 MiB image; the arm64 MMU code k_panic()s when they run out, so
# twice that, as the Pi 4's 96 MiB gl_test image.
CONFIG_MAX_XLAT_TABLES=64

# The watchdog (driver/zephyr/lib/board/nanopc_t6): WDT0 is fed until 300 s of
# uptime, the regression set's run included (not measured on the board yet),
# and only while t6_watchdog_feed() comes at most 30 s apart: the OSAL feeds it
# in every delay (its waits poll), and main_nanopc_t6.c at every case's end. A
# case that computes on the CPU for longer than 30 s without a GPU wait is
# reset as a hang.
CONFIG_YAKOGL_NANOPC_T6_LIFETIME_S=300
CONFIG_YAKOGL_NANOPC_T6_ALIVE_S=30
