# The Armadillo-X2 has its console on UART2, wired to the host: print there,
# not into the picture. The panel console would take printk over. Added by
# CMakeLists.txt after imx8mp.conf.
CONFIG_UART_CONSOLE=y
CONFIG_GC_COMMON_PANEL_CONSOLE=n
# This board is run by tools/board.sh x2 only, which refuses an image that
# does not print "gc_wdog_arm: armed", so every X2 gl_test arms WDOG1 itself
# (a -DCONFIG_GC_BOARD_WDOG_SELF_ARM=n on the command line still wins). The
# YAKOGL_DRV_DISPLAY_RUST it selects only links the yakogl-drivers crate
# (ip::imx_wdog): the display stays the LCDIF3 adopt driver, and the image
# builds as it is (2026-11-06, 1673798c).
CONFIG_GC_BOARD_WDOG_SELF_ARM=y
