# Verdin AM62P entered from Torizon Linux with tools/kexec-zephyr: bring the
# DSI panel up with the display drivers (used by the panel modes), run
# the cases, keep the result for the camera, then reset back into Linux.
CONFIG_YAKOGL_DRV_GPU_PVR=y

# A stack overflow must fault where it happens, not in another thread later.
# The A53 has no MPU, so HW_STACK_PROTECTION is not available on arm64 Cortex-A
# (ARM64_STACK_PROTECTION depends on ARM_MPU); the sentinel checks the lowest
# stack word at every context switch. A large frame can step over it, so it
# narrows the blind spot rather than closing it.
CONFIG_STACK_SENTINEL=y

CONFIG_YAKOGL_SAMPLE_HOLD_SECONDS=20
CONFIG_YAKOGL_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
# The RTI watchdog Linux leaves running (kexec entry): fed for 150 s, then a
# hung image is reset by it.
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT=y
# The bound, for whichever feeder runs (common/Kconfig).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=150

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_YAKOGL_DRV_SN65DSI8X_SELF_START_INIT_PRIORITY=95

# Console on main_uart0 (Verdin UART_3, the X18 debug USB).
CONFIG_LOG_MODE_MINIMAL=y
# Early UART markers ('H', 'K') for boots that never reach the banner.
CONFIG_SOC_AM62PX_A53_BOOT_MARKER=y
