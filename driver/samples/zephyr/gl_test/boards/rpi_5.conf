# YakoGL on the Raspberry Pi 5's V3D 7.1 (BCM2712 D0, V3D 7.1.10), with the
# in-process compiler (the V3D's only shader back end). The 7.1 table is chosen
# when the image is built (docs/notes/v3d71-gl-table.md, section 4): the
# YAKOGL_GPU_V3D71 symbol beside YAKOGL_GPU_V3D (zephyr/Kconfig), the OSAL
# src/osal/zephyr_v3d71.c. It selects the board layer's PM watchdog
# (YAKOGL_RPI5_WDOG, held for V3D_GL_TEST_HOLD_S: the sample's Kconfig) and
# the firmware mailbox (YAKOGL_RPI5_MBOX, the V3D clock).
CONFIG_YAKOGL_GPU_V3D=y
CONFIG_YAKOGL_GPU_V3D71=y
# 48 MiB of GPU memory (a static of the image; see the board overlay), as on
# the Pi 4.
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=50331648

# The console is the board defconfig's uart10, as in the rpi5 probes: the
# Pi 5's mailbox framebuffer (YAKOGL_BOARD_RPI5) is not proven on the board
# yet (driver/docs/rpi5-display.md), so this image has no screen.
CONFIG_PRINTK=y
CONFIG_LOG_MODE_MINIMAL=y

# The Rust archive is hard-float, and the GL calls and the compiler use the
# FPU; one thread calls GL, but the logging and timer threads exist too.
CONFIG_FPU_SHARING=y

# glShaderSource keeps a copy of the source, and the GL core's staging.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# Address space: the image (96 MiB of RAM, the overlay), the carve-out's
# non-cacheable alias (48 MiB) and the device blocks (the hub, the core, pm,
# the SMS and the mailbox, above 4 GiB). The arm64 MMU code k_panic()s when
# its translation tables run out; the probes need 16 for their 32 MiB.
CONFIG_MAX_XLAT_TABLES=64
CONFIG_KERNEL_VM_SIZE=0x10000000
