# Armadillo-X2 started by TF-A at power-on (docs/notes/x2-direct-boot.md): there
# is no display node (nothing powered MEDIAMIX or LCDIF3), so the display driver
# is off; saying so here keeps imx8mp.conf's "y" from becoming a Kconfig warning.
# Added by CMakeLists.txt after armadillo_x2.conf (the console is UART2).
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=n
