# The STM32MP257F-DK's A35 (Vivante GCNanoUltra31, 0x8000/0x6205). The board
# layer's app.conf (the Vivante driver, OP-TEE's watchdog, no hold) is added
# by CMakeLists.txt; this is what gl_test needs beyond it.
#
# The board layer (yakogl_board.h): the yk-record line on USART2 and the
# end of the run, PSCI SYSTEM_RESET back into ST's Linux (src/main_stm32mp2.c).
CONFIG_YAKOGL_BOARD=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_MINIMAL=y
# The layer resets the board this long after boot whatever the suite does;
# tools/board-stm32mp2.sh waits RUN_BOUND (120 s) for the image's end. One
# case with its shader compiles takes seconds; a longer list needs both
# raised (README.md).
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=100
