CONFIG_SAFEUI_GPU_PVR=y
CONFIG_YAKOGL=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FPU=y
CONFIG_CACHE_MANAGEMENT=y

# glShaderSource keeps a copy of every source (malloc); the cases compile many
# shaders. The GL core keeps its per-draw scratch static, but gl_test's own
# frames are large.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
# 256 KiB: the in-process shader compiler runs on this thread when the image
# is built with it (docs/online-shaderc/frontend.md, "Stack"); 64 KiB
# overflowed into the idle thread on the AM62P.
CONFIG_MAIN_STACK_SIZE=262144

# A stack overflow must fault where it happens, not in another thread later.
# The A53 has no MPU, so HW_STACK_PROTECTION is not available on arm64 Cortex-A
# (ARM64_STACK_PROTECTION depends on ARM_MPU); the sentinel checks the lowest
# stack word at every context switch. A large frame can step over it, so it
# narrows the blind spot rather than closing it.
CONFIG_STACK_SENTINEL=y

# Needs the ES 3.0 report (YakoGL reports ES 2.0 by default): the "#version 300 es" gl_test cases run only on an ES 3.0 context.
CONFIG_YAKOGL_REPORT_ES2=n
