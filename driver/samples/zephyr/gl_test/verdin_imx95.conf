# YakoGL on the Verdin iMX95's Mali-G310, with the in-process compiler (the
# Mali's only shader back end), over our own kernel side, as the NanoPC-T6's
# image (boards/nanopc_t6.conf). Merged after the board layer's app.conf
# (../common/verdin_imx95.cmake says why it is not boards/<board>.conf), which
# gives the Mali, the console, the minimal log mode and the MMU's tables. The
# carve-out is app.conf's: zephyr/Kconfig's 32 MiB default for the GL side, as
# the T6's gl_test image, plus the 8800 KiB of window memory at its end.
CONFIG_YAKOGL_BOARD=y

# gl_test reads its pixels back; the X4 panel only on request
# (-DCONFIG_YAKOGL_VERDIN_IMX95_DISPLAY=y).
CONFIG_YAKOGL_VERDIN_IMX95_DISPLAY=n

# A stack overflow must fault where it happens (as the T6's image).
CONFIG_STACK_SENTINEL=y

# The watchdog (driver/zephyr/lib/board/verdin_imx95): WDOG3 is fed until
# 300 s of uptime, the regression set's run included, and only while the
# board layer's alive mark comes at most 30 s apart: the OSAL sets it in every
# delay, and src/main_mali.c at every case's end. As the T6's image.
CONFIG_YAKOGL_BOARD_LIFETIME_S=300
CONFIG_YAKOGL_BOARD_ALIVE_S=30

# No picture to hold: board_finish() resets at once after the record.
CONFIG_YAKOGL_BOARD_HOLD_S=0
CONFIG_YAKOGL_BOARD_HOLD_FAIL_S=0
