# Opt-in overlay: the gl_test image with ES 3.0 multisample renderbuffers
# (the crate's `msaa-fbo` feature, docs/notes/es3-msaa-renderbuffers.md).
# Board-independent: the AM62P (PowerVR), the i.MX8MP and Armadillo-X2
# (GC7000UL), the NanoPC-T6 (Mali) and, once v3d-msaa-fbo lands, the Pi 4
# (V3D) report GL_MAX_SAMPLES 4 and draw into 4x framebuffer objects with it.
# Host-tested only, BOARD-UNVERIFIED, so no board file selects it. Build with
#
#   west build ... driver/samples/zephyr/gl_test -b <board> -- -DEXTRA_CONF_FILE=msaa-fbo.conf ...
#
# (several files: -DEXTRA_CONF_FILE="a.conf;msaa-fbo.conf").
CONFIG_YAKOGL_MSAA_FBO=y
