# The console is the HDMI framebuffer (driver/zephyr/lib/board/rpi4/fbcon.c): printk and
# LOG_* are drawn there. The mini UART stays on as well.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_MAIN_STACK_SIZE=8192
# The frame builder computes the viewport and the uniforms in float
# (v3d_frame.c); on arm64 Zephyr builds with -mgeneral-regs-only without it.
CONFIG_FPU=y

# Address space, as for v3d_clear (see its prj.conf): the board default of 8
# translation tables and 8 MiB of kernel virtual space was sized for a 512 KiB
# image. This one maps the same 3.6 MiB framebuffer and the V3D, PM, ASB and
# mailbox blocks with device_map(), and running out of tables is an assert
# before the console exists.
CONFIG_MAX_XLAT_TABLES=32
CONFIG_KERNEL_VM_SIZE=0x8000000
