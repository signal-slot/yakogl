# YakoGL on the Raspberry Pi 4's V3D, with the in-process compiler (the V3D's
# only shader back end). The GL reports ES 2.0, the conformance-tested surface.
CONFIG_YAKOGL=y
CONFIG_YAKOGL_SHADERC_ONLINE=y
CONFIG_YAKOGL_GPU_V3D=y
# 48 MiB of GPU memory (a static of the image; see the board overlay).
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=50331648

# The console is the HDMI framebuffer (driver/zephyr/lib/board/rpi4/fbcon.c): printk and
# LOG_* are drawn there. The mini UART stays on as well.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y

# The Rust archives are hard-float, and the GL calls and the compiler use the
# FPU; one thread calls GL, but the logging and timer threads exist too.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# The compiler runs on the thread that calls glCompileShader/glLinkProgram and
# needs 256 KiB of stack (zephyr/Kconfig, YAKOGL_SHADERC_ONLINE); FemtoVG's
# path flattening runs on it too.
CONFIG_MAIN_STACK_SIZE=262144
# FemtoVG allocates through the C heap (../gl_femtovg/rust: aligned_alloc and
# free); gl_femtovg gives it 16 MiB, and so does this. glShaderSource keeps a
# copy of each source there too.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216

# Address space: the image (96 MiB of RAM, the overlay), the carve-out's
# non-cacheable alias (48 MiB), the 3.6 MiB framebuffer and the device blocks.
CONFIG_MAX_XLAT_TABLES=64
CONFIG_KERNEL_VM_SIZE=0x10000000

