CONFIG_SAFEUI_GPU_PVR=y
CONFIG_YAKOGL=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FPU=y
CONFIG_CACHE_MANAGEMENT=y

# glShaderSource keeps a copy of the source (malloc); the GL core runs on the
# main thread (its per-draw scratch is static, but keep headroom).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
# CONFIG_MAIN_STACK_SIZE: see Kconfig (256 KiB with the online compiler).

# A stack overflow must fault where it happens, not in another thread later.
# The A53 has no MPU, so HW_STACK_PROTECTION is not available on arm64 Cortex-A
# (ARM64_STACK_PROTECTION depends on ARM_MPU); the sentinel checks the lowest
# stack word at every context switch. A large frame can step over it, so it
# narrows the blind spot rather than closing it.
CONFIG_STACK_SENTINEL=y

# crc32_ieee for the shared PICTURE record line.
CONFIG_CRC=y
