# Verdin AM62P entered from Torizon Linux with tools/kexec-zephyr: bring the
# DSI panel up with the SafeUI display drivers, draw into a full-screen
# XRGB8888 buffer in the image and show it as the DSS application plane,
# keep it for the camera, then reset back into Linux.
CONFIG_GL_TRIANGLE_WINDOW_PHYS=0
CONFIG_GL_TRIANGLE_WINDOW_WIDTH=1024
CONFIG_GL_TRIANGLE_WINDOW_HEIGHT=600
CONFIG_PVR_SAMPLE_HOLD_SECONDS=40
CONFIG_PVR_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
# The RTI watchdog Linux leaves running (kexec entry): fed for 150 s, then a
# hung image is reset by it.
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT=y
# The bound, for whichever feeder runs (common/Kconfig).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=150

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95

# Console on main_uart0 (Verdin UART_3, the X18 debug USB); DDR does not
# survive the reset, so a RAM console would be useless.
CONFIG_LOG_MODE_MINIMAL=y
# Bring-up knobs, off by default: CONFIG_PVR_SAMPLE_BOOT_TRACE=y prints a line
# per init priority band, CONFIG_SAFEUI_GPU_PVR_RENDER_VERBOSE=y dumps the render
# service's diagnostics after every frame.
