# Verdin AM62P started by the A53 SPL at power-on, in place of U-Boot proper
# (docs/direct-boot.md). The board's devicetree has the display path on, so
# there is no overlay: bring the DSI panel up from cold, draw, show the
# window, keep it for the camera, then reset, which boots this image again
# (each reset is another boot-time sample).
CONFIG_GL_TRIANGLE_WINDOW_PHYS=0
CONFIG_GL_TRIANGLE_WINDOW_WIDTH=1024
CONFIG_GL_TRIANGLE_WINDOW_HEIGHT=600
CONFIG_PVR_SAMPLE_HOLD_SECONDS=40
CONFIG_PVR_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
# The time since the R5 SPL started the GTC, at main() and at the first frame.
CONFIG_PVR_SAMPLE_BOOT_TIME=y

# Nothing started the RTI watchdog on this route: arm it here and feed it for
# 150 s, so a hung image is reset by it (after its 60 s period).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=150
CONFIG_YAKOGL_AM62P_RTI_SELF_ARM=y

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# RTI arm 47 -> I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95

# Console on main_uart0 (Verdin UART_3, the X18 debug USB), the UART the SPLs
# print on.
CONFIG_LOG_MODE_MINIMAL=y
