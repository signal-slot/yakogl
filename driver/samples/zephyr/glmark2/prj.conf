# The glmark2 image: the same configuration on every board. What a board
# needs beyond it (its GPU driver, display path, memory) is in boards/.
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y
# glmark2 builds its shaders at run time (options substituted into the
# sources): the in-process compiler.
CONFIG_YAKOGL_SHADERC_ONLINE=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_FPU=y

# glmark2 is C++17 with exceptions (-DUSE_EXCEPTIONS), std::map/std::string
# everywhere, std::filesystem::path and iostreams: the full libstdc++, as
# dEQP has (deqp/prj.conf, deqp/README.md).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
# The SDK's libstdc++.a is built with a 64-bit `long` int64_t
# (deqp/README.md, "Configuration that matters").
CONFIG_ENFORCE_ZEPHYR_STDINT=n
# getopt_long for Options::parse_args; std::chrono::steady_clock for the
# frame times (clock_gettime).
CONFIG_POSIX_API=y
CONFIG_POSIX_C_LIB_EXT=y
CONFIG_GETOPT_LONG=y

# The online compiler needs 256 KiB of stack (gl_triangle/Kconfig); the
# scenes' model loaders recurse little. dEQP's 1 MiB, measured enough there.
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_STACK_SENTINEL=y
# The heap: decoded textures (largest 1024x1024x3, 3 MiB, plus libpng's row
# buffers), the parsed models (bunny.obj 2.4 MB of text) and the meshes.
# 96 MiB; the high-water mark is not measured yet.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=100663296

# The run: 33 scenes of 10 s plus their set-up (shader compiles at about
# 0.2 s each on the A53, deqp/README.md) is about 6-7 minutes; the
# watchdog is fed until 15 minutes after boot at most, and every main-loop
# step says it is alive (NativeStateBoard::should_quit).
CONFIG_YAKOGL_BOARD_LIFETIME_S=900
CONFIG_YAKOGL_BOARD_HOLD_S=20
