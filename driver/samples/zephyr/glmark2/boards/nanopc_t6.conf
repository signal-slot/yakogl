# NanoPC-T6: what glmark2 needs beyond prj.conf and the board layer's
# app.conf (CMakeLists.txt takes driver/zephyr/lib/board/nanopc_t6/app.conf:
# the Mali back end, the console, the MMU's tables).
#
# 96 MiB of GPU memory, as the Pi 4's image (boards/rpi_4b.conf: refract
# peaks at about 56 MB, terrain needs over 30 MB); zephyr/Kconfig's default
# of 32 MiB is for one window and a few textures. build and shading use
# 18,932 KiB of it at most (the board run of 2026-11-23). The carve-out is
# .noinit: with the 96 MiB heap of prj.conf the image needs 261,111,808
# bytes of the board's 256 MiB window (zephyr,sram).
CONFIG_YAKOGL_MALI_CARVEOUT_BYTES=100663296
