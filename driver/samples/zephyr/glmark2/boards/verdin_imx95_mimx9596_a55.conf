# Verdin iMX95 (Mallow), Cortex-A55: what glmark2 needs beyond prj.conf and
# the board layer's app.conf (CMakeLists.txt takes
# driver/zephyr/lib/board/verdin_imx95/app.conf: the Mali-G310 back end, the
# 1280x800 LVDS panel on X12, the console, the MMU's tables).
#
# GPU memory as the NanoPC-T6 (boards/nanopc_t6.conf: 96 MiB, refract and
# terrain), plus the board layer's window memory at the carve-out's end
# (app.conf's CONFIG_YAKOGL_MALI_WINDOW_BYTES, 9,011,200): 100,663,296 +
# 9,011,200 = 109,674,496. The board's window is 256 MiB (zephyr,sram, the
# dram node of the board's devicetree); the fit is in the commit message.
CONFIG_YAKOGL_MALI_CARVEOUT_BYTES=109674496

# The panel through the board layer's default X12 path, said here so the
# image never runs without it.
CONFIG_YAKOGL_VERDIN_IMX95_DISPLAY=y

# 33 scenes of 10 s plus their set-up is 6-7 minutes (prj.conf: 900 s of
# lifetime, WDOG3 fed up to it and main.cpp's feed per row); 20 minutes here
# for the first runs on this board (shader compiles on the A55, the panel's
# vsync), the board layer's lifetime following it.
CONFIG_YAKOGL_BOARD_LIFETIME_S=1200
CONFIG_YAKOGL_VERDIN_IMX95_LIFETIME_S=1200

# The 256 MiB window is full: the image with prj.conf's 96 MiB heap and this
# carve-out overflows .noinit by 1,064,960 bytes, so the heap is 94 MiB
# (98,566,144; the carve-out keeps its 96 MiB for the GL side, as the T6's).
# The heap's high-water mark is not measured (prj.conf), the textures and
# models it holds are about 3 MiB and 2.4 MB at most each.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=98566144
