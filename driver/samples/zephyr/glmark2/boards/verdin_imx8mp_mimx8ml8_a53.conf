# Verdin iMX8M Plus (Mallow): what the board needs beyond prj.conf, as
# slint/boards has it. Not built yet (driver/docs/glmark2.md).
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# FPU sharing off on purpose (slint/boards/verdin_imx8mp_mimx8ml8_a53.conf).
CONFIG_FPU_SHARING=n
# No UART on the Mallow: the console is the board layer's panel console.
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y
