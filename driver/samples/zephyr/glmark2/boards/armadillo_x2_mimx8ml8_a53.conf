# Armadillo-X2 (i.MX8M Plus, same SoC and GC7000UL as the Verdin): what the
# board needs beyond prj.conf. The image is kexec'd out of Armadillo Base OS
# by tools/board.sh x2 run (kexec-dev, a development run); the record is read
# from SNVS LPGPR1..3 (three words).
#
# Build, one scene (CONFIG_GLMARK2_ARGS="-b terrain" selects it; any
# "-b <scene>" works, empty runs the default list):
#
#   export $(tools/cts/deps-env.sh imx8mp)
#   . "$ZEPHYR_VENV/bin/activate"
#   export ZEPHYR_BASE=$ZEPHYR_WS/zephyr
#   west build -p always -d <dir> -b armadillo_x2/mimx8ml8/a53 \
#       driver/samples/zephyr/glmark2 -- \
#       "-DZEPHYR_MODULES=$(tools/cts/zephyr-modules.sh $ZEPHYR_WS)" \
#       -DGLMARK2_SRC=$GLMARK2_SRC '-DCONFIG_GLMARK2_ARGS="-b terrain"'
#
# Check it; the run itself is a board session, not part of the build:
#   strings <dir>/zephyr/zephyr.bin | grep 'gc_wdog_arm: armed'
#   tools/board.sh --dry-run x2 run <dir>/zephyr/zephyr.bin <logdir>
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# Board support of the GC images: the GIC EOI fix, the interrupt guard, the
# watchdog, the SNVS result record (gl_test's boards/imx8mp.conf has the same).
CONFIG_YAKOGL_GC_BOARD=y
# FPU sharing off on purpose, as the Verdin's.
CONFIG_FPU_SHARING=n
# The console is UART2, wired to the host: print there, not into the picture.
CONFIG_UART_CONSOLE=y
CONFIG_GC_COMMON_PANEL_CONSOLE=n
# tools/board.sh x2 refuses an image that does not print "gc_wdog_arm: armed".
CONFIG_GC_BOARD_WDOG_SELF_ARM=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y
# Address space for the 240 MiB GPU carve-out of the overlay: the image with
# its 96 MiB heap plus that mapping is past the default 256 MiB of VM from
# 0x60000000 (the Verdin's conf has the same line, issue #814).
CONFIG_KERNEL_VM_SIZE=0x20000000
