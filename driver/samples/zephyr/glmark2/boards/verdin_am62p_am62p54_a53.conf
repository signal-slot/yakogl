# Verdin AM62P: what the board needs beyond prj.conf, as slint/boards has it.
CONFIG_SAFEUI_GPU_PVR=y
CONFIG_FPU_SHARING=y
# A window up to 1920x1080 (8100 KiB), for an off-screen run at the size of
# the --fullscreen runs; the default 800x600 needs 1875.
CONFIG_YAKOGL_BOARD_WINDOW_MAX_KB=8100

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95
