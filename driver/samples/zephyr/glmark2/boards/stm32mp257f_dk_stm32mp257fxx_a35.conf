# STM32MP257F-DK, Cortex-A35 (Vivante GCNanoUltra31, 0x8000/0x6205): what the
# board needs beyond prj.conf. The board layer's app.conf (the Vivante driver,
# OP-TEE's watchdog, no hold) is added by CMakeLists.txt, as in gl_test
# (boards/stm32mp257f_dk_stm32mp257fxx_a35.conf there, commit fb94dafe). Build
# only for now: the DK's board layer has no window or screen yet
# (board_stm32mp2.c: board_window() refuses), so the image links but a run
# ends at the first scene; the display is the DK's P8.
CONFIG_YAKOGL_BOARD=y
# The layer resets the board this long after boot whatever the run does: the
# default list is 33 scenes of 10 s plus set-up (prj.conf: about 6-7 minutes);
# tools/board-stm32mp2.sh's RUN_BOUND (120 s) has to be raised for it.
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=900
# Address space for the 240 MiB GPU carve-out of the overlay: the image with
# its 96 MiB heap plus that mapping (gc_render.c, k_mem_map_phys_bare) is past
# the default 256 MiB of VM from 0xa0000000 (the Verdin iMX8M Plus' conf has
# the same line, issue #814).
CONFIG_KERNEL_VM_SIZE=0x20000000
