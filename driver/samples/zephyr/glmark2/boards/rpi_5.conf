# Raspberry Pi 5 (BCM2712 D0, V3D 7.1.10): what the image needs beyond
# prj.conf, as boards/rpi_4b.conf has it. The 7.1 table is chosen at build
# time (docs/notes/v3d71-gl-table.md, section 4): YAKOGL_GPU_V3D71 selects the
# board layer's PM watchdog and mailbox. Not run on the board yet: the
# starting values are the Pi 4's (docs/notes/rpi5-deqp-glmark2.md, section 4).
# The board layer (yakogl_board.h, CONFIG_YAKOGL_BOARD from prj.conf) has a
# BCM2712 arm (lib/board/bcm2712/board_bcm2712.c): the record, end and
# watchdog calls the image uses, no window; the image links.
CONFIG_YAKOGL_GPU_V3D=y
CONFIG_YAKOGL_GPU_V3D71=y
# No window path on the Pi 5 yet: an off-screen run (the counters line reads
# "absent": the 7.1 table has none).
CONFIG_GLMARK2_ARGS="--off-screen"
# 96 MiB of GPU memory (a static of the image; see rpi_5.overlay): refract
# peaks near 56 MB and terrain needs over 30.5 MB (rpi_4b.conf). The GPU's VA
# space is 512 MiB here too (src/osal/zephyr_v3d71.c, VA_SPACE).
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=100663296
# refract's 1600x1200 colour target and its depth copy (rpi_4b.conf).
CONFIG_YAKOGL_V3D_TFU=y
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=25165824
CONFIG_FPU_SHARING=y
# Address space: the image's 288 MiB, the carve-out's non-cacheable alias
# (96 MiB, a table per 2 MiB), the window and the device blocks above 4 GiB.
CONFIG_MAX_XLAT_TABLES=192
CONFIG_KERNEL_VM_SIZE=0x20000000
