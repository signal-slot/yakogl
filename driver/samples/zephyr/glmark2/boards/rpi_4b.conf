# Raspberry Pi 4: what the board needs beyond prj.conf, as slint/boards has
# it. Not built yet (driver/docs/glmark2.md).
CONFIG_YAKOGL_GPU_V3D=y
# 96 MiB of GPU memory (a static of the image; see rpi_4b.overlay): refract
# peaks at about 56.2 MB (its 1600x1200 copy, 7,684,096 B, did not fit the
# former 48 MiB: tools/cts/RESULTS.md, "out of GPU memory") and terrain needs
# over 30.5 MB, +33% since its 800x600 textures have NPOT mip chains. The
# carve-out and the 512 KiB page table sit inside the GPU's 512 MiB VA space
# (src/osal/zephyr_v3d.c, VA_SPACE), so 96 MiB has room.
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=100663296
# glmark2 refract's 1600x1200 RGBA8 colour render target tiles to 11,001,856 B
# with its mip chain: over the 8 MiB default, so one of its draws was refused
# (3 x GL error 0x505). Measured on the host harness at this carve-out: 24 MiB
# keeps that copy and the 7,684,096 B depth copy at once (tiled high-water
# 19,742,720 B; refract peak 69,093,376 of the 96 MiB carve-out, below the
# 70,146,048 of 16 MiB, which evicts the depth copy every frame; both run
# refract at 23 FPS):
# tools/hostharness/glmark2/FINDINGS-refract-budget.md sections 3.2-3.4.
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=25165824
# The texture formatting unit: a colour render target the scene samples is
# stored by the tile list into its render image, and its glGenerateMipmap
# (refract's and terrain's, every frame) is one TFU job in that image instead
# of the CPU's box filter over 7.68 MB of non-cacheable storage
# (docs/online-shaderc/v3d-backend.md, "Render targets sampled from their
# render image"); the OSAL runs TFU jobs only with this option. Kept copies
# of 64 KiB or more are the TFU's too (case 140: 2.2 ms against 145 ms for a
# 1920x720 image). The first board run of the TFU's mipmap job is this
# image's.
CONFIG_YAKOGL_V3D_TFU=y
CONFIG_FPU_SHARING=y
# Address space: the image's 288 MiB (rpi_4b.overlay), the carve-out's
# non-cacheable alias (96 MiB), the window's alias, the framebuffer and the
# device blocks: more than slint's 256 MiB. v3d_deqp's pair, which runs on
# this board with a 256 MiB image (v3d_deqp/prj.conf).
# The alias is 4 KiB pages, a table per 2 MiB: 48 for it, so 192 tables.
CONFIG_MAX_XLAT_TABLES=192
CONFIG_KERNEL_VM_SIZE=0x20000000
