# Armadillo-X2 started by TF-A at power-on (docs/direct-boot.md): the console
# is UART2, and there is no display to show the window on. The devicetree has
# no display node (nothing powered MEDIAMIX or LCDIF3), so the display driver
# is off; saying so here keeps prj.conf's "y" from becoming a Kconfig warning.
CONFIG_UART_CONSOLE=y
CONFIG_GC_COMMON_PANEL_CONSOLE=n
CONFIG_SAFEUI_DISPLAY_IMX8MP=n
