# The Vivante GC7000UL driver and YakoGL's Vivante backend.
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_SAFEUI_GPU_VIVANTE_LOG_LEVEL_DBG=y
CONFIG_YAKOGL=y
CONFIG_YAKOGL_GPU_VIVANTE=y

CONFIG_LOG=y
# The console is the DSI panel (gc_common); LOG_* through printk.
CONFIG_GC_COMMON_PANEL_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UART_CONSOLE=n
CONFIG_GC_COMMON_PANEL_CONSOLE_SCALE=3
CONFIG_FPU=y
CONFIG_CACHE_MANAGEMENT=y

# glShaderSource keeps a copy of the source (malloc); the GL core runs on the
# main thread (its per-draw scratch is static, but keep headroom).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
# 256 KiB: the in-process shader compiler (the default back end) runs on
# this thread at glCompileShader (zephyr/Kconfig, YAKOGL_SHADERC_ONLINE,
# STACK; 64 KiB overflowed on the AM62P).
CONFIG_MAIN_STACK_SIZE=262144

# The way back to Linux: reset the SoC through PSCI when done.
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The window is the panel: the display driver scans the GL window out once
# the frame is drawn (imx8mp_display_on), so the triangle is visible.
CONFIG_GC_GL_TRIANGLE_WIDTH=1280
CONFIG_GC_GL_TRIANGLE_HEIGHT=800
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y

# crc32_ieee for the PICTURE record.
CONFIG_CRC=y
# A kind STAGE breadcrumb at every boot and sample stage (gc_result.h), so a
# run that dies before its PICTURE says where (the U-Boot netboot,
# driver/docs/imx8mp-netboot-plan.md). The PICTURE record is unchanged.
CONFIG_GC_COMMON_RESULT_STAGES=y
