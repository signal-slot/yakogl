# The AM62P parity build: the same 1024x600 window as the AM62P's gl_triangle,
# so the PICTURE record (gc_result.h) can be compared with that board's. The
# window is read back only; main() puts a window on the 1280x800 panel only
# when it is panel-sized.
#
#   west build ... gc_gl_triangle -- -DEXTRA_CONF_FILE=prj_parity.conf
CONFIG_GC_GL_TRIANGLE_WIDTH=1024
CONFIG_GC_GL_TRIANGLE_HEIGHT=600
