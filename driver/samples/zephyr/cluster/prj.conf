# The one cluster sample: the same configuration on every board. What a board
# needs beyond it (its GPU driver, display path, memory and panel size) is in
# boards/, selected by the Zephyr board; the window, the screen, the
# watchdog, the records and the end of the run are the board layer's
# (yakogl_board.h).
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y
# The in-process shader compiler on every board (the offline table is being
# retired; the V3D has no other back end).
CONFIG_YAKOGL_SHADERC_ONLINE=y

# The animation after the checked frame, over which the fps is measured
# (APP and PERF records). The lifetime (300 s by default) covers it, the
# check before it and the hold after it.
CONFIG_YAKOGL_BOARD_ANIMATE_S=60
# The one present path: a window is a view into the scan-out buffer where it
# can be (the Pi 4's two-screen framebuffer, shown by a pan); the Verdins
# scan the panel-sized halves in place either way. A copy would set the APP
# record's YK_RECORD_APP_SHOWN_BY_COPY (bit 16), so a clear bit 16 is the
# proof that no frame was copied.
CONFIG_YAKOGL_BOARD_SCANOUT_VIEW=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y

# Slint's gauge geometry and FemtoVG's tessellation are float work; the Rust
# archive is hard-float.
CONFIG_FPU=y

# Slint layout and FemtoVG path flattening have deep call chains and the item
# tree renders recursively; the online compiler needs 256 KiB too.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_STACK_SENTINEL=y

# Slint and FemtoVG allocate from the UI heap in src/main.c (a sys_heap, its
# high-water mark printed at the end); the C heap holds glShaderSource's
# copies only.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_SYS_HEAP_RUNTIME_STATS=y
