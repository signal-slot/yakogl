#
# The check and the records of the cluster sample (driver/samples/zephyr/cluster,
# driver/docs/one-method.md section 5, step 5): the checked frame against the
# host reference's probe points for the window's size (src/references.rs,
# generated by ../host/ref/run.sh), the sentinel, alpha, the guard rows and
# glReadPixels against memory, the window's CRC-32 (FINGERPRINT), and the
# animation's present accounting (APP, PERF). no_std, no dependencies: the
# sample's staticlib (../rust) links it for aarch64-unknown-none, and
# `cargo test -p yakogl-cluster-check` runs it on the host.
[package]
name = "yakogl-cluster-check"
description = "The cluster sample's frame check and records, the same on every board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "cluster_check"
path = "src/lib.rs"
doctest = false
bench = false
