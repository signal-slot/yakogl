# Raspberry Pi 4: what the board needs for this sample beyond prj.conf, from
# v3d_gl_cluster/prj.conf.
CONFIG_YAKOGL_GPU_V3D=y
# 64 MiB of GPU memory (a static of the image; see rpi_4b.overlay): 48 MiB
# peaked at 48.84 of 49.80 MB with the cluster's 13 femtovg layers
# (v3d_gl_cluster/prj.conf, DEMOH1).
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=67108864
# The textures the V3D samples are tiled once and kept across jobs: the
# backdrop (1920x720) and the two 600x600 rings pass the default 8 MiB.
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=16777216
CONFIG_FPU_SHARING=y
# Address space: the image (176 MiB, the overlay), the carve-out's
# non-cacheable alias, the 2-screen framebuffer and the device blocks.
CONFIG_MAX_XLAT_TABLES=64
CONFIG_KERNEL_VM_SIZE=0x10000000

# The panel: the 1920x720 bar LCD. The firmware is asked for a framebuffer of
# its size, two screens tall (1920x1440, the grant v3d_fb_flip measured): the
# window (2 x 720 rows) is a view into that framebuffer (the view, prj.conf),
# each half an EGL surface, and board_show() pans between them (no copy;
# v3d_gl_cluster's direct present).
CONFIG_CLUSTER_PANEL_WIDTH=1920
CONFIG_CLUSTER_PANEL_HEIGHT=720
CONFIG_YAKOGL_BOARD_RPI4_FB_WIDTH=1920
CONFIG_YAKOGL_BOARD_RPI4_FB_HEIGHT=720
CONFIG_YAKOGL_BOARD_RPI4_FB_VIRTUAL_HEIGHT=1440
# The static window of the copy fallback is not used: a refused grant is a
# board_window() failure, never a copied cluster. 4 KiB keeps it out of RAM.
CONFIG_YAKOGL_BOARD_WINDOW_MAX_KB=4
