# Verdin AM62P: what the board needs for this sample beyond prj.conf, as the
# slint sample's boards/verdin_am62p_am62p54_a53.conf.
CONFIG_SAFEUI_GPU_PVR=y
CONFIG_FPU_SHARING=y

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95

# The panel: 1024x600. The window: two halves, 1200 * 1024 * 4 bytes =
# 4,800 KiB (YAKOGL_BOARD_WINDOW_MAX_KB's default); board_show() points the
# DSS application plane at a half (no copy).
CONFIG_CLUSTER_PANEL_WIDTH=1024
CONFIG_CLUSTER_PANEL_HEIGHT=600
