# Verdin iMX8M Plus (Mallow): what the board needs for this sample beyond
# prj.conf, as the slint sample's boards/verdin_imx8mp_mimx8ml8_a53.conf.
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# FPU sharing off on purpose: with it on, printk from an interrupt handler
# spills argument registers through the FPU, which is disabled in exception
# context on arm64 (gc_slint/prj.conf).
CONFIG_FPU_SHARING=n
# No UART on the Mallow: the console is the board layer's panel console.
CONFIG_UART_CONSOLE=n
# The display chain (the LCDIF scans the window, imx8mp_display_on).
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
# The reset at the end of a run goes through PSCI.
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The panel: 1280x800. The window (two halves, 8.2 MB) comes from the GPU
# carve-out; each half is the panel's size, so board_show() points the LCDIF
# at it (no copy).
CONFIG_CLUSTER_PANEL_WIDTH=1280
CONFIG_CLUSTER_PANEL_HEIGHT=800

# The online compiler keeps every live program's code here. FemtoVG's 36
# sources take 435,520 bytes compiled for the PowerVR and 474,368 for the
# GC7000 on the host (2026-10-04), against the 512 KiB default; 1 MiB leaves
# room for the draw-time variants.
CONFIG_YAKOGL_SHADERC_KEEP_BYTES=1048576
