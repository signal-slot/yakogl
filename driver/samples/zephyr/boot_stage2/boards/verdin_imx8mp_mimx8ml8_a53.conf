# The loader's RAM is 0x40200000 + 32 MiB (the overlay); the kernel's virtual
# region (device mappings) stays inside it, so it cannot meet the identity
# map of the payload region at 0x48000000. No display and no GPU: the
# console is UART3 (unconnected on the lab carrier; the image that follows
# prints on the panel).
CONFIG_KERNEL_VM_SIZE=0x2000000

# The loader maps its own 32 MiB, the payload region and the devices: 8 tables
# (the a53 default) are too few, and the failure is silent (before the console).
CONFIG_MAX_XLAT_TABLES=64

# Nothing on the console on the way to the image unless it fails: the polled
# UART held the boot for each line (the banner about 4 ms, the progress lines
# and the bandwidth probe 31 ms of the loader's 300; 2026-10-29, system
# counter, eMMC boot). Errors still print.
CONFIG_BOOT_BANNER=n
CONFIG_BOOT_STAGE2_PROGRESS_LOG=n
