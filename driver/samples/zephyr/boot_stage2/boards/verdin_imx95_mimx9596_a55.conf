# The loader's RAM is 0x90200000 + 32 MiB (the overlay); the kernel's virtual
# region (device mappings: USDHC1, the UART, the SCMI mailbox, WDOG3) stays
# inside it, so it cannot meet the identity map of the payload region at
# 0xd0000000.
CONFIG_KERNEL_VM_SIZE=0x2000000

# The loader maps its own 32 MiB, the payload region and the devices: the
# a53 boards' lesson is that 8 tables are too few and the failure is silent
# (the board's defconfig has 64 already).
CONFIG_MAX_XLAT_TABLES=64

# The count (Kconfig BOOT_STAGE2_COUNT, default y on this board) reads the
# uSDHC's root clock over SCMI (the board's defconfig has CLOCK_CONTROL and
# ARM_SCMI). The word on the console takes the way back at once.
CONFIG_BOOT_STAGE2_BOOT0_ON_REQUEST=y

# WDOG3: the board glue (driver/zephyr/lib/board/verdin_imx95, in every image
# for the board) arms it at PRE_KERNEL_1 for 60 s and feeds it for the
# loader's few seconds; bs2_jump stops the feeder's timer with the others and
# the payload arms WDOG3 again at its own PRE_KERNEL_1. The glue's lifetime
# (60 s) also bounds a loader that stops: its PSCI reset, then WDOG3.
