# BOOT_STAGE2_SOURCE_EMMC on the Verdin AM62P: the eMMC through Zephyr's SD
# stack and the TI AM654 SDHCI driver (drivers/sdhc/sdhc_ti_am654.c), read
# with the disk API. Build with -DEXTRA_CONF_FILE=emmc.conf
# -DEXTRA_DTC_OVERLAY_FILE=boards/verdin_am62p_am62p54_a53_emmc.overlay.
CONFIG_BOOT_STAGE2_SOURCE_EMMC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_MMC=y

# MMC0 on through TISCI before the SDHC driver touches it (the overlay's
# tisci_power_on, device 57): the SPL powered it when it booted from the
# eMMC, but not on a USB (DFU) boot, the no-write test. Init order:
# mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> SDHC 85 -> SD 90.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
