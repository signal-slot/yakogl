# A loader that prints one short line (Kconfig BOOT_STAGE2_QUIET): the polled
# console cost 0.09 s of the Verdin AM62P's boot (2026-11-12). Add to
# EXTRA_CONF_FILE after emmc.conf.
CONFIG_BOOT_STAGE2_QUIET=y
# "*** Booting Zephyr OS ..." is 5 ms at 115200 Bd.
CONFIG_BOOT_BANNER=n
# The SD stack's four information lines ("Card switched to 1.8V signaling"
# ...) are 16 ms; its errors stay.
CONFIG_LOG_DEFAULT_LEVEL=1
