# A loader that prints one short line on a boot that goes well: the polled
# console cost 0.09 s of the Verdin AM62P's 0.28 s in the loader
# (2026-11-12). Add to EXTRA_CONF_FILE after emmc.conf.
CONFIG_BOOT_STAGE2_PROGRESS_LOG=n
# The line the AM62P's boot is timed by (Kconfig BOOT_STAGE2_SUMMARY_LINE).
CONFIG_BOOT_STAGE2_SUMMARY_LINE=y
# "*** Booting Zephyr OS ..." is 5 ms at 115200 Bd.
CONFIG_BOOT_BANNER=n
# The SD stack's four information lines ("Card switched to 1.8V signaling"
# ...) are 16 ms; its errors stay.
CONFIG_LOG_DEFAULT_LEVEL=1
