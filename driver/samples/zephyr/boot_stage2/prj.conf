# The second-stage loader: one core, the console, the payload source, nothing
# else. The default source is the payload linked into this image
# (BOOT_STAGE2_SOURCE_EMBEDDED, -DBOOT_STAGE2_PAYLOAD=<stage2 .img>); the eMMC
# source adds -DEXTRA_CONF_FILE=emmc.conf and the board's _emmc overlay.

# The other cores stay off (PSCI): the loaded image starts them itself.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# Polled console: nothing is left queued when the loader jumps.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=16384
