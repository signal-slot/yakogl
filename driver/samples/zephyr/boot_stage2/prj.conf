# The second-stage loader: one core, the eMMC, the console, nothing else.

# The other cores stay off (PSCI): the loaded image starts them itself.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# The eMMC through Zephyr's SD stack and the TI AM654 SDHCI driver
# (drivers/sdhc/sdhc_ti_am654.c), read with the disk API.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_MMC=y

# MMC0 on through TISCI before the SDHC driver touches it (the overlay's
# tisci_power_on, device 57): the SPL powered it when it booted from the
# eMMC, but not on a USB (DFU) boot, the no-write test. Init order:
# mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> SDHC 85 -> SD 90.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45

# The loader's RAM is 0x80800000 + 24 MiB (the overlay); the kernel's virtual
# region (device mappings) stays inside it, so it cannot meet the identity
# map of the payload region at 0x82000000.
CONFIG_KERNEL_VM_SIZE=0x1800000

# Polled console: nothing is left queued when the loader jumps.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=16384
