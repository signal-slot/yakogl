# The second-stage loader: one core, the console, the payload source, nothing
# else. The default source is the payload linked into this image
# (BOOT_STAGE2_SOURCE_EMBEDDED, -DBOOT_STAGE2_PAYLOAD=<stage2 .img>); the eMMC
# source adds -DEXTRA_CONF_FILE=emmc.conf and the board's _emmc overlay.

# The other cores stay off (PSCI): the loaded image starts them itself.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# Polled console: nothing is left queued when the loader jumps.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

# 64 KiB. The deepest path is main() -> the unpack -> inflate() -> its
# code-table builder: 0.8 KiB (main()'s frame, bs2_info with the segment
# table in it), 12.8 KiB (inflate's frame: three probed pages and 0x180) and
# 2.9 KiB, with the two calls between about 16.7 KiB (the frames of the
# verdin_am62p build, 2026-11-13), and an interrupt saves its registers on
# top. At 16 KiB a version-3 payload's segment unpack ran over on the AM62P
# (2026-11-08: the return went through a code-table entry, Instruction Abort
# right after the copy probe); before the segment table the same path was
# 15.6 KiB plus main(). There is no guard page under the stack, and the
# loader's RAM is tens of MiB.
CONFIG_MAIN_STACK_SIZE=65536

# Speed, not size: with SIZE_OPTIMIZATIONS the toolchain's picolibc is its
# "space" build, whose memset/memcpy/memmove store a byte at a time. The
# i.MX8MP loader then zeroed the image's 42 MB .bss in 175 ms and spent
# 54 ms in the LZ4 copies (2026-10-29, system counter); the loader is tens
# of KiB next to its payload.
CONFIG_SPEED_OPTIMIZATIONS=y
