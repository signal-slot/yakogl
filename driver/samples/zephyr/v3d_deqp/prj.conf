# YakoGL on the Raspberry Pi 4's V3D, with the in-process compiler (the V3D's
# only shader back end), reporting OpenGL ES 2.0: dEQP-GLES2 applies ES 2.0
# rules only to a context that says ES 2.0.
CONFIG_YAKOGL=y
CONFIG_YAKOGL_SHADERC_ONLINE=y
CONFIG_YAKOGL_GPU_V3D=y
CONFIG_YAKOGL_REPORT_ES2=y
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=50331648
# Tiled texture copies kept across jobs. The default 8 MiB is 16 KiB short of
# a 512x512 cube's mip chain at 4 bytes a texel (texture.size.cube). The
# 2048x2048 image (T5) adds texture-2048.conf: 24 MiB with a 64 MiB
# carve-out (-DEXTRA_CONF_FILE=texture-2048.conf).
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=16777216

# The console is the HDMI framebuffer (driver/zephyr/lib/board/rpi4/fbcon.c). The mini
# UART stays on as well, and dEQP's own stdout goes only there.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# The deqp sample's runtime, line for line: stage 1 compiled dEQP against
# these exact POSIX and C++ headers (cts-build-zephyr.sh).
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_STACK_SENTINEL=y
CONFIG_ENFORCE_ZEPHYR_STDINT=n

# Address space: the image (256 MiB of RAM, the overlay), the carve-out's
# non-cacheable alias (48 MiB), the 3.6 MiB framebuffer and the device blocks.
CONFIG_MAX_XLAT_TABLES=128
CONFIG_KERNEL_VM_SIZE=0x20000000
