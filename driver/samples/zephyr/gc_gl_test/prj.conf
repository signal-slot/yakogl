# The Vivante GC7000UL driver and YakoGL's Vivante backend.
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# The in-process shader compiler, as in every other sample: gl_test.c then
# takes the GLSL ES 1.00 shader set (gl_test_shaders_es100.h).
CONFIG_YAKOGL_SHADERC_ONLINE=y

CONFIG_LOG=y
# The console is the DSI panel (gc_common); LOG_* through printk. The suite
# prints one line per case, which is more than a panel holds, so the verdict
# travels in the hold time instead (see src/main.c).
CONFIG_GC_COMMON_PANEL_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UART_CONSOLE=n
CONFIG_GC_COMMON_PANEL_CONSOLE_SCALE=2
CONFIG_CACHE_MANAGEMENT=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=n

# glShaderSource keeps a copy of every source; the suite compiles dozens.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
# 256 KiB: the in-process shader compiler runs on this thread when the image
# is built with it (docs/online-shaderc/frontend.md, "Stack"); 64 KiB
# overflowed into the idle thread on the AM62P.
CONFIG_MAIN_STACK_SIZE=262144

# The way back to Linux: reset the SoC through PSCI when done.
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y

# Needs the ES 3.0 report (YakoGL reports ES 2.0 by default): the "#version 300 es" gl_test cases run only on an ES 3.0 context.
CONFIG_YAKOGL_REPORT_ES2=n
