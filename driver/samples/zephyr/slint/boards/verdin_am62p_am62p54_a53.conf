# Verdin AM62P: what the board needs for this sample beyond prj.conf, from
# gl_slint/boards/verdin_am62p_am62p54_a53.conf without its sample and
# watchdog options (those are the board layer's now). Moves into the board
# layer once it carries the AM62P's defaults (one-method.md section 2).
CONFIG_SAFEUI_GPU_PVR=y
CONFIG_FPU_SHARING=y

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95
