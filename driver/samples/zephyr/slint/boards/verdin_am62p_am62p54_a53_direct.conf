# Verdin AM62P started by the A53 SPL at power-on, in place of U-Boot proper
# (board verdin_am62p/am62p54/a53/direct, docs/direct-boot.md): the route
# gl_slint's boards/verdin_am62p_am62p54_a53_direct.conf carried until Step 1
# deleted gl_slint (driver/docs/one-method.md section 5). The board's
# devicetree has the display path on, so there is no overlay: bring the DSI
# panel up from cold, draw and check the cluster, animate it, hold the last
# frame, then reset, which boots this image again (each reset is another
# boot-time sample). The lines of verdin_am62p_am62p54_a53.conf are repeated
# here: Zephyr reads only the file of the exact board name.
CONFIG_SAFEUI_GPU_PVR=y
CONFIG_FPU_SHARING=y

# the run: 60 s of animation, 20 s on screen, then the reset (the board
# layer's board_finish; PVR_SAMPLE_REBOOT defaults on the AM62P)
CONFIG_YAKOGL_BOARD_ANIMATE_S=60
CONFIG_YAKOGL_BOARD_HOLD_S=20
CONFIG_REBOOT=y
# The time since the R5 SPL started the GTC, at main() and at the first frame.
CONFIG_PVR_SAMPLE_BOOT_TIME=y

# Nothing started the RTI watchdog on this route: arm it here and feed it past
# the run (200 s), so a hung image is reset by it.
CONFIG_YAKOGL_BOARD_LIFETIME_S=200
CONFIG_YAKOGL_AM62P_RTI_SELF_ARM=y

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# RTI arm 47 -> I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_SN65DSI8X_SELF_START_INIT_PRIORITY=95
