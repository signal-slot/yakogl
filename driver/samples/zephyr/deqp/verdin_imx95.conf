# Verdin iMX95 (i.MX 95, Mali-G310): YakoGL on the Mali with the in-process
# compiler, as the NanoPC-T6's image (boards/nanopc_t6.conf), reporting
# OpenGL ES 2.0 (DEQP_REPORT_ES2, prj.conf's default). Merged after the board
# layer's app.conf (../common/verdin_imx95.cmake says why it is not
# boards/<board>.conf). The board's part of the image is src/mali_board.c over
# the board glue and the board layer (driver/zephyr/lib/board/verdin_imx95).
CONFIG_YAKOGL_BOARD=y

# The carve-out: 64 MiB for the GL side, as the NanoPC-T6's dEQP image (the
# largest texture of dEQP-GLES2, texture.size.2d.2048x2048_*, takes
# 33,546,240 bytes with its mip chain), plus app.conf's 8800 KiB of window
# memory at its end (YAKOGL_MALI_WINDOW_BYTES, 9011200), which the board
# layer's build assert needs whether or not the panel is up:
# 67108864 + 9011200.
CONFIG_YAKOGL_MALI_CARVEOUT_BYTES=76120064

# A conformance image reads back; the panel only on request
# (../common/verdin_imx95.cmake).
CONFIG_YAKOGL_VERDIN_IMX95_DISPLAY=n

# The watchdog (driver/zephyr/lib/board/verdin_imx95): WDOG3 is fed until
# 600 s of uptime (one dEQP row, as the NanoPC-T6's image), and only while the
# board layer's alive mark comes at most 60 s apart: the OSAL sets it in every
# delay, and src/mali_board.c (deqp_log.c) when a case begins and when it ends.
# A case that computes on the CPU for longer than 60 s without a GPU wait is
# reset as a hang, at most one WDOG3 period (60 s) later.
CONFIG_YAKOGL_BOARD_LIFETIME_S=600
CONFIG_YAKOGL_BOARD_ALIVE_S=60

# No picture to hold: board_finish() resets at once after the record.
CONFIG_YAKOGL_BOARD_HOLD_S=0
CONFIG_YAKOGL_BOARD_HOLD_FAIL_S=0
