# The Pi 4 image that runs the seven dEQP-GLES2 texture.size.2d.2048x2048_*
# cases (image T5 of tools/cts/pi4-full-tree.txt). Build it with
#
#   west build ... driver/samples/zephyr/deqp -b rpi_4b -- -DEXTRA_CONF_FILE=texture-2048.conf ...
#
# A 2048x2048 RGBA8 texture tiles to about 16.8 MiB, its mip chain to
# 22,376,448 bytes: past boards/rpi_4b.conf's 16 MiB of kept tiled copies and past
# the per-job texture arena (8 MiB), so without this every such draw is
# refused ("a texture larger than the tiled-copy budget"). Sweep 28 ran T5
# with these two values and measured a high-water of 16,781,312 bytes of
# copies and 56,786,688 bytes of the carve-out; sweep 29 built T5 without
# them and failed five of the seven. Only this image needs them, so they
# stay out of the board file: every other image keeps the 48 MiB carve-out it
# was measured with.
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=67108864
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=25165824
