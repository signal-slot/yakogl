# The Pi 4 image that runs the seven dEQP-GLES2 texture.size.2d.2048x2048_*
# cases (image T5 of tools/cts/pi4-full-tree.txt). Build it with
#
#   west build ... driver/samples/zephyr/deqp -b rpi_4b -- -DEXTRA_CONF_FILE=texture-2048.conf ...
#
# A 2048x2048 RGBA8 texture tiles to about 16.8 MiB, its mip chain to
# 22,376,448 bytes: past boards/rpi_4b.conf's 16 MiB of kept tiled copies and past
# the per-job texture arena (8 MiB), so without this every such draw is
# refused ("a texture larger than the tiled-copy budget"). Sweep 28 ran T5
# with a 64 MiB carve-out and this tiled budget and measured a high-water of 16,781,312 bytes of
# copies and 56,786,688 bytes of the carve-out; sweep 29 built T5 without
# them and failed five of the seven. Only this image needs them, so they
# stay out of the board file: every other image keeps the 48 MiB carve-out it
# was measured with.
#
# 72 MiB since 6d2e7d0d (V3D MAX_TARGET 2048 -> 4096): the binner tile pool
# and tile state are sized at init for a 4096x4096 target at four render
# targets, 2,629,632 + 4,194,304 bytes instead of 1,056,768 + 1,048,576,
# so 4,718,592 more bytes are taken for good. tests/v3d_es2ctx_t5_mem.rs
# replays T5 on this file's values with the OSAL's allocator (host figures,
# granule-rounded, the page table not counted): in use after init 15,639,040
# bytes at 381b0f09, 20,357,632 since 6d2e7d0d. At 64 MiB (a 66,580,480-byte
# heap) 381b0f09 peaked at 60,665,344; since 6d2e7d0d the rgb888, rgba4444
# and rgba8888 _mipmap cases find no room for their 22,376,448-byte chain
# copy (GL_OUT_OF_MEMORY). At 72 MiB (a 74,969,088-byte heap) the
# high-water is 65,383,936 bytes, 9,585,152 free; the tiled copies'
# high-water stays 22,376,448 of the 24 MiB below.
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=75497472
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=25165824
