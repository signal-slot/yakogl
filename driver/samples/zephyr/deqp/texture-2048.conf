# The Pi 4 images that need more V3D memory than boards/rpi_4b.conf gives:
# the dEQP-GLES2 image T5 (the seven dEQP-GLES2 texture.size.2d.2048x2048_*
# cases, image T5 of tools/cts/pi4-full-tree.txt) and the dEQP-GLES3
# texture.units images T14 and T14a (the images of tools/cts/pi4-gles3-tree.txt
# whose cases sample cube maps or many units; tests/v3d_units_cube_mem.rs
# replays them on the host). Build one with
#
#   west build ... driver/samples/zephyr/deqp -b rpi_4b -- -DEXTRA_CONF_FILE=texture-2048.conf ...
#
# tools/cts/deqp-tree-images.sh adds this file for every image whose `# image`
# line carries the marker `(with texture-2048.conf)` (docs/es3/board-recipe-pi4.md).
#
# A 2048x2048 RGBA8 texture tiles to about 16.8 MiB, its mip chain to
# 22,376,448 bytes: past boards/rpi_4b.conf's 16 MiB of kept tiled copies and past
# the per-job texture arena (8 MiB), so without this every such draw is
# refused ("a texture larger than the tiled-copy budget"). Sweep 28 ran T5
# with a 64 MiB carve-out and this tiled budget and measured a high-water of 16,781,312 bytes of
# copies and 56,786,688 bytes of the carve-out; sweep 29 built T5 without
# them and failed five of the seven. Only these images need them, so they
# stay out of the board file: every other image keeps the 48 MiB carve-out it
# was measured with.
#
# The carve-out is a static of the image (zephyr/Kconfig: the image's RAM
# must hold it besides the kernel). boards/rpi_4b.overlay gives the deqp
# image 256 MiB of sram0, so a 112 MiB carve-out leaves 144 MiB for the
# kernel, the 64 MiB C heap and dEQP's own programs; the numbers below stay
# inside that window.
#
# tests/v3d_es2ctx_t5_mem.rs replays T5 on this file's values with the OSAL's
# allocator (host figures, granule-rounded, the page table not counted): in
# use after init 15,639,040 bytes at 381b0f09, 20,357,632 since 6d2e7d0d
# (V3D MAX_TARGET 2048 -> 4096: the binner tile pool and tile state are sized
# at init for a 4096x4096 target at four render targets, 2,629,632 +
# 4,194,304 bytes instead of 1,056,768 + 1,048,576, so 4,718,592 more bytes
# are taken for good). At 64 MiB (a 66,580,480-byte heap) 381b0f09 peaked at
# 60,665,344; since 6d2e7d0d the rgb888, rgba4444 and rgba8888 _mipmap cases
# find no room for their 22,376,448-byte chain copy (GL_OUT_OF_MEMORY). At
# 72 MiB, the bump for 6d2e7d0d (a 74,969,088-byte heap), the high-water is
# 65,383,936 bytes, 9,585,152 free; at the 112 MiB here (a 116,912,128-byte
# heap) the same high-water leaves 51,528,192, and the tiled copies'
# high-water stays 22,376,448, now of the 32 MiB budget below.
#
# tests/v3d_units_cube_mem.rs replays the texture.units cases of T14 and
# T14a on this file's values too: the b1b5b845 run aborted T14a at
# texture.units.8_units.only_cube.2, whose kept tiled copy found no GPU
# memory (osal(v3d): out of GPU memory, docs/notes/v3d-refusals.md). At the
# 72 MiB carve-out and 24 MiB budget its replays of 8_units.only_cube.3, .4
# and .8 found no room (allocations of 4,206,592, 6,295,552 and 8,409,088
# bytes; .8 samples six RGBA32-class cubes, 8,409,088 bytes of tiled copy
# each); the smallest carve-out that holds every replayed case is
# 110,100,480 (105 MiB) at a 24 or 32 MiB budget, and all_units.only_cube.0
# alone in a fresh context needs a budget of at least 30,146,560 and, with
# 32 MiB, a carve-out of at least 95,420,416. The numbers here are 7,340,032
# bytes above the first minimum and 3,407,872 above the second, and that
# test asserts every replayed case allocates at them.
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=117440512
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=33554432
