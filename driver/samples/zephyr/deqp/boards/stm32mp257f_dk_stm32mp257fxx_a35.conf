# STM32MP257F-DK, Cortex-A35 (Vivante GCNanoUltra31, 0x8000/0x6205; #1281),
# started by its own U-Boot through tools/board-stm32mp2.sh. The board layer's
# app.conf (the Vivante driver, OP-TEE's watchdog, no hold) is added by
# CMakeLists.txt, as for gl_test; this is what dEQP needs beyond it.
#
# The board layer (yakogl_board.h, board_stm32mp2.c): the GPU powered before
# main (gc_power_mp2.c), OP-TEE's watchdog armed ("gc_wdog_arm: armed", which
# the runner requires) and fed, the yk-record line on USART2, and the end of
# the run: board_finish() (src/main.cpp) prints "deqp: PASS"/"FAIL" and resets
# through PSCI back into ST's Linux. A fatal error takes the board layer's
# handler (stm32mp2.c: PSCI reset), so YAKOGL_SAMPLE_REBOOT stays off: its
# handler in sample_glue.c would be a second k_sys_fatal_error_handler.
# The console is USART2: every case's "deqp: <StatusCode> <case>" line goes
# there (tools/cts/deqp-uart-tally.py reads it).
CONFIG_YAKOGL_BOARD=y
CONFIG_PRINTK=y
CONFIG_YAKOGL_SAMPLE_REBOOT=n

# The layer resets the board this long after boot whatever dEQP is doing:
# 600 s, one dEQP group, as the i.MX8MP's and the AM62P's bounded watchdog
# feed. tools/board-stm32mp2.sh waits RUN_BOUND (default 120 s) for the end
# line: run it with RUN_BOUND=600 or more (README.md).
CONFIG_YAKOGL_STM32MP2_LIFETIME_S=600

# dEQP's own heap, the i.MX8MP's 160 MiB and for the same reason (the
# texture.size 2048 cases' reference chains, verdin_imx8mp_mimx8ml8_a53.conf).
# The image's RAM is the 256 MiB zephyr,sram at 0xa0000000; the runner refuses
# a footprint past 0xb0000000. The GPU carve-out (64 MiB at 0xfa800000) is
# outside it, and as on the i.MX8MP (64 MiB too) the 2048x2048 mipmap uploads
# are expected to end in GL_OUT_OF_MEMORY.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=167772160

# Kernel virtual address space: the image plus the 64 MiB carve-out map and
# the device blocks. The default 256 MiB from 0xa0000000 leaves too little
# beside a 200 MiB image (the Verdin's carve-out map failed, 4f40f622);
# 512 MiB as the Verdin, the Armadillo-X2 and the AM62P. No devicetree region
# is identity-mapped in 0xa0000000..0xc0000000 (DDR only).
CONFIG_KERNEL_VM_SIZE=0x20000000
