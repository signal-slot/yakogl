# Verdin iMX8M Plus (A53) on a Mallow carrier, started by U-Boot (tools/board.sh
# uboot-tftp) or kexec'd out of Torizon on the crash route. The GC7000UL through
# YakoGL's Vivante back end, and the board support of yakogl_gc_board: the GIC
# EOI fix, the interrupt guard, WDOG1 armed and fed for a BOUNDED 600 s (one
# dEQP group; then the watchdog resets the board back into Linux), and the SNVS
# result record. The carrier has no
# UART, so a run's result leaves the board in the SNVS DEQP record
# (gc_result.h), rewritten after every case (src/deqp_snvs.c).
CONFIG_SAFEUI_GPU_PVR=n
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y

CONFIG_YAKOGL_GC_BOARD=y
# The image arms WDOG1 itself (U-Boot may leave it stopped; on a kexec entry
# the running one is re-timed) and feeds it from its own 1 s timer for 600 s
# (one dEQP group), as every U-Boot gl_test and glmark2 image of this board.
# tools/board.sh refuses an i.MX8MP image without its "gc_wdog_arm: armed"
# line; the timer feeder of an inherited WDOG1 this replaced
# (GC_SAMPLE_WDOG_TIMER_FEED) prints none (2026-10-04, the baseline image).
CONFIG_GC_BOARD_WDOG_SELF_ARM=y
CONFIG_GC_BOARD_WDOG_SECONDS=600
CONFIG_GC_COMMON_PANEL_CONSOLE=n
# sample_glue.c brings the reset-at-once fatal handler with PVR_SAMPLE_REBOOT.
CONFIG_GC_SAMPLE_FATAL_HANDLER=n
CONFIG_UART_CONSOLE=n

# Done: reset through PSCI back into Linux, after a short hold.
CONFIG_PVR_SAMPLE_HOLD_SECONDS=5
CONFIG_PVR_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# dEQP's own heap. texture.size.2d.2048x2048_l8_mipmap ended every full
# texture.size run (e51d057f): a non-Pass status and then the end of the
# process with no FAULT record, which is dEQP's answer to std::bad_alloc
# (tcuTestSessionExecutor: RESOURCE_ERROR and terminate-after). Correction
# (2026-09-25): a GL_OUT_OF_MEMORY ends the run too. glu::OutOfMemoryError
# is a tcu::ResourceError, whose isFatal() is true (tcuDefs.hpp), so the
# executor sets terminate-after for it as well. Nobody read which of the
# two ended e51d057f's run. At 4f40f622 the run still ends at
# 2d.2048x2048_l8_mipmap, with "Texture upload failed: glGetError()
# returned GL_OUT_OF_MEMORY" (the 32 MiB chain does not fit the 64 MiB
# carveout), and a 200 MiB heap ends it at the same case.
# The 64 MiB of prj.conf held the case's reference chain on top of what the
# 2048 cases before it left fragmented. The image uses ~108 MB of the
# 256 MiB a53_ddr_section at 0x60000000 with 64 MiB here (text 7.1, rodata
# 1.8, bss 30.7, noinit 68 incl. this arena, da80e725), so 160 MiB leaves
# ~50 MB spare. The GPU carveout (64 MiB at 0x58000000) is separate.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=167772160

# Kernel virtual address space: the image plus the 64 MiB GPU carveout map
# (gc_render.c, k_mem_map_phys_bare) and the device blocks. With the 160 MiB
# heap above the image's RAM footprint is 200 MiB (0xc86b000, 4f40f622), and the
# default 256 MiB of VM from 0x60000000 leaves ~56 MiB: the carveout map
# failed and every image panicked before its first case (k_panic in
# k_mem_map_phys_bare, fault record ELR 0x60525d1c, 4f40f622). 512 MiB, as
# the AM62P's conf: fbo 648 / 0 / 63 in three boots with it.
CONFIG_KERNEL_VM_SIZE=0x20000000
