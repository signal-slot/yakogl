# Verdin AM62P entered from U-Boot (tools/board.sh uboot-tftp) or from Torizon
# Linux with tools/kexec-zephyr: bring the DSI panel up with the SafeUI display
# drivers (used by the panel modes), run the cases, keep the result for the
# camera, then reset back into Linux.
CONFIG_YAKOGL_DRV_GPU_PVR=y
CONFIG_YAKOGL_SAMPLE_HOLD_SECONDS=20
CONFIG_YAKOGL_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
# The image arms the MAIN RTI0 watchdog itself (U-Boot starts none; on a kexec
# entry it is already running and is only fed): fed for 600 s (one dEQP group),
# then a hung image is reset by it. tools/board.sh refuses an AM62P image
# without this feeder's "rti_arm: armed" line; the inherited-watchdog feeder
# this replaced (SOC_AM62PX_A53_FEED_INHERITED_WDT) prints none, so every
# image built from this file was refused (2026-10-04, the baseline images).
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT=n
CONFIG_YAKOGL_AM62P_RTI_SELF_ARM=y
# The bound, for whichever feeder runs (common/Kconfig).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=600

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_YAKOGL_DRV_SN65DSI8X_SELF_START_INIT_PRIORITY=95

# Console on main_uart0 (Verdin UART_3, the X18 debug USB).
CONFIG_LOG_MODE_MINIMAL=y
# Early UART markers ('H', 'K') for boots that never reach the banner.
CONFIG_SOC_AM62PX_A53_BOOT_MARKER=y

# Address space: the image plus the 256 MiB GPU carve-out (the overlay) and the
# device blocks. At the default 256 MiB the carve-out's mapping failed at boot
# ("insufficient virtual address space (requested 268435456)", 1eda74e5).
CONFIG_MAX_XLAT_TABLES=128
CONFIG_KERNEL_VM_SIZE=0x20000000
