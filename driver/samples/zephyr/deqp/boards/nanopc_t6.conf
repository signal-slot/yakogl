# NanoPC-T6 (RK3588, Mali-G610), kexec'd out of Armbian
# (driver/tools/kexec-zephyr/nanopc-t6.sh): YakoGL on the Mali with the
# in-process compiler (the Mali's only shader back end), over our own kernel
# side (src/osal/zephyr_mali.c, board::nanopc_t6_osal), reporting OpenGL ES
# 2.0 (DEQP_REPORT_ES2, prj.conf's default). The board's part of the image is
# src/mali_board.c: the firmware hand-over and the watchdog feed per case
# come from the board glue (driver/zephyr/lib/board/nanopc_t6), as in the
# gl_test image; the end is t6_reset_to_linux().
CONFIG_YAKOGL_GPU_MALI=y

# The console is uart2 (the board defconfig), the record the runner keeps;
# LOG_* through printk, so no line waits in a log thread when the image
# resets. prj.conf has the minimal log mode and the stack sentinel.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# The MMU's tables, as the gl_test image: the image's regions and the device
# maps; the arm64 MMU code k_panic()s when they run out.
CONFIG_MAX_XLAT_TABLES=64

# The watchdog (driver/zephyr/lib/board/nanopc_t6): WDT0 is fed until 600 s of
# uptime (one dEQP group, as the other boards' images), and only while
# t6_watchdog_feed() comes at most 60 s apart: the OSAL feeds it in every
# delay (its waits poll), and src/mali_board.c when a case begins and when it
# ends. A case that computes on the CPU for longer than 60 s without a GPU
# wait (dEQP's reference renderer on a large texture) is reset as a hang.
CONFIG_YAKOGL_NANOPC_T6_LIFETIME_S=600
CONFIG_YAKOGL_NANOPC_T6_ALIVE_S=60
