# Armadillo-X2 (A53), kexec'd out of Armadillo Base OS by tools/board.sh x2 on the
# crash route (crashkernel=256M@0x60000000). The same SoC and GPU as the Verdin
# (verdin_imx8mp_mimx8ml8_a53.conf is the template): the GC7000UL through YakoGL's
# Vivante back end, the GIC EOI fix, the interrupt guard, WDOG1 armed and fed for a
# BOUNDED 600 s (one dEQP group; then the watchdog resets the board back into
# Linux), and the SNVS result record. What differs:
#  - the console is UART2 (the board.sh console, BOARD_UART): the names of the
#    failing cases come from it (tools/cts/deqp-uart-tally.py);
#  - the record is LPGPR1..3 and no w3 (CONFIG_GC_COMMON_RESULT_SNVS_KEEP_LPGPR0,
#    the board's Kconfig.defconfig: LPGPR0 is U-Boot's boot count), so the failing
#    names of a table row come from DEQP_FAILS pages of four (see
#    driver/tools/kexec-zephyr/README.md, "The Armadillo-X2");
#  - no display: dEQP renders offscreen, and the board's LCDIF3 adopt node is left
#    to Linux (the display driver would only bring the board layer's panel path in).
CONFIG_YAKOGL_DRV_GPU_PVR=n
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=n

CONFIG_YAKOGL_GC_BOARD=y
# The image arms WDOG1 itself and feeds it from its own 1 s timer for 600 s;
# tools/board.sh refuses an image without its "gc_wdog_arm: armed" line.
CONFIG_GC_BOARD_WDOG_SELF_ARM=y
CONFIG_GC_BOARD_WDOG_SECONDS=600
CONFIG_GC_COMMON_PANEL_CONSOLE=n
# sample_glue.c brings the reset-at-once fatal handler with YAKOGL_SAMPLE_REBOOT.
CONFIG_GC_SAMPLE_FATAL_HANDLER=n
CONFIG_UART_CONSOLE=y

# Done: reset through PSCI back into Linux, after a short hold.
CONFIG_YAKOGL_SAMPLE_HOLD_SECONDS=5
CONFIG_YAKOGL_SAMPLE_REBOOT=y
CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The heap and the kernel VM as the Verdin's (same memory map, same GPU carveout):
# see verdin_imx8mp_mimx8ml8_a53.conf for the reasons.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=167772160
CONFIG_KERNEL_VM_SIZE=0x20000000
