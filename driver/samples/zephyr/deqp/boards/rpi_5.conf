# Raspberry Pi 5 (V3D 7.1, BCM2712 D0): YakoGL on the V3D 7.1 with the
# in-process compiler (the V3D's only shader back end), reporting OpenGL ES
# 2.0 (dEQP-GLES2 applies ES 2.0 rules only to a context that says ES 2.0:
# DEQP_REPORT_ES2). The Pi 4's deqp values (boards/rpi_4b.conf) with the Pi 5's
# specifics of gl_test (../gl_test/boards/rpi_5.conf): the 7.1 table, the
# board layer's PM watchdog and mailbox, uart10 as the console, no screen.
# The 7.1 table is chosen when the image is built (docs/notes/v3d71-gl-table.md,
# section 4): YAKOGL_GPU_V3D71 beside YAKOGL_GPU_V3D (zephyr/Kconfig).
CONFIG_YAKOGL_GPU_V3D=y
CONFIG_YAKOGL_GPU_V3D71=y
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=50331648
# Tiled texture copies kept across jobs (rpi_4b.conf: 16 MiB, a 512x512 cube's
# mip chain at 4 bytes a texel).
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=16777216
# Compiler scratch: the Pi 4's 8 MiB (the dEQP-GLES3 S16 and UA1 programs).
CONFIG_YAKOGL_SHADERC_SCRATCH_BYTES=8388608

# The watchdog is the board layer's (YAKOGL_RPI5_WDOG, selected by
# YAKOGL_GPU_V3D71): fed for the image's whole lifetime, run and record
# together. It holds the same seconds as V3D_DEQP_LIFETIME_S (the sample's
# Kconfig, default 240); CMakeLists.txt refuses an image where they differ.
CONFIG_YAKOGL_RPI5_WDOG_HOLD_S=240

# The console is the board defconfig's uart10, as in the rpi5 probes; there is
# no screen (src/v3d71_board.c: the record goes to the UART).
CONFIG_PRINTK=y
CONFIG_FPU_SHARING=y

# Address space: the image (256 MiB of RAM, the overlay), the carve-out's
# non-cacheable alias (48 MiB) and the device blocks (the hub, the core, pm, the
# SMS and the mailbox, above 4 GiB): the Pi 4's deqp values.
CONFIG_MAX_XLAT_TABLES=128
CONFIG_KERNEL_VM_SIZE=0x20000000
