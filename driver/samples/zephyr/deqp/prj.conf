CONFIG_SAFEUI_GPU_PVR=y
CONFIG_YAKOGL=y
# dEQP compiles the shaders it generates at run time: the in-process compiler.
CONFIG_YAKOGL_SHADERC_ONLINE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_FPU=y
CONFIG_CACHE_MANAGEMENT=y
# dEQP's delibs over Zephyr's POSIX layer, and a full C++ runtime.
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
# dEQP allocates freely; the compiler needs a deep stack (256 KiB floor).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_STACK_SENTINEL=y
CONFIG_ENFORCE_ZEPHYR_STDINT=n
