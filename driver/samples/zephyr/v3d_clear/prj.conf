# The console is the HDMI framebuffer (src/fbcon.c): printk and LOG_* are
# drawn there. The mini UART stays on as well, for whoever connects it.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_MAIN_STACK_SIZE=8192

# Address space. The board default is 8 translation tables and 8 MiB of kernel
# virtual space, sized for a 512 KiB image; this one has 32 MiB of RAM
# (boards/rpi_4b.overlay) and maps a 3.6 MiB framebuffer plus the V3D, PM,
# ASB and mailbox blocks with device_map(). Running out of tables is an
# assert at runtime (arch/arm64/core/mmu.c new_table), which would stop the
# image before the console exists, so there is room to spare here.
CONFIG_MAX_XLAT_TABLES=32
CONFIG_KERNEL_VM_SIZE=0x8000000
