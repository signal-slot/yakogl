# Verdin iMX8M Plus (Mallow): what the board needs for this sample beyond
# prj.conf. The GPU, display and reset lines are slint's
# (slint/boards/verdin_imx8mp_mimx8ml8_a53.conf); this board runs
# src/main_board.c on the board layer (CMakeLists.txt picks it).
#
# prj.conf asks for the PowerVR driver, which is the AM62P's; there is no
# img,img-rogue node here, so turn it off instead of leaving an unmet "y".
CONFIG_SAFEUI_GPU_PVR=n
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# The board layer: window in the GPU carve-out, the panel, the SNVS record,
# the WDOG1 self-arm (YAKOGL_BOARD_IMX8MP selects GC_BOARD_WDOG_SELF_ARM).
CONFIG_YAKOGL_BOARD=y
# FPU sharing off on purpose: with it on, printk from an interrupt handler
# spills argument registers through the FPU, which is disabled in exception
# context on arm64 (gc_slint/prj.conf).
CONFIG_FPU_SHARING=n
# No UART on the Mallow: the console is the board layer's panel console,
# and LOG_* goes through printk to reach it.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_MODE_MINIMAL=y
# The display chain (the LCDIF scans the window, imx8mp_display_on).
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
# The reset at the end of a run goes through PSCI.
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The window: slint's 1024x600, which fits the panel.
CONFIG_GL_FEMTOVG_WINDOW_WIDTH=1024
CONFIG_GL_FEMTOVG_WINDOW_HEIGHT=600
