CONFIG_SAFEUI_GPU_PVR=y
CONFIG_YAKOGL=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FPU=y
CONFIG_CACHE_MANAGEMENT=y

# The Rust FemtoVG staticlib allocates through Zephyr's libc heap
# (aligned_alloc/free). FemtoVG's canvas, path and gradient buffers need a few
# MB; give the common-libc malloc arena 16 MB. glShaderSource also copies the
# shader source through this heap.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216

# FemtoVG has deep call chains (path flattening, font rasteriser); keep the main
# thread stack generous.
# 256 KiB: the in-process shader compiler runs on this thread when the image
# is built with it (docs/online-shaderc/frontend.md, "Stack"); 64 KiB
# overflowed into the idle thread on the AM62P.
CONFIG_MAIN_STACK_SIZE=262144

# Needs the ES 3.0 report (YakoGL reports ES 2.0 by default): Slint/FemtoVG take their ES 3.0 path.
CONFIG_YAKOGL_REPORT_ES2=n
