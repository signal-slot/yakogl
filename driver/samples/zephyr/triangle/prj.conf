# The one triangle sample: the same configuration on every board. What a
# board needs beyond it (its GPU driver, display path, memory) is in boards/,
# selected by the Zephyr board; the window, the screen, the watchdog, the
# records and the end of the run are the board layer's (yakogl_board.h).
CONFIG_YAKOGL=y
CONFIG_YAKOGL_BOARD=y

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CACHE_MANAGEMENT=y

# The GL calls (and on the Pi 4 the compiler) use the FPU; the Rust archive
# is hard-float.
CONFIG_FPU=y

# The online compiler (the Pi 4's only shader back end) runs on the thread
# that calls glCompileShader/glLinkProgram and needs 256 KiB of stack
# (zephyr/Kconfig, YAKOGL_SHADERC_ONLINE); one size on every board.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_STACK_SENTINEL=y

# glShaderSource keeps a copy of the source, and the GL core's staging
# (v3d_gl_triangle's 1 MiB, the largest of the old triangle samples).
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
