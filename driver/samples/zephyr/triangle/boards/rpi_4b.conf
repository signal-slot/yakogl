# Raspberry Pi 4: what the board needs for this sample beyond prj.conf, from
# v3d_gl_triangle/prj.conf (the slint sample's boards/rpi_4b.conf). YakoGL on
# the V3D needs the in-process compiler (its only shader back end). Moves into
# the board layer once it carries the Pi 4's defaults (one-method.md
# section 2).
CONFIG_YAKOGL_SHADERC_ONLINE=y
CONFIG_YAKOGL_GPU_V3D=y
# 48 MiB of GPU memory (a static of the image; see rpi_4b.overlay).
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=50331648
CONFIG_FPU_SHARING=y
# Address space: the image (96 MiB, the overlay), the carve-out's
# non-cacheable alias (48 MiB), the framebuffer and the device blocks.
CONFIG_MAX_XLAT_TABLES=64
CONFIG_KERNEL_VM_SIZE=0x10000000
