# examples/slint on the Verdin AM62P direct image, on top of app_direct.conf
# (examples/zephyr.cmake applies both; docs/notes/am62p-direct-boot.md):
# render the Slint cluster, animate it, hold the last frame, then reset,
# which boots this image again (each reset is another boot-time sample).
CONFIG_YAKOGL_BOARD_HOLD_S=20
CONFIG_YAKOGL_BOARD_ANIMATE_S=60

# The animation makes the run longer than app_direct.conf's: feed the
# self-armed RTI watchdog for 200 s, so a hung image is still reset by it
# (after its 60 s period).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=200
