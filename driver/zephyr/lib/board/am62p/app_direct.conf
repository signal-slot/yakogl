# Verdin AM62P started by the A53 SPL at power-on, in place of U-Boot proper
# (docs/notes/am62p-direct-boot.md). The board's devicetree has the display
# path on, so there is no overlay: bring the DSI panel up from cold, draw,
# show the window, hold it for the camera, then reset, which boots this image
# again (each reset is another boot-time sample).
CONFIG_YAKOGL_DRV_GPU_PVR=y
CONFIG_FPU_SHARING=y
CONFIG_YAKOGL_SHADERC_ONLINE=y

# The time since the R5 SPL started the GTC, at the board layer's init and
# at the first frame.
CONFIG_YAKOGL_BOARD_BOOT_TIME=y
CONFIG_YAKOGL_BOARD_HOLD_S=40
CONFIG_YAKOGL_SAMPLE_REBOOT=y
CONFIG_REBOOT=y

# Nothing started the RTI watchdog on this route: arm it here and feed it for
# 150 s, so a hung image is reset by it (after its 60 s period).
CONFIG_YAKOGL_AM62P_WDT_SECONDS=150
CONFIG_YAKOGL_AM62P_RTI_SELF_ARM=y
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT=n

# Init order: mailbox 40 -> TISCI 45 -> TISCI power-on 46 -> GPIO 47 ->
# RTI arm 47 -> I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 -> panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_YAKOGL_DRV_SN65DSI8X_SELF_START_INIT_PRIORITY=95
