# examples/slint on the Verdin iMX8M Plus direct image, on top of
# app_direct.conf (examples/zephyr.cmake applies both;
# docs/notes/imx8mp-direct-boot.md): the power-on demo.

# The Verdin iMX8MP DSI panel is 1280x800: render at its size (the 1024x600
# default would be shown as a window on it).
CONFIG_SLINT_WINDOW_WIDTH=1280
CONFIG_SLINT_WINDOW_HEIGHT=800
# The demo at power-on keeps running: the animation never ends, and WDOG1
# (self-armed, 60 s) is fed for as long as the render loop feeds
# board_watchdog_feed() within YAKOGL_BOARD_ALIVE_S, with no uptime bound
# (GC_BOARD_WDOG_UNBOUNDED). A hung loop still resets the board. Until
# 2026-10-22 the feeding stopped at GC_BOARD_WDOG_SECONDS (300 s) and the
# board went dark about 6 minutes in, before ANIMATE_S was over. A
# measurement image keeps the bound: drop these two lines and set
# YAKOGL_BOARD_ANIMATE_S and the holds instead.
CONFIG_SLINT_ANIMATE_FOREVER=y
CONFIG_GC_BOARD_WDOG_UNBOUNDED=y
CONFIG_YAKOGL_BOARD_ANIMATE_S=600
CONFIG_YAKOGL_BOARD_HOLD_S=3000
CONFIG_YAKOGL_BOARD_HOLD_FAIL_S=3000

# Power-on demo: the backlight waits for the first frame (no red/pink frame
# between the bring-up and the picture); only warnings and errors in the log
# (the panel console costs frame time; the boot-time marks are printk).
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP_BACKLIGHT_ON_FIRST_SHOW=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Animated picture without tearing and without a copy: two windows of the
# panel's size (the board layer hands out two), rendered in turn and each
# shown through the in-place flip at VSYNC, so the window being drawn is
# never the one scanned and the frame rate is the panel's. (The copy route,
# ALWAYS_COPY with two screen buffers, also removed the flicker, at about
# 10 fps; the first two-window try on 2026-10-22 failed only because the
# board layer then handed out one window.)
CONFIG_YAKOGL_BOARD_IMX8MP_WINDOWS=2
CONFIG_SLINT_WINDOW_BUFFERS=2
