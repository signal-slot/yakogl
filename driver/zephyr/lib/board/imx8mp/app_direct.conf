# Verdin iMX8M Plus started by TF-A as BL33 at power-on, in place of U-Boot
# proper (docs/notes/imx8mp-direct-boot.md). The board's devicetree has the
# display path on, so there is no overlay: bring the panel up from cold,
# draw, show the window, hold it for the camera, then reset, which boots
# this image again (each reset is another boot-time sample).
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# FPU sharing off on purpose: with it on, printk from an interrupt handler
# spills argument registers through the FPU, which is disabled in exception
# context on arm64 (gc_slint/prj.conf).
CONFIG_FPU_SHARING=n
# No UART on the carrier: the console is the board layer's panel console.
CONFIG_UART_CONSOLE=n
# The display chain (the LCDIF scans the window, imx8mp_display_on, cold).
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=y
# The reset at the end of a run goes through PSCI.
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The time since SPL started the system counter, at the board layer's init
# and at the first frame (printed on the panel console).
CONFIG_YAKOGL_BOARD_BOOT_TIME=y
CONFIG_YAKOGL_BOARD_HOLD_S=40
