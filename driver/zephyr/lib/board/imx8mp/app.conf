# Verdin iMX8M Plus (Mallow): what the board needs for this sample beyond
# prj.conf, the slint sample's boards/verdin_imx8mp_mimx8ml8_a53.conf. Moves
# into the board layer once it carries the i.MX8MP's defaults (one-method.md
# section 2).
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# FPU sharing off on purpose: with it on, printk from an interrupt handler
# spills argument registers through the FPU, which is disabled in exception
# context on arm64 (gc_slint/prj.conf).
CONFIG_FPU_SHARING=n
# No UART on the Mallow: the console is the board layer's panel console.
CONFIG_UART_CONSOLE=n
# The display chain (the LCDIF scans the window, imx8mp_display_on).
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_YAKOGL_DRV_DISPLAY_IMX8MP=y
# The reset at the end of a run goes through PSCI.
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y
