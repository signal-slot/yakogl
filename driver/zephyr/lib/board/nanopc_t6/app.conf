# NanoPC-T6: what the board needs for an example beyond prj.conf
# (examples/zephyr.cmake). YakoGL on the Mali-G610 with the in-process
# compiler (the Mali's only shader back end), over our own kernel side
# (src/osal/zephyr_mali.c). The window is the end of the GPU's carve-out
# (board_nanopc_t6.c), which keeps zephyr/Kconfig's default of 32 MiB: a
# 1024x768 window takes 3 MiB of it.
CONFIG_YAKOGL_GPU_MALI=y

# The console is uart2 (the board defconfig), the record the runner keeps;
# LOG_* through printk, so no line waits in a log thread when the image
# resets.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y

# A stack overflow must fault where it happens: the sentinel checks the
# lowest stack word at every context switch.
CONFIG_STACK_SENTINEL=y

# The MMU's tables: the image's regions and the device maps, as the board's
# gl_test image (driver/samples/zephyr/gl_test/boards/nanopc_t6.conf), plus
# the display path's seven register blocks (board_nanopc_t6.c). The arm64
# MMU code k_panic()s when they run out.
CONFIG_MAX_XLAT_TABLES=64
