# STM32MP257F-DK, Cortex-A35: what the board needs for a sample beyond its
# prj.conf (examples/zephyr.cmake applies it; gc_fence, gc_clear). Plan #322.
# The Vivante driver on the DK's vivante,gc node (app.overlay); the GPU is
# powered by this layer (gc_power_mp2.c over stm32mp2_gpu.h: SCMI over
# OP-TEE, the RCC), not by the driver.
CONFIG_YAKOGL_DRV_GPU_VIVANTE=y
CONFIG_YAKOGL_GPU_VIVANTE=y
# FPU sharing off on purpose: with it on, printk from an interrupt handler
# spills argument registers through the FPU, which is disabled in exception
# context on arm64 (as on the i.MX8MP).
CONFIG_FPU_SHARING=n
# OP-TEE's watchdog armed at boot ("gc_wdog_arm: armed", the line the runner
# requires); the run ends with PSCI SYSTEM_RESET (mp2_reset_to_linux), at
# CONFIG_YAKOGL_STM32MP2_LIFETIME_S at the latest.
CONFIG_YAKOGL_STM32MP2_WDOG=y
# No screen to hold a picture on: board_finish() resets at once.
CONFIG_YAKOGL_BOARD_HOLD_S=0
CONFIG_YAKOGL_BOARD_HOLD_FAIL_S=0
CONFIG_EARLY_CONSOLE=y
