# Verdin iMX95, Cortex-A55: what the board needs for an example beyond its
# prj.conf (examples/zephyr.cmake applies it). The GPU is the Mali-G310,
# through the Mali OSAL (src/osal/zephyr_mali.c) whose board half here
# (verdin_imx95_mali.c) powers it over SCMI and brings it up with the
# embedded CSF firmware (driver/src/fw/mali_csffw_blob.h). The screen is
# the 10.1" DSI display on X4 (app.overlay, verdin_imx95_display.c); no
# watchdog yet (Kconfig here). Built only; not run on a board.
CONFIG_YAKOGL_GPU_MALI=y

# The board layer's window memory at the Mali carve-out's end: the windows
# (YAKOGL_BOARD_WINDOW_MAX_KB, 4800 KiB) and the 1280x800 screen buffer
# (4000 KiB), 8800 KiB; the carve-out grows by as much over its 32 MiB
# default, so the GL side keeps what it had.
CONFIG_YAKOGL_MALI_WINDOW_BYTES=9011200
CONFIG_YAKOGL_MALI_CARVEOUT_BYTES=42565632

# The module's PCAL6416A carries the X4 display's enable; its interrupt line
# is not used.
CONFIG_GPIO_PCA_SERIES_INTERRUPT=n

# printk straight to the UART, as the NanoPC-T6's GL image.
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y

# The MMU's tables: the image's regions, the OSAL's 2 MiB-aligned .noinit
# block made uncached in place, and the device maps (the UART, the GIC, the
# MU and the SCMI shared memory, the GPU, the two LPI2Cs and the display's
# nine blocks). The NanoPC-T6's GL image takes 64.
CONFIG_MAX_XLAT_TABLES=96
