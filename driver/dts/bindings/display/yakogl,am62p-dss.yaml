description: TI AM62P display subsystem (DSS7) driven from the MCU R5F for the safety layer

compatible: "yakogl,am62p-dss"

include: [display-controller.yaml, base.yaml]

properties:
  reg:
    required: true
    description: common, vidl1, vid, ovr1, ovr2, vp1, vp2, common1
  reg-names:
    required: true
  interrupts:
    description: DSS functional interrupt line of this host (VIM 92 for DSS1 on the MCU R5F)
  tisci:
    type: phandle
    description: TISCI client used to power the module and set the pixel clock
  tisci-device-id:
    type: int
    required: true
    description: TISCI device id (DSS1 = 232)
  tisci-aux-device-ids:
    type: array
    description: |
      Other TISCI devices that must be on for this DSS (Linux lists power
      domain 244 next to 232 for DSS1 on the AM62P). Cores without a TISCI
      power-on-devices list (the A53) name them here.
  tisci-fck-clk-id:
    type: int
    default: 8
  tisci-vp-clk-id:
    type: int
    default: 0
    description: clock id of the video port clock source (DSS1 VP1 = OLDI clock, id 0)
  vp-clk-div:
    type: int
    default: 7
    description: fixed divider between the TISCI clock and the pixel clock
  video-port:
    type: int
    default: 1
    description: video port driving the panel (1 or 2)
  pixel-clock-hz:
    type: int
    required: true
  hfront-porch:
    type: int
    required: true
  hback-porch:
    type: int
    required: true
  hsync-len:
    type: int
    required: true
  vfront-porch:
    type: int
    required: true
  vback-porch:
    type: int
    required: true
  vsync-len:
    type: int
    required: true
  hsync-active-low:
    type: boolean
  vsync-active-low:
    type: boolean
  de-active-low:
    type: boolean
  pixclk-negedge:
    type: boolean
