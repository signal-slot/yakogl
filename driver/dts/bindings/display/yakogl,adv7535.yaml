description: |
  Analog Devices ADV7535 MIPI DSI to HDMI bridge on I2C (the STM32MP257F-DK's
  HDMI output; stm32mp257f-dk.dts:328-350, :428-460, ST's compatible
  "adi,adv7535"). The register logic is driver/rust/src/ip/adv7535.rs, from
  Linux's drivers/gpu/drm/bridge/adv7511/ (adv7511_drv.c, adv7533.c) in its
  ADV7533 mode, which the ADV7535 shares.

  The main register map sits at `reg`; the secondary maps (EDID, CEC/DSI,
  packet memory) are separate I2C addresses the driver programs into the
  chip at init, named as in Linux's adi,adv7533 binding (reg-names "edid",
  "cec", "packet").

compatible: "yakogl,adv7535"

include: [i2c-device.yaml]

properties:
  reg:
    required: true
    description: |
      The main map; 0x3d on the DK (stm32mp257f-dk.dts:328-350). 0x39 or
      0x3d by the strapping (Linux adv7511 binding).

  edid-reg:
    type: int
    default: 0x3f
    description: |
      I2C address of the EDID map (Linux adv7511 "edid" reg; the chip's
      EDID_I2C_ADDR register 0x43 holds it shifted left, reset 0x7e).

  cec-reg:
    type: int
    default: 0x3c
    description: |
      I2C address of the CEC / DSI map (Linux "cec" reg; in ADV7533 mode it
      holds the MIPI DSI receiver registers, CEC_I2C_ADDR register 0xe1,
      reset 0x78).

  packet-reg:
    type: int
    default: 0x38
    description: |
      I2C address of the packet memory map (Linux "packet" reg;
      PACKET_I2C_ADDR register 0x45, reset 0x70).

  hpd-gpios:
    type: phandle-array
    description: |
      A hot-plug detect line, if wired. Absent: HPD is read from the chip's
      status register 0x42.

  pd-gpios:
    type: phandle-array
    description: |
      The chip's power-down pin (active low at the pin), if wired (Linux
      adv7511 binding "pd-gpios"). Absent: not driven.

  interrupts:
    description: "The chip's INT output, if wired. Absent: the driver polls."

  adi,dsi-lanes:
    type: int
    default: 4
    enum: [1, 2, 3, 4]
    description: |
      DSI data lanes used (Linux adi,adv7533 binding "adi,dsi-lanes"; four on
      the DK, stm32mp257f-dk.dts:428-433). Must equal the DSI host's
      data-lanes.

  adi,disable-timing-generator:
    type: boolean
    description: |
      Disable the chip's internal timing generator (Linux adi,adv7533
      binding): the DSI stream's own timing is used. Absent: the timing
      generator runs.
