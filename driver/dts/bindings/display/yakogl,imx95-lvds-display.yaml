description: |
  The i.MX 95's display stream 0 routed to its native LVDS output, as one
  picture: the LVDS CSR (LDB, LVDS PHY 0), the DPU, the display block's CSR
  and pixel interleaver, a TPM for the backlight's PWM and an RGPIO port for
  its enable. The register logic is driver/rust/src/board/verdin_imx95_lvds.rs
  (the order of driver/docs/imx95-display.md section 4(b')); the board layer
  drives it (driver/zephyr/lib/board/verdin_imx95/verdin_imx95_lvds.c), no
  Zephyr driver binds this node. The blocks' clocks and power domain are the
  System Manager's, asked over SCMI by the Rust side.

  Every value here is a fact of the SoC (the addresses) or of the display
  on the carrier (the backlight's pads).

compatible: "yakogl,imx95-lvds-display"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true
    description: |
      "ldb" (the LVDS CSR), "dpu", "csr" (display CSR), "interleaver",
      "tpm" (the backlight's TPM), "gpio" (the RGPIO port of its enable), in
      this order.

  pinctrl-0:
    required: true
    description: The backlight's TPM channel and its enable pin on their pads.
