description: |
  An i.MX8MP LCDIFv3 that the previous kernel left scanning out, adopted as is.

  An image kexec'd through the crash route (no device_shutdown()) finds the
  whole display chain behind the LCDIF running: clocks, power domains, the
  encoder and the PHY. This node lets the image re-point the running layer at
  its own buffers and flip them, with the same imx8mp_display_* API the full
  yakogl,imx8mp-display pipeline provides, without knowing anything about
  what sits downstream of the LCDIF. That is how a board whose chain the
  driver cannot yet bring up from cold (the Armadillo-X2's LCDIF3 -> HDMI)
  gets a picture.

  It never powers, clocks or configures anything: on a dark LCDIF,
  imx8mp_display_on() fails with -ENODEV.

compatible: "yakogl,imx8mp-lcdif-adopt"

include: base.yaml

properties:
  reg:
    required: true
    description: The LCDIFv3 register block (LCDIF3 is 0x32fc6000).

  hactive:
    type: int
    required: true
    description: |
      The mode the chain is expected to be running, in pixels. It is what
      imx8mp_display_geometry() reports before the display is adopted, so
      that a caller can size its buffers first; imx8mp_display_on() checks it
      against what the LCDIF is really scanning.

  vactive:
    type: int
    required: true
    description: The expected mode's active lines.
