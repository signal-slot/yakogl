description: |
  The i.MX 8M Plus MEDIAMIX: its GPC power domain, its CCM bus roots and
  clock gate, the MEDIA_BLK_CTRL block control, and VIDEO_PLL1 / the pixel
  and MIPI PHY reference clock roots. Register logic in Rust
  (driver/rust/src/soc/imx8mp/media.rs), written from IMX8MPRM Rev. 3;
  driver/drivers/power_domain/power_domain_yakogl_imx8mp_media.c registers it.

  The node holds the shared state; its children are the power domains a
  display consumer names in its power-domains (yakogl,imx8mp-media-pd):
  "lcdif1" (MEDIAMIX + the LCDIF1 clocks and resets) and "mipi-dsi1"
  (MEDIAMIX + the MIPI_PHY1 domain + the DSI and D-PHY clocks and resets).

  It also opens, at PRE_KERNEL_1, the clock roots and gates a kexec'd image
  needs before any driver runs (early-ccm-roots / early-ccm-gates): Linux
  gates idle peripherals' clocks, and the first register access of a Zephyr
  driver to a gated block faults.

compatible: "yakogl,imx8mp-media-blk-ctrl"

include: [base.yaml]

properties:
  reg:
    required: true
  reg-names:
    required: true
    description: |
      "blkctrl" (MEDIA_BLK_CTRL), "gpc", "ccm", "anatop" (CCM_ANALOG).
  early-ccm-roots:
    type: array
    description: |
      CCM clock root slices (IMX8MPRM Table 5-1) to enable at PRE_KERNEL_1;
      their mux and dividers are kept.
  early-ccm-gates:
    type: array
    description: |
      CCM CCGR indices (IMX8MPRM Table 5-9) to open for domain 0 at
      PRE_KERNEL_1.
