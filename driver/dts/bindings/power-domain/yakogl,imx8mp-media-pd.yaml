description: |
  One display power domain under a yakogl,imx8mp-media-blk-ctrl node (its
  parent): a Zephyr power-domain device (PM_DEVICE_DT_INST_DEFINE). Resume
  turns it on (MEDIAMIX first), suspend turns it off (the last one off
  powers MEDIAMIX down). A domain the previous kernel left on is adopted
  without a register write.

compatible: "yakogl,imx8mp-media-pd"

include: [base.yaml]

properties:
  domain:
    type: string
    required: true
    enum:
      - "lcdif1"
      - "mipi-dsi1"
  "#power-domain-cells":
    const: 0
    required: true
