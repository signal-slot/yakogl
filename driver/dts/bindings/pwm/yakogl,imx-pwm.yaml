description: |
  The i.MX "PWM" block (one output, 16-bit counter, four-word sample FIFO) of
  the i.MX 8M Plus (PWM1-4), as a Zephyr PWM device whose register logic is
  Rust (driver/drivers/pwm/pwm_yakogl_imx.c, driver/rust/src/ip/imx_pwm.rs).

  The driver owns the PWM's clock: on the first enabling request it runs the
  CCM clock root ccm-root from the 24 MHz oscillator undivided and opens clock
  gate ccm-gate for the Cortex-A53, so get_cycles_per_sec is 24000000.
  Index values for the i.MX 8M Plus are hal_nxp fsl_clock.h's (MIMX8ML8):
  PWM1 root 103 gate 40, PWM2 104/41, PWM3 105/42, PWM4 106/43
  (kCLOCK_PwmN = CCM_TUPLE(gate, root)).

  Not fsl,imx27-pwm: that compatible is Zephyr's pwm_imx.c, which builds only
  for the i.MX6SX/7D M4 cores.

compatible: "yakogl,imx-pwm"

include: [pwm-controller.yaml, base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true
  reg-names:
    required: true
    description: |
      "pwm" (the PWM block) and "ccm" (the Clock Control Module).
  ccm-root:
    type: int
    required: true
    description: CCM ROOT[] index of this PWM's clock root.
  ccm-gate:
    type: int
    required: true
    description: CCM CCGR[] index of this PWM's clock gate.
  pinctrl-0:
    required: true
  pinctrl-names:
    required: true
  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
