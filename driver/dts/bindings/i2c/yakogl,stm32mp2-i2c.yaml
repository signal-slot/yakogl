description: |
  An STM32MP25 I2C controller (the STM32F7-style I2C IP of RM0457's I2C
  chapter; Linux drivers/i2c/busses/i2c-stm32f7.c, and the MP25's shape in
  Documentation/devicetree/bindings/i2c/st,stm32-i2c.yaml: compatible
  st,stm32mp25-i2c :22,:76, one clock :96-97) as a polled Zephyr I2C master
  on the A35. Zephyr has no I2C driver for the MP2's A35 side. Register
  logic in Rust (driver/rust/src/ip/stm32_i2c.rs); the bus carries the DK's
  ADV7535 (the &i2c2 bus node, stm32mp257f-dk.dts:395; the bridge node
  :428-431).

  The controller's clock gate, reset and RIF settings are the chain owner's;
  this device's init maps the registers only. As the shim has no clock
  driver, the kernel clock rate is a property. `clock-frequency` (the bus
  speed) comes from i2c-controller.yaml; the timing is computed from it as
  i2c-stm32f7.c's stm32f7_i2c_compute_timing does. The SCL rise and fall
  times and the filters are read as stm32f7_i2c_setup_timing does (below);
  ST's DK dts sets i2c-scl-rising-time-ns = <108> and
  i2c-scl-falling-time-ns = <12> on the ADV7535's bus (&i2c2,
  stm32mp257f-dk.dts:399-400) and neither filter property.

compatible: "yakogl,stm32mp2-i2c"

include: [i2c-controller.yaml]

properties:
  reg:
    required: true
    description: |
      The controller registers; the DK's ADV7535 bus is i2c2 at 0x40130000,
      size 0x400 (ST stm32mp251.dtsi:935-936).

  kernel-clock-frequency:
    type: int
    required: true
    description: |
      Hz of the I2C kernel clock the board leaves on the controller, as read
      by the mp2_display_state probe. It is the controller's single clock
      (i2c-stm32f7.c:2210, the "NULL"-id clock; the DK's i2c2 gets
      CK_KER_I2C2, stm32mp251.dtsi:939), whose rate the timing computation
      uses as setup->clock_src (i2c-stm32f7.c:686); it fixes the TIMINGR
      prescaler and SCL counts.

  i2c-scl-rising-time-ns:
    type: int
    default: 25
    description: |
      SCL rise time in ns, as i2c-stm32f7.c's stm32f7_i2c_setup_timing
      reads it through i2c_parse_fw_timings into setup.rise_time; absent it
      keeps STM32F7_I2C_RISE_TIME_DEFAULT, 25. ST's DK sets 108 on i2c2.

  i2c-scl-falling-time-ns:
    type: int
    default: 10
    description: |
      SCL fall time in ns, read like i2c-scl-rising-time-ns into
      setup.fall_time; absent it keeps STM32F7_I2C_FALL_TIME_DEFAULT, 10.
      ST's DK sets 12 on i2c2.

  i2c-analog-filter:
    type: boolean
    description: |
      Leave the analog noise filter on. i2c-stm32f7.c reads it with
      of_property_read_bool("i2c-analog-filter"): absent means the filter is
      off (CR1.ANFOFF set), present clears ANFOFF and adds the filter delay
      to the timing computation. The DK's i2c2 does not set it.

  i2c-digital-filter-width-ns:
    type: int
    default: 0
    description: |
      Digital noise filter width in ns (0: none); the driver turns it into
      CR1.DNF = DIV_ROUND_CLOSEST(width, i2c_clk period), at most 15.
      i2c-stm32f7.c takes the width from i2c_parse_fw_timings but keeps
      STM32F7_I2C_DNF_DEFAULT (0) unless the boolean "i2c-digital-filter"
      is also present, so the stock driver needs both. This binding does not
      define that boolean: the width alone selects the filter here. The DK's
      i2c2 sets neither.
