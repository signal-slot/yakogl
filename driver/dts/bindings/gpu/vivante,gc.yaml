description: |
  Vivante GC7000 class GPU (GC7000UL on the NXP i.MX8MP) driven by the
  yakogl-drivers module's Vivante driver (src/vivante/): powered through the GPC
  and clocked through the CCM by the driver itself, with a physically
  contiguous DDR carveout for its page tables, command buffers and render
  objects.

compatible: "vivante,gc"

include: base.yaml

properties:
  reg:
    required: true
    description: |
      Three ranges, named "gpu" (the GPU register block, 32 KiB at 0x38000000
      on the i.MX8MP), "gpc" (the general power controller, 64 KiB at
      0x303a0000) and "ccm" (the clock control module, 64 KiB at 0x30380000).

  reg-names:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: "GPU core clock in Hz (i.MX8MP: 800000000, sys_pll1_800m)."

  memory-region:
    type: phandle
    required: true
    description: |
      The GPU carveout: a reserved-memory node of at least 64 MiB that no
      other Zephyr memory region overlaps (the driver maps it itself).
