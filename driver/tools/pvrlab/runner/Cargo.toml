#
# The gl_test runner: the walker of driver/tools/pvrlab/gl_test.c (which
# cases run, their skip and verdict lines, the tally the boards' records
# read) in Rust, over the C case bodies, which it calls through FFI. The
# first step of moving the suite to Rust: a case moves later by replacing its
# C function and its `case 'n'` arm, nothing here changes.
#
# An rlib with no dependencies, no_std, no allocator, no statics but the list
# a caller stores and the record counters the C side reads. Every build that
# links gl_test.c links it: libyakogl.a with the `gl-test-runner` feature of
# yakogl-capi (the Zephyr gl_test images, the host harness), and
# panthor-gltest (tools/mali/panthor) directly. The host tests are
# `cargo test -p yakogl-gltest-runner`.
[package]
name = "yakogl-gltest-runner"
description = "The gl_test runner: case selection, verdict lines and the record of tools/pvrlab/gl_test.c, in Rust over its C cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "yakogl_gltest_runner"
path = "src/lib.rs"
doctest = false
bench = false

[dependencies]
