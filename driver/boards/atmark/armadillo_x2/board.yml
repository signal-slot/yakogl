# Atmark Techno Armadillo-X2 (i.MX8M Plus), Cortex-A53 cluster only.
#   armadillo_x2/mimx8ml8/a53         an image kexec'd out of Armadillo Base OS
#                                     (armadillo_x2_mimx8ml8_a53.dts)
#   armadillo_x2/mimx8ml8/a53/direct  the same image type started by TF-A as
#                                     BL33 at power-on, no U-Boot and no Linux
#                                     (armadillo_x2_mimx8ml8_a53_direct.dts,
#                                     tools/cts/log/x2-direct-boot.md)
board:
  name: armadillo_x2
  full_name: Atmark Techno Armadillo-X2
  vendor: atmark
  socs:
  - name: mimx8ml8
    variants:
    - name: a53
      cpucluster: a53
    - name: direct
      cpucluster: a53
