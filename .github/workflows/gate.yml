#
# The gate: tools/check.sh on every pull request to main, on every push to
# main and nightly.
#
# A pull request runs the rows its diff reaches: `check.sh --changed
# <merge base>`, where the merge base is that of the base branch and the
# commit checked out (the merge of the branch into main, refs/pull/N/merge).
# A push to main (the merge commit itself: main may have moved since the
# pull request's run), the nightly run and a run by hand run every row. They
# are the proof of the whole, and they catch a wrong `skip` of the scope map
# (docs/ci.md).
#
# It needs what GitHub's hosted runners do not have: the PowerVR firmware
# blob, Mesa's pco_shc, a west workspace with the Zephyr SDK, hal_nxp, a
# glmark2 tree. So it runs on a self-hosted runner, and the runner is a
# generic machine: it carries no project environment of its own. Everything
# this job needs comes from the layout ccfarm installs a project's
# dependencies in, ~/.local/share/ccfarm/deps/yakogl (a host that keeps them
# elsewhere links them into that layout); tools/cts/deps-env.sh names the
# entries and refuses the job when one is missing, `tools/setup-gate-host.sh
# --check` when a tool is, so a gap never looks like a pass. Another project
# uses the same runners with its own workflow and its own deps directory. No
# value in this file is secret.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

permissions:
  contents: read

# One run per commit; two runners can gate two commits at once. A pull
# request's run is replaced by the next push to it.
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # The job's git reads no global configuration of the runner's user (a
      # credential helper there once broke the fetch), but actions/checkout
      # must be able to write one (safe.directory), or it reports "could not
      # lock config file" and re-clones the repository on every run: an empty
      # file of this run's own, not /dev/null.
      - name: a git configuration of this run's own
        run: |
          : > "$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      # The whole history, so that the base branch and the merge base are
      # here for `--changed`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the project environment (ccfarm's dependency layout, tools/cts/deps-env.sh)
        run: |
          tools/cts/deps-env.sh --check
          tools/cts/deps-env.sh >> "$GITHUB_ENV"
          {
            echo "TMPDIR=$HOME/.cache/yakogl/tmp"
            echo "CARGO_TARGET_DIR=$HOME/.cache/yakogl/ci-target"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/yakogl/tmp" "$HOME/.cache/yakogl/ci-target"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          deps="$HOME/.local/share/ccfarm/deps/yakogl"
          [ -d "$deps/hosttools/bin" ] && echo "$deps/hosttools/bin" >> "$GITHUB_PATH"
          for d in /usr/lib/llvm/23/bin /usr/lib/llvm-21/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: the firmware blob (never committed)
        run: |
          mkdir -p driver/src/fw && cp "$PVR_FW_BLOB" driver/src/fw/
      - name: the gate host has every tool
        run: tools/setup-gate-host.sh --check
      - name: tools/check.sh --changed <merge base> (a pull request, the rows its diff reaches)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p build
          base=$(git merge-base "origin/$BASE_REF" HEAD) || { echo "no merge base with origin/$BASE_REF"; exit 1; }
          echo "merge base with origin/$BASE_REF: $base"
          tools/check.sh --changed "$base" 2>&1 | tee build/gate-ci.log
          test "${PIPESTATUS[0]}" -eq 0
      # A run on main records the test binaries that passed
      # (YAKOGL_CHECK_RECORD, tools/check.sh cargo_test), in
      # ~/.cache/yakogl/test-ok beside the target directory; a later run
      # skips a binary whose key is recorded. A pull request's run only
      # reads the record, so it reuses only passes of what is on main.
      - name: tools/check.sh (every row, main, nightly or by hand)
        if: github.event_name != 'pull_request'
        env:
          YAKOGL_CHECK_RECORD: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: |
          mkdir -p build
          tools/check.sh 2>&1 | tee build/gate-ci.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.sha }}
          path: build/gate-ci.log
          if-no-files-found: ignore
