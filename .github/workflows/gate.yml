#
# The full gate: every row of tools/check.sh, on every push to main and
# nightly. A landing runs only the rows its diff reaches (tools/land.sh,
# `check.sh --local`); this is where the rest run.
#
# It needs what GitHub's hosted runners do not have: the PowerVR firmware
# blob, Mesa's pco_shc, a west workspace with the Zephyr SDK, hal_nxp, a
# glmark2 tree. So it runs on a self-hosted runner, and the runner is a
# generic machine: it carries no project environment of its own. Everything
# this job needs comes from the layout ccfarm installs a project's
# dependencies in, ~/.local/share/ccfarm/deps/yakogl (a host that keeps them
# elsewhere links them into that layout); tools/cts/deps-env.sh names the
# entries and refuses the job when one is missing, `tools/setup-gate-host.sh
# --check` when a tool is, so a gap never looks like a pass. Another project
# uses the same runners with its own workflow and its own deps directory. No
# value in this file is secret.
name: gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

permissions:
  contents: read

# One run per commit; two runners can gate two commits at once.
concurrency:
  group: gate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # The job's git reads no global configuration of the runner's user (a
      # credential helper there once broke the fetch), but actions/checkout
      # must be able to write one (safe.directory), or it reports "could not
      # lock config file" and re-clones the repository on every run: an empty
      # file of this run's own, not /dev/null.
      - name: a git configuration of this run's own
        run: |
          : > "$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: the project environment (ccfarm's dependency layout, tools/cts/deps-env.sh)
        run: |
          tools/cts/deps-env.sh --check
          tools/cts/deps-env.sh >> "$GITHUB_ENV"
          {
            echo "TMPDIR=$HOME/.cache/yakogl/tmp"
            echo "CARGO_TARGET_DIR=$HOME/.cache/yakogl/ci-target"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/yakogl/tmp" "$HOME/.cache/yakogl/ci-target"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          deps="$HOME/.local/share/ccfarm/deps/yakogl"
          [ -d "$deps/hosttools/bin" ] && echo "$deps/hosttools/bin" >> "$GITHUB_PATH"
          for d in /usr/lib/llvm/23/bin /usr/lib/llvm-21/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: the firmware blob (never committed)
        run: |
          mkdir -p driver/src/fw && cp "$PVR_FW_BLOB" driver/src/fw/
      - name: the gate host has every tool
        run: tools/setup-gate-host.sh --check
      - name: tools/check.sh (every row)
        run: |
          mkdir -p build
          tools/check.sh 2>&1 | tee build/gate-ci.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.sha }}
          path: build/gate-ci.log
          if-no-files-found: ignore
