#
# The gate: tools/check.sh on every pull request (to main or
# ccfarm/integration), nightly and by hand. main is not run on every merge:
# a full run takes over an hour and main moves faster, so a run for each
# merge was cancelled by the next one before it ended and only held a
# runner the pull requests needed (the owner, 2026-10-25: main once a day).
#
# A pull request runs the rows its diff reaches: `check.sh --no-clippy
# --changed <merge base>`, where the merge base is that of the base branch
# and the commit checked out (the merge of the branch into the base branch,
# refs/pull/N/merge). A pull request's run leaves out every clippy row (the
# owner, 2026-11-13: clippy is a second type-check build of each feature set,
# 20% of the rows' time in run 43372841985); check.sh counts them as "left to
# the nightly", never as gaps. cargo fmt --check and every test row stay.
# The nightly run (on main's tip) and a run by hand run every row, clippy
# included: the nightly is clippy's gate (docs/ci.md). They are
# the proof of the whole, and they catch a wrong `skip` of the scope map
# (docs/ci.md). A nightly run whose commit already passed a full run (main
# did not move that day) runs nothing: step `seen`.
#
# It needs what GitHub's hosted runners do not have: the PowerVR firmware
# blob, Mesa's pco_shc, a west workspace with the Zephyr SDK, hal_nxp, a
# glmark2 tree. So it runs on a self-hosted runner, and the runner is a
# generic machine: it carries no project environment of its own. Everything
# this job needs comes from the layout connected installs a project's
# dependencies in (tools/cts/deps-env.sh --layout; a host that keeps them
# elsewhere links them into that layout); tools/cts/deps-env.sh names the
# entries and refuses the job when one is missing, `tools/setup-gate-host.sh
# --check` when a tool is, so a gap never looks like a pass. Another project
# uses the same runners with its own workflow and its own deps directory. No
# value in this file is secret.
#
# Pull requests from a fork (the public repository, #1606 step 9 / D7; plan
# #363's workflow-readiness finding named this as the open question). The
# runners are lab machines: they share their hosts with the farm's agents and
# hold the firmware blob and the dependency layout. A pull request's run
# executes the code it checks (build.rs, the tests, check.sh), so a pull
# request whose head repository is not this one never gets the `check` job:
# its `if` runs the job only for the schedule, a dispatch and a pull request
# from a branch of this repository (a head repository that no longer exists
# counts as a fork). Such a pull request gets the `outside` job instead, on
# a GitHub-hosted runner, with no token and no checkout, which says that a
# maintainer pushes the branch to this repository and the gate runs on that
# pull request. It fails on purpose: a skipped required check counts as a
# pass, and a green on a pull request nothing checked would be a lie.
#
# That `if` is not a security boundary. A `pull_request` run uses the
# workflow file of the pull request's merge commit, so a fork can edit this
# file and remove the `if`; GitHub's default approval covers only a first-time
# contributor's workflows. Before the repository is public the owner sets one
# of these (D7, a requirement, not an option): "Require approval for all
# outside collaborators" (Settings > Actions > General, fork pull request
# workflows), or a runner group for the yakogl-gate runners that does not
# allow public repositories. No trigger that runs the base branch's workflow
# with a write token on a fork's pull request (the pull-request-target event;
# a checkout of the head there is the classic hole), and no trigger on another
# workflow's completion (the workflow-run event), now or later.
name: gate

on:
  pull_request:
    # ccfarm's result pull requests target ccfarm/integration; they get the
    # same gate, so the review there is reading, not checking.
    branches: [main, ccfarm/integration]
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the first step reads this workflow's earlier runs
  pull-requests: read # and whether a pull request is still open

# A pull request's run is replaced by the next push to it. The nightly and a
# dispatched run are one per commit and never cancelled.
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request from a fork (header, "Pull requests from a fork"): no
  # self-hosted runner, no token, no checkout, no code of the pull request
  # run. The two values it prints are the pull request's number and its head
  # repository's name (GitHub restricts that name to letters, digits, `-`,
  # `_` and `.`), both through the environment, never in the script's text.
  # It fails so that the pull request is not green without a gate.
  outside:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: the gate does not run on a pull request from a fork
        run: |
          echo "pull request #$PR comes from ${HEAD_REPO:-a repository that no longer exists}, not from $GITHUB_REPOSITORY."
          echo "The gate (tools/check.sh) runs on this project's own runners and executes the code it checks,"
          echo "so it does not run on a pull request from a fork."
          echo "A maintainer who takes the change pushes the branch to $GITHUB_REPOSITORY and opens a pull"
          echo "request from it; that pull request gets the gate (CONTRIBUTING.md, 'How a change reaches main')."
          echo "This check stays red on purpose: nothing checked this pull request."
          exit 1
  check:
    # Only the schedule, a dispatch and a pull request from a branch of this
    # repository (header, "Pull requests from a fork"). A fork's pull request
    # gets `outside` above; its head.repo is null when the fork is gone, and
    # null is not this repository either.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Any runner with the label yakogl-gate (runners A, B and C), so the
    # gate never waits on one machine: on 2026-10-13 runner C, the only runner
    # then, hung out of memory and every pull request queued for hours behind
    # it. A slower runner is still a runner (user, 2026-10-14). Each run sizes
    # its compilers to the host's free memory (tools/check.sh, compiler slots),
    # so a runner that shares its machine with farm agents is safe to use.
    runs-on: [self-hosted, Linux, X64, yakogl-gate]
    # The full set (a diff that reaches every scope) takes about 2 h 45 min
    # on a runner VM with 8 cores and 3 compiler slots when its host is quiet
    # (run 42599974888, 2026-11-09) and ran past 3 h when the host was busy
    # (run 42653322316, cancelled at 180 min with the test rows still going).
    # A cancelled run tells nothing about the code, so the limit leaves room.
    # It is still the only guard against a hung row, so it stays bounded.
    timeout-minutes: 300
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Rows at once (tools/check.sh --jobs). Measured on 8 cores (runner A's
      # count) on fc1bb2a6, every row, empty cache: 1174 s with 1, 877 s
      # with 2, 547-593 s with 4 (docs/ci.md, section 1). A test row already
      # uses every core, so more rows mostly overlap the one-core rows; more
      # than 4 was not measured. The farm's agents keep priority through CPU
      # weight (docs/ci.md 3.3, "Beside the farm"), not through this count.
      # The count is not set here: the first step sets it from the machine's
      # cores (half of them, 4 on 8), so it follows the pool's machine
      # (tools/env/yakogl-gate.yaml) and not a number in this file. It was a
      # fixed "4" until 2026-11-13.
    steps:
      - name: Rows at once, from the cores
        run: |
          jobs=$(( $(nproc) / 2 ))
          [ "$jobs" -ge 1 ] || jobs=1
          echo "YAKOGL_CHECK_JOBS=$jobs" >> "$GITHUB_ENV"
      # Whether the run is needed. A nightly run on a commit that already passed
      # a nightly or a dispatched run proves nothing new; a red earlier run is
      # run again (it may have been the runner's fault). A pull request's run
      # waits in the queue for hours, and GitHub does not drop it when the pull
      # request is closed (on 2026-10-25 34 of the 106 queued runs were of
      # closed pull requests): such a run checks nothing anyone will read. A pull request still open and a run by hand
      # always run.
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])') ||
              { echo "could not read the pull request: the run goes ahead"; state=open; }
            if [ "$state" != open ]; then
              echo "pull request #$PR is $state: nothing to run"
              run=false
            fi
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # the API key is split so the trigger grep of the release checks stays clean
            passed=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" |
              python3 -c 'import json,sys; print(sum(r["event"] in ("schedule","workflow_dispatch") for r in json.load(sys.stdin)["workflow""_runs"]))') ||
              { echo "could not read the earlier runs: the full run goes ahead"; passed=0; }
            if [ "$passed" -gt 0 ]; then
              echo "$GITHUB_SHA already passed a full run: main did not move, nothing to run"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # The job's git reads no global configuration of the runner's user (a
      # credential helper there once broke the fetch), but actions/checkout
      # must be able to write one (safe.directory), or it reports "could not
      # lock config file" and re-clones the repository on every run: an empty
      # file of this run's own, not /dev/null.
      - name: a git configuration of this run's own
        if: steps.seen.outputs.run == 'true'
        run: |
          : > "$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
      # The whole history, so that the base branch and the merge base are
      # here for `--changed`.
      - uses: actions/checkout@v4
        if: steps.seen.outputs.run == 'true'
        with:
          fetch-depth: 0
      - name: the distro packages deps.toml names, when the runner lacks one
        if: steps.seen.outputs.run == 'true'
        # A package that joins tools/cts/deps.toml (or the gate's own list in
        # tools/setup-gate-host.sh) reaches the gate image at its next build
        # (tools/env/build-gate-image.sh). Until then the job installs it
        # here: nothing runs when the image has every package, and only the
        # missing ones are installed otherwise (passwordless sudo, as the
        # image's build has it). The step fails, naming the owner command,
        # where that is not possible. It comes before the project environment
        # below, because the entries built there (LZ4, MP2_QEMU) need the
        # build tools their entries name (setup-gate-host.sh: the packages
        # first, then deps-env.sh's builds).
        run: tools/setup-gate-host.sh --install-packages
      - name: the project environment (ccfarm's dependency layout, tools/cts/deps-env.sh)
        if: steps.seen.outputs.run == 'true'
        # The Mali CSF firmware is one file pinned by sha256 in deps.toml
        # (linux-firmware's, never committed), and the dEQP GLES3 shader
        # corpus is one directory of VK-GL-CTS at a pinned commit (3.6 MB,
        # test data only): a runner that lacks either fetches it here, where
        # an entry that is present is never touched. So is PCO_SPM_LOAD_CAPTURE,
        # one program of the Mesa build every runner already made pco_shc
        # from (the same tarball, patches and options; about a minute, once:
        # the runners were prepared before the entry existed, and a missing
        # entry refuses the job below). So is MP2_QEMU, the qemu-system-aarch64
        # of the uboot-mp2 qemu row: pinned QEMU, glib and libslirp sources
        # built without root with the build tools its entry names (the
        # package step above installs any the runner lacks); about 7 minutes
        # on 4 cores, once per runner, and never again while its binary is
        # there. Every other entry is a tree a host is prepared with, never
        # built here. The LLVM directories go on PATH first: that build runs
        # clang and llvm-spirv.
        run: |
          for d in /usr/lib/llvm/23/bin /usr/lib/llvm-21/bin; do [ -d "$d" ] && export PATH="$d:$PATH"; done
          tools/cts/deps-env.sh --build MALI_CSFFW DEQP_GLES3_TEST_DIR PCO_SPM_LOAD_CAPTURE LZ4 MP2_QEMU
          tools/cts/deps-env.sh --check
          tools/cts/deps-env.sh >> "$GITHUB_ENV"
          {
            echo "TMPDIR=$HOME/.cache/yakogl/tmp"
            echo "CARGO_TARGET_DIR=$HOME/.cache/yakogl/ci-target"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/yakogl/tmp" "$HOME/.cache/yakogl/ci-target"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          deps=$(tools/cts/deps-env.sh --layout)
          [ -d "$deps/hosttools/bin" ] && echo "$deps/hosttools/bin" >> "$GITHUB_PATH"
          for d in /usr/lib/llvm/23/bin /usr/lib/llvm-21/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      # The machine starts from the image of the last green run on main
      # (tools/env/yakogl-gate.yaml), build cache included, and cargo never
      # removes what it stopped using. A unit (one crate built for one
      # feature set, profile and target) whose features, flags or
      # dependencies changed gets a new hash, and the old unit's outputs stay
      # beside the new ones; so do the incremental directories no run has
      # written since October. Each generation of the image inherits them.
      # Measured on the image of 2026-11-19 (issue #10579): 174 GiB of the
      # 193 GiB disk were used and 20 GiB free at the start of a job; 2,722
      # of the cache's 16,878 units (23.8 GiB) and 47.5 GiB of incremental
      # files had not been used since October. Runs that built the 134 test
      # files added since that image ended with "No space left on device".
      #
      # A unit is in use when cargo read or wrote its record
      # (<profile>/.fingerprint/<package>-<hash>/) in the two days before
      # the cache's last write: cargo reads the record of every unit of
      # every build, also of a unit it finds fresh. The outputs themselves
      # do not tell: cargo never reads a fresh unit's invoked.timestamp, .d
      # or .rmeta file, and removing files by their own read time made cargo
      # build 23 third-party crates again for one tool (measured on the same
      # image; with the rule below it built none). An unused unit loses its
      # record, its outputs (<profile>/deps/*-<hash>*) and its build script
      # directory (<profile>/build/<package>-<hash>). An incremental file
      # goes when it was neither read nor written in those two days.
      #
      # The last write is the end of the run the image was captured from, so
      # the rule does not depend on how old the image is. A write after
      # "now" (a wrong clock) is not counted. Read times need a file system
      # that keeps them (ext4 relatime here: a read moves a read time that
      # is older than a day or than the file's last write), so nothing is
      # removed on a noatime mount. Cargo builds a unit again when its record
      # is gone, so a wrong removal costs time, not a wrong result. On that
      # image the step took 5 s and left 88 GiB free.
      - name: the build cache keeps only the units the last runs used (the disk's free space before and after)
        if: steps.seen.outputs.run == 'true'
        run: |
          set -o pipefail
          t=$CARGO_TARGET_DIR
          if [ ! -d "$t" ]; then
            echo "no build cache yet: nothing to remove"
            exit 0
          fi
          df -h --output=size,used,avail,pcent,target "$t"
          case ",$(findmnt -no OPTIONS -T "$t")," in
            *,noatime,*)
              echo "the build cache's filesystem is mounted noatime: read times say nothing, nothing is removed"
              exit 0 ;;
          esac
          now=$(date +%s)
          last=$(find "$t" -type f -printf '%T@\n' | awk -v now="$now" '$1 <= now && $1 > t { t = $1 } END { printf "%d", t }')
          if [ "$last" -eq 0 ]; then
            echo "the build cache is empty: nothing to remove"
            exit 0
          fi
          cut=$((last - 2 * 86400))
          echo "last write $(date -u -d "@$last" +%FT%TZ); a unit is in use when cargo read or wrote its record after $(date -u -d "@$cut" +%FT%TZ)"
          used() { df --output=used -B1 "$t" | tail -n 1; }
          before=$(used)
          # The record directories (<profile>/.fingerprint/<package>-<hash>) with no
          # file read or written after the cut, one per line.
          dead="$RUNNER_TEMP/build-cache-unused-units"
          find "$t" -type f -path '*/.fingerprint/*' -printf '%A@ %T@ %h\n' |
            awk -v cut="$cut" '
              { d = substr($0, length($1) + length($2) + 3); seen[d] = 1; if ($1 > cut || $2 > cut) live[d] = 1 }
              END { for (d in seen) if (!(d in live)) print d }' > "$dead"
          # Such a unit's outputs, <profile>/deps/*-<hash>[.*], listed before its
          # record goes.
          find "$t" -type f -path '*/deps/*' |
            sed -nE 's|^((.*)/deps/[^/]*-([0-9a-f]{16})(\.[^/]*)?)$|\2/\3\t\1|p' |
            awk -F'\t' 'NR == FNR { sub(/\/\.fingerprint\/.*-/, "/"); dead[$0] = 1; next } $1 in dead { print $2 }' "$dead" - |
            tr '\n' '\0' | xargs -0 -r rm -f --
          # Its record and its build script directory (<profile>/build/<package>-<hash>).
          sed 'p; s|/\.fingerprint/|/build/|' "$dead" | tr '\n' '\0' | xargs -0 -r rm -rf --
          find "$t" -type f -path '*/incremental/*' ! -newerat "@$cut" ! -newermt "@$cut" -delete
          find "$t" -type d -path '*/incremental/*' -empty -delete
          echo "removed $(wc -l < "$dead") unused units and the incremental files as old: $(( (before - $(used)) / 1073741824 ))G"
          rm -f "$dead"
          df -h --output=size,used,avail,pcent,target "$t"
      - name: the firmware blob (never committed)
        if: steps.seen.outputs.run == 'true'
        run: |
          mkdir -p driver/src/fw && cp "$PVR_FW_BLOB" driver/src/fw/
      - name: the Rust toolchain this run uses (reported, never installed or pinned)
        if: steps.seen.outputs.run == 'true'
        # The job installs no toolchain: the runner's rustup default decides.
        # This step only records which one, so a result can be tied to a rustc.
        run: |
          rustc -V
          cargo -V
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset}"
      - name: the gate host has every tool
        if: steps.seen.outputs.run == 'true'
        run: tools/setup-gate-host.sh --check
      # check.sh runs in a process group of its own (setsid), whose id is
      # recorded in $RUNNER_TEMP/gate.pgid. When a job is cancelled or times
      # out the runner kills only the step's main process; check.sh and its
      # cargo children would live on for hours under systemd --user (runner C,
      # 2026-10-18), holding CPU and the shared target directory. The last
      # step of the job ends that group. The file is removed when check.sh
      # ends by itself, so a recycled id is never signalled.
      - name: a process group of its own for the gate
        if: steps.seen.outputs.run == 'true'
        run: |
          cat > "$RUNNER_TEMP/gate-run.sh" <<'EOS'
          #!/usr/bin/env bash
          # usage: gate-run.sh <pgid file> <command> [args...]
          pgfile=$1; shift
          setsid bash -c 'ps -o pgid= -p $$ | tr -d " " > "$1"; shift; exec "$@"' _ "$pgfile" "$@" &
          # `wait` returns at once when a trapped signal arrives; the group is
          # then left to the cancel step.
          wait $!
          rc=$?
          rm -f "$pgfile"
          exit $rc
          EOS
          chmod +x "$RUNNER_TEMP/gate-run.sh"
      - name: tools/check.sh --no-clippy --changed <merge base> (a pull request, the rows its diff reaches, clippy left to the nightly)
        if: steps.seen.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p build
          base=$(git merge-base "origin/$BASE_REF" HEAD) || { echo "no merge base with origin/$BASE_REF"; exit 1; }
          echo "merge base with origin/$BASE_REF: $base"
          "$RUNNER_TEMP/gate-run.sh" "$RUNNER_TEMP/gate.pgid" tools/check.sh --no-clippy --changed "$base" 2>&1 | tee build/gate-ci.log
          test "${PIPESTATUS[0]}" -eq 0
      # A test row uses cargo-nextest when the runner has it (~/.cargo/bin,
      # on PATH above) and runs the binaries itself otherwise.
      # A run on main records the test binaries that passed
      # (YAKOGL_CHECK_RECORD, tools/check.sh cargo_test), in
      # ~/.cache/yakogl/test-ok beside the target directory; a later run
      # skips a binary whose key is recorded. A pull request's run only
      # reads the record, so it reuses only passes of what is on main.
      - name: tools/check.sh (every row, main, nightly or by hand)
        if: steps.seen.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          YAKOGL_CHECK_RECORD: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: |
          mkdir -p build
          "$RUNNER_TEMP/gate-run.sh" "$RUNNER_TEMP/gate.pgid" tools/check.sh 2>&1 | tee build/gate-ci.log
          test "${PIPESTATUS[0]}" -eq 0
      # A cancelled or timed-out job: end check.sh's whole process group, the
      # one recorded above, never anything found by name. TERM first so that
      # check.sh's traps clean up, KILL after a grace period.
      - name: end the gate's process group (cancel or timeout)
        if: always() && steps.seen.outputs.run == 'true'
        run: |
          pgfile="$RUNNER_TEMP/gate.pgid"
          if [ ! -s "$pgfile" ]; then
            echo "no recorded process group: check.sh ended by itself or never started; nothing to kill"
            exit 0
          fi
          pg=$(cat "$pgfile")
          case "$pg" in ''|*[!0-9]*|0|1) echo "bad pgid '$pg' in $pgfile; not killing"; exit 0;; esac
          kill -TERM -- "-$pg" 2>/dev/null || { echo "group $pg already gone"; rm -f "$pgfile"; exit 0; }
          echo "sent TERM to process group $pg"
          for _ in $(seq 20); do kill -0 -- "-$pg" 2>/dev/null || { echo "group $pg ended"; rm -f "$pgfile"; exit 0; }; sleep 1; done
          kill -KILL -- "-$pg" 2>/dev/null && echo "sent KILL to process group $pg"
          rm -f "$pgfile"
      # A run that ended with "No space left on device" shows here how full
      # the disk was and what filled it (issue #10579); a green run, how much
      # room is left.
      - name: the disk's free space after the gate
        if: always() && steps.seen.outputs.run == 'true'
        run: |
          df -h --output=size,used,avail,pcent,target "$HOME"
          for d in "${CARGO_TARGET_DIR:-}" "${TMPDIR:-}" "$GITHUB_WORKSPACE"; do
            if [ -d "$d" ]; then du -sh "$d"; fi
          done
      # build/check-fail/ holds the whole output of each failed row
      # (tools/check.sh prints only its last 40 lines): without it a failed
      # check further up cannot be named once the runner is gone (issue #11244).
      - name: the gate log and the whole output of each failed row
        if: always() && steps.seen.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.sha }}
          path: |
            build/gate-ci.log
            build/check-fail/
          if-no-files-found: ignore
