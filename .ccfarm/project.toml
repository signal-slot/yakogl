# ccfarm project file for yakogl.
#
# yakogl's cycle (README.md "Testing on the host", docs/HANDOFF.md "How to
# work here", tools/check.sh's header): there is no CI on this repository, so
# tools/check.sh IS the gate. Work happens on work/* branches; the full gate
# (about 45 min warm) runs from a clean detached checkout of the exact commit
# with driver/src/fw/pvr_fw_blob.h copied in and ZEPHYR_WS / HAL_NXP_DIR /
# PCO_SHC / GLSLANG / GLSL2USC_CACHE set. A row the gate could not run is a
# "gap", and a gap makes the gate red: without that environment the full gate
# cannot be green. Landing is on main; board runs use only images built from
# commits on origin/main, one GL client per board; docs/HANDOFF.md is updated
# in the same commit as any result that changes it, tools/cts/RESULTS.md and
# STATUS.md in the same push as the numbers they cite.
#
# Until ccfarm's review workspace has that environment (fw blob, Zephyr
# workspace, hal_nxp, pco_shc, board access), the full gate is red on gaps
# and ccfarm does NOT touch main: promotion stays off here (promote_to = "").
# When the environment is there, set promote_to = "main" and the [landing]
# push flag together.

[project]
name = "yakogl"

[review]
enabled = true
# The full gate, exactly as a developer runs it before pushing (README.md:
# "Run tools/check.sh before pushing"). It is one script: cargo fmt --check,
# the no_std archive, clippy with zero warnings and the test suite in every
# feature configuration and pair, the C host checks, the generated-file
# reproductions (byte for byte against the committed files), the "no table /
# no Mesa reference / no test knob in the artefact" symbol counts, the three
# Zephyr -Werror images (ZEPHYR_WS), the precompiled-table proofs, the Mesa
# table reproduction (PCO_SHC) and the hal_nxp regeneration (HAL_NXP_DIR).
# `tools/check.sh --quick` is the PowerVR row only, for an edit loop, and is
# never the landing gate.
commands = ["tools/check.sh"]
merge_into = "ccfarm/integration"
promote_to = ""

[permissions]
allow = [
  "Bash(tools/check.sh:*)",
  "Bash(cargo test:*)",
  "Bash(cargo build:*)",
  "Bash(cargo check:*)",
  "Bash(cargo clippy:*)",
  "Bash(cargo fmt:*)",
  "Bash(cargo run:*)",
  "Bash(python3:*)",
  "Bash(cc:*)",
  "Bash(git status:*)",
  "Bash(git diff:*)",
  "Bash(git log:*)",
  "Bash(git show:*)",
  "Bash(git add:*)",
  "Bash(git commit:*)",
  # The board recipes (tools/cts/README.md): the layout script, the image
  # builds, the board runner and west. Without these a task on a board lease
  # waits ten minutes per call for a decision nobody is there to make.
  "Bash(tools/cts/*)",
  "Bash(sh tools/cts/*)",
  "Bash(tools/board.sh*)",
  "Bash(west *)",
  "Bash(git fetch:*)",
]

[workspace]
# A fresh clone builds everything through cargo (Cargo.lock is committed;
# third_party/ vendors Mesa 26.2.1 and the DDK headers, so no Mesa tree is
# needed). The gate generates its own tier tables into build/ as it runs.
prepare = ["cargo fetch --locked"]

# Fixed values the gate reads.
env = { GLSLANG = "glslangValidator", PYTHONDONTWRITEBYTECODE = "1" }

# Values that differ per machine (paths of external workspaces and SDKs). The
# board and image scripts default none of them to a path on one machine;
# check.sh alone falls back to $HOME/com/github/zephyrproject-rtos/modules/hal/nxp
# for HAL_NXP_DIR, so set it explicitly anywhere else. On a node the values
# are the entries of ccfarm's dependency layout for this project
# (~/.local/share/ccfarm/deps/yakogl, $CCFARM_DEPS_DIR in a turn):
# tools/cts/deps-env.sh names them, `deps-env.sh --check [board]` says which
# are missing, and `ccfarm env set yakogl NAME value` stores each one; a
# board task reads them with `eval "$(tools/cts/deps-env.sh <board>)"`
# (DEQP_WORK is per board, so it is not stored).
#   ZEPHYR_WS        the west workspace ($ZEPHYR_WS/zephyr is ZEPHYR_BASE),
#                    made from west.yml (driver/samples/zephyr/README.md); the
#                    three Zephyr -Werror images of the gate are gaps without it
#   HAL_NXP_DIR      Zephyr's modules/hal/nxp checkout (hal_nxp 1e91007b), for
#                    the imx8mp regs.rs regeneration row
#   PCO_SHC          the pco_shc of tools/pco_shc/build_pco_shc.sh (content id
#                    f537fc86b41f), for the Mesa table reproduction row
#   GLSL2USC_CACHE   a cache directory for that row (3.5 min with it, else long)
#   MESA_V3D_TREE    optional: a built Mesa tree with build-v3d to compare the
#                    V3D checks against instead of the vendored sources
#   ZEPHYR_SDK_INSTALL_DIR, WEST_VENV  the Zephyr SDK (1.0.1 was used) and the
#                    venv holding west, for every Zephyr image build
#   RUSTUP_TOOLCHAIN the nightly the Slint / cluster / Pi 4 samples need
#   CC_aarch64_unknown_none  optional: a cross C compiler for the
#                    aarch64-unknown-none rows (build.rs also reads
#                    CC_aarch64-unknown-none and TARGET_CC); without one
#                    build.rs uses `clang`, and a machine with neither fails
#                    the aarch64 check rows and the "no Mesa reference" row.
#                    A machine with only a versioned clang (clang-23) sets
#                    this to it.
#   The board stages' image builds: GLMARK2_SRC, SLINT_NOSTD_DIR,
#   NOSTD_PATCH_DIR, AGL_SLINT_CLUSTER_DIR, DEQP_WORK (tools/cts/common-images.sh,
#   am62p-deqp-images.sh); the i.MX8MP dEQP build: ZEPHYR_WORKSPACE,
#   ZEPHYR_VENV, IMX8MP_OUT (tools/cts/imx8mp-env.sh) and DEQP_STAGE1 (the
#   output of tools/cts/imx8mp-deqp-stage1.sh, which imx8mp-deqp-build.sh
#   requires). BOARD_HDMI_TIMINGS is the Pi 4 panel's hdmi_timings;
#   BOARD_UART the Pi 4's serial device or its bridge's host:port
#   (tools/board.sh); PVR_FW_BLOB the PowerVR firmware header the gate and
#   every AM62P image copy to driver/src/fw/ (never committed).
env_names = [
  "ZEPHYR_WS",
  "HAL_NXP_DIR",
  "PCO_SHC",
  "GLSL2USC_CACHE",
  "MESA_V3D_TREE",
  "ZEPHYR_SDK_INSTALL_DIR",
  "WEST_VENV",
  "RUSTUP_TOOLCHAIN",
  "CC_aarch64_unknown_none",
  "GLMARK2_SRC",
  "SLINT_NOSTD_DIR",
  "NOSTD_PATCH_DIR",
  "AGL_SLINT_CLUSTER_DIR",
  "DEQP_WORK",
  "ZEPHYR_WORKSPACE",
  "ZEPHYR_VENV",
  "IMX8MP_OUT",
  "DEQP_STAGE1",
  "BOARD_HDMI_TIMINGS",
  "BOARD_UART",
  "PVR_FW_BLOB",
]
# The values a board task writes under (image output, the dEQP stage-1 trees,
# all under the dependency layout): a sandboxed task may write `$NAME/...`
# there without asking (ccfarm `[workspace] writable_env_names`; the four
# board tasks of 2026-10-11 stopped on `mkdir $IMX8MP_OUT/...`).
writable_env_names = ["IMX8MP_OUT", "DEQP_STAGE1", "DEQP_WORK"]

# The PowerVR firmware header: generated from TI's rgx.fw by
# driver/tools/mkfwblob.sh, gitignored (driver/.gitignore: src/fw/), never
# committed, and not reproducible without the firmware file. Every AM62P
# Zephyr image (the gate's -Werror rows and all AM62P board images) needs it.
copy_from_origin = ["driver/src/fw/pvr_fw_blob.h"]

# Programs the gate needs that are not in the repository. A missing one is a
# red row or a gap in tools/check.sh, never a silent pass.
tools = [
  { name = "cargo", version = ">=1.88", check = "cargo --version", install = "rustup (rust-version 1.88 in Cargo.toml; stable toolchain)" },
  { name = "rustup-target-aarch64-unknown-none", check = "rustup target list --installed | grep -qx aarch64-unknown-none", install = "rustup target add aarch64-unknown-none" },
  { name = "rustup-target-aarch64-unknown-none-softfloat", check = "rustup target list --installed | grep -qx aarch64-unknown-none-softfloat", install = "rustup target add aarch64-unknown-none-softfloat (or a nightly with rust-src)", build = "rustup target add aarch64-unknown-none-softfloat" },
  { name = "cc", check = "cc --version", install = "distro package gcc or clang (C11 host compiler; the gate also uses nm, objcopy, sha256sum, cmp, awk)" },
  { name = "clang", check = "clang --version", install = "distro package clang: build.rs compiles the C wrappers of the aarch64-unknown-none rows with clang unless CC_aarch64-unknown-none names another cross compiler, so the three aarch64 check rows and the 'no Mesa reference' control build fail without it" },
  # No version requirement: Mesa pins none, and ccfarm reads a requirement
  # off the check's output (nothing printed = missing on every node).
  { name = "python3-pyyaml", check = "python3 -c 'import yaml; print(yaml.__version__)'", install = "distro packages python3 and python3-yaml (Mesa's u_format_table.py needs PyYAML for the v3d generated-file row of the gate)" },
  # The table was made with 16.4.0, and 16.2.0 (Ubuntu 26.04) gives byte-identical
  # SPIR-V for every run that makes it (2554 runs, 32 of them glslang refusals on both,
  # measured 2026-10-11 on system76 against Lepton), so 16.2 is the measured floor.
  { name = "glslangValidator", version = ">=16.2", check = "glslangValidator --version", install = "distro package glslang-tools / glslang (16.2.0 and 16.4.0 make the same SPIR-V for the whole table; a version below 16.2 is unmeasured)" },
  # The check is clang-sys's own run-time search (clang-sys 1.9.1
  # build/common.rs search_libclang_directories): LIBCLANG_PATH alone when set,
  # else `llvm-config --prefix` bin/lib/lib64, LD_LIBRARY_PATH, LIBRARY_PATH and
  # the /usr/local and /usr lib directories, for libclang.so, libclang-*.so,
  # libclang.so.* and libclang-*.so.* (libclang-cpp excluded). The check runs
  # in the environment the worker gives agents, so its verdict is bindgen's.
  # find_library("clang") was not: it misses Ubuntu's versioned libclang-21.so
  # and called system76 missing while bindgen ran there (2026-10-10).
  # tools/setup-gate-host.sh probe_libclang is the same code.
  { name = "libclang", check = "python3 -c 'import glob,os,shutil,subprocess,sys; names=(\"libclang.so\",\"libclang-*.so\",\"libclang.so.*\",\"libclang-*.so.*\"); hit=lambda d: [p for n in names for p in sorted(glob.glob(os.path.join(d,n))) if \"-cpp.\" not in os.path.basename(p)]; lp=os.environ.get(\"LIBCLANG_PATH\"); f=hit(lp) + ([lp] if lp and os.path.isfile(lp) else []) if lp else []; pre=(lambda r: (r.stdout.splitlines() or [\"\"])[0] if r.returncode==0 else \"\")(subprocess.run([\"llvm-config\",\"--prefix\"],capture_output=True,text=True)) if not lp and shutil.which(\"llvm-config\") else \"\"; dirs=[os.path.join(pre,s) for s in (\"bin\",\"lib\",\"lib64\")] if pre else []; dirs+=[d for v in (\"LD_LIBRARY_PATH\",\"LIBRARY_PATH\") for d in os.environ.get(v,\"\").split(\":\") if d]; dirs+=[d for pat in (\"/usr/local/llvm*/lib*\",\"/usr/local/lib*/*/*\",\"/usr/local/lib*/*\",\"/usr/local/lib*\",\"/usr/lib*/*/*\",\"/usr/lib*/*\",\"/usr/lib*\") for d in sorted(glob.glob(pat))]; f=f or [p for d in dirs for p in hit(d)]; print(f[0] if f else \"\"); sys.exit(0 if f else 1)'", install = "distro package clang / libclang (bindgen loads it at run time for the csbgen-bindings --check row; LIBCLANG_PATH otherwise)" },
  { name = "expat-zlib-dev", check = "pkg-config --exists expat zlib", install = "distro packages expat and zlib (the V3D job_check links Mesa's CLIF decoder against them)" },
  # west lives in the WEST_VENV venv (env_names above), not on PATH: the
  # check looks there first. The build makes that venv when it is missing.
  { name = "west", check = "\"${WEST_VENV:-/nonexistent}/bin/west\" --version 2>/dev/null || west --version", install = "pip install west in a venv (WEST_VENV); the Zephyr SDK 1.0.1 at ZEPHYR_SDK_INSTALL_DIR; the workspace from west.yml at ZEPHYR_WS", build = "test -n \"${WEST_VENV:-}\" && python3 -m venv \"$WEST_VENV\" && \"$WEST_VENV/bin/pip\" install west" },
  { name = "pco_shc", check = "test -x \"$PCO_SHC\"", install = "tools/pco_shc/build_pco_shc.sh <mesa-26.2.1.tar.xz> <build dir> (needs clang/LLVM, libclc, SPIRV-LLVM-Translator, spirv-dis; see the script's header), then PCO_SHC=<build dir>/mesa-26.2.1/build/src/imagination/vulkan/pco_shc; the gate compares the USC rows it makes with tests/reference/blobs.rs, not the binary's hash", heavy = true },
]

# Steps after landing. Board runs are the project's proofs: every result in
# docs/HANDOFF.md "State of main" and tools/cts/RESULTS.md comes from a real
# GPU, booted from the board's own bootloader by tools/board.sh, and only from
# an image built from a commit on origin/main, so every board stage is
# `after = "promote"`. One GL client per board: tools/board.sh takes the board
# lock and refuses a busy board (exit 3). Board addresses never go in files:
# tools/board.sh reads BOARD_HOST (user@host of the board's Linux) and
# BOARD_UART (pi4: the serial device; am62p: host:port of the serial bridge;
# the i.MX8MP has none) from the environment only. Run directories are
# written under records/<board>/ (gitignored, redacted); the numbers that
# matter are copied into the docs by hand, which is why `record` is on.
# Known defects make some rows fail by design (i.MX8MP cases 10, 16 and 2:
# issues #9, #8, #25; the Pi 4's 25 cube cases: #12), so a failed board row is
# reported and judged against HANDOFF.md, not auto-fixed.

[[stages]]
name = "board-common-am62p"
after = "promote"
# The common set (tools/cts/common-tree.txt: glmark2, slint, slint-view,
# gl_test) on the Verdin AM62P, booted by U-Boot from the eMMC
# (BOARD_BOOT=uboot-mmc, docs/HANDOFF.md). cts-common.sh build is
# tools/cts/common-images.sh; run is tools/board.sh am62p tree and the tally.
commands = [
  "tools/cts/cts-common.sh am62p build build/common/am62p-$(git rev-parse --short=8 HEAD)",
  "BOARD_HOST=${resource.am62p.user}@${resource.am62p.host} BOARD_UART=${resource.am62p.device} BOARD_BOOT=uboot-mmc tools/cts/cts-common.sh am62p run build/common/am62p-$(git rev-parse --short=8 HEAD) records/am62p/common-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:am62p"]
record = { enabled = true }
on_fail = "report"

[[stages]]
name = "board-common-imx8mp"
after = "promote"
# The same four images on the Verdin iMX8M Plus (gc_gl_test for gl_test),
# U-Boot from the eMMC. The board has no UART: its records come back in the
# SNVS and are read over ssh afterwards.
commands = [
  "tools/cts/cts-common.sh imx8mp build build/common/imx8mp-$(git rev-parse --short=8 HEAD)",
  "BOARD_HOST=${resource.imx8mp.user}@${resource.imx8mp.host} BOARD_BOOT=uboot-mmc tools/cts/cts-common.sh imx8mp run build/common/imx8mp-$(git rev-parse --short=8 HEAD) records/imx8mp/common-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:imx8mp"]
record = { enabled = true }
on_fail = "report"

[[stages]]
name = "board-common-pi4"
after = "promote"
# The same four images on the Raspberry Pi 4 (v3d_gl_test), booted once by
# the firmware's tryboot from the SD card (board.sh's default for pi4).
commands = [
  "tools/cts/cts-common.sh pi4 build build/common/pi4-$(git rev-parse --short=8 HEAD)",
  "BOARD_HOST=${resource.pi4.user}@${resource.pi4.host} BOARD_UART=${resource.pi4.device} tools/cts/cts-common.sh pi4 run build/common/pi4-$(git rev-parse --short=8 HEAD) records/pi4/common-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:pi4"]
record = { enabled = true }
on_fail = "report"

[[stages]]
name = "deqp-tree-am62p"
after = "promote"
# dEQP-GLES2, the whole mustpass tree on the AM62P: 17 images, one per line
# of tools/cts/am62p-full-tree.txt (tools/cts/README.md section 2), then the
# per-case tally and the diff against the earlier tree. Needs DEQP_WORK
# (stage 1, tools/cts/cts-build-zephyr.sh) besides ZEPHYR_WS. The tree's
# lines carry no "# image" labels, so the builder names each row's directory
# img<N>-<tag> and board.sh finds it as img<N>-$TREE_TAG: one explicit tag
# (the short commit hash) goes to both. Hours of board time; the result
# rows go to tools/cts/RESULTS.md and README.md.
commands = [
  "mkdir -p build/deqp/am62p-$(git rev-parse --short=8 HEAD)",
  "tools/cts/am62p-deqp-images.sh tools/cts/am62p-full-tree.txt build/deqp/am62p-$(git rev-parse --short=8 HEAD) $(git rev-parse --short=8 HEAD) > build/deqp/am62p-$(git rev-parse --short=8 HEAD)/build.out",
  "BOARD_HOST=${resource.am62p.user}@${resource.am62p.host} BOARD_UART=${resource.am62p.device} BOARD_BOOT=uboot-mmc TREE_IMAGE_DIR=build/deqp/am62p-$(git rev-parse --short=8 HEAD) TREE_TAG=$(git rev-parse --short=8 HEAD) tools/board.sh am62p tree tools/cts/am62p-full-tree.txt records/am62p/deqp-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:am62p"]
only_if_changed = ["src/**", "capi/**", "driver/**", "include/**", "tools/cts/**", "tools/shaders/**", "Cargo.toml", "Cargo.lock", "CMakeLists.txt", "zephyr/**"]
record = { enabled = true }
on_fail = "report"

[[stages]]
name = "deqp-tree-imx8mp"
after = "promote"
# The whole tree on the i.MX8MP as one image carrying the 29-entry table
# (tools/cts/README.md section 2c): imx8mp-deqp-build.sh needs
# tools/cts/imx8mp-env.sh's ZEPHYR_WORKSPACE, ZEPHYR_VENV,
# ZEPHYR_SDK_INSTALL_DIR and IMX8MP_OUT, and DEQP_STAGE1 from
# imx8mp-deqp-stage1.sh; each entry is one boot with the
# selector in SNVS word 1. results.tsv and rows.md are the outcome; the
# 2026-10-03 baseline is tools/cts/imx8mp-full-tree-29460f96.results.tsv.
commands = [
  "tools/cts/imx8mp-deqp-build.sh deqp-$(git rev-parse --short=8 HEAD) 'dEQP-GLES2.info.*' --table tools/cts/imx8mp-full-tree.txt",
  "BOARD_HOST=${resource.imx8mp.user}@${resource.imx8mp.host} BOARD_BOOT=uboot-mmc TREE_IMAGE=$IMX8MP_OUT/deqp-$(git rev-parse --short=8 HEAD)/zephyr/zephyr.bin tools/board.sh imx8mp tree tools/cts/imx8mp-full-tree.txt records/imx8mp/deqp-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:imx8mp"]
only_if_changed = ["src/**", "capi/**", "driver/**", "include/**", "tools/cts/**", "tools/shaders/**", "Cargo.toml", "Cargo.lock", "CMakeLists.txt", "zephyr/**"]
record = { enabled = true }
on_fail = "report"

[[stages]]
name = "deqp-tree-pi4"
after = "promote"
# The whole tree on the Pi 4: one v3d_deqp image per labelled block of
# tools/cts/pi4-full-tree.txt (tools/cts/pi4-deqp-images.sh, DEQP_WORK built
# with BOARD=rpi_4b), run and tallied by tools/board.sh pi4 tree.
commands = [
  "tools/cts/pi4-deqp-images.sh tools/cts/pi4-full-tree.txt build/deqp/pi4-$(git rev-parse --short=8 HEAD)",
  "BOARD_HOST=${resource.pi4.user}@${resource.pi4.host} BOARD_UART=${resource.pi4.device} TREE_IMAGE_DIR=build/deqp/pi4-$(git rev-parse --short=8 HEAD) tools/board.sh pi4 tree tools/cts/pi4-full-tree.txt records/pi4/deqp-$(git rev-parse --short=8 HEAD)",
]
requires = ["target:pi4"]
only_if_changed = ["src/**", "capi/**", "driver/**", "include/**", "tools/cts/**", "tools/shaders/**", "Cargo.toml", "Cargo.lock", "CMakeLists.txt", "zephyr/**"]
record = { enabled = true }
on_fail = "report"

[landing]
conventions = "main is the landing branch and origin/main (github.com/signal-slot/yakogl) the truth: board images are built only from commits on origin/main, and HANDOFF.md names main's commit under test. Work happens on short topic branches landed through a pull request (the CI gate runs on the pull request, a reviewer merges; main is never pushed by hand), lately work/<topic> (work/pco-driver-programs, work/cleanup-1-vivante-knobs; earlier <area>/<topic> such as pvr/fl-grow-on-demand, unify/cluster), rebased onto origin/main; locally only the rows the diff reaches run (tools/check.sh --changed <base>), the full tools/check.sh (green means 0 failed and 0 gaps) is the CI's job on the pull request and on main after the merge; when a branch has merged main before, resolve conflicts against the newest common ancestor of the file, not git's merge base (tools/cts/RESULTS.md, 2026-10-04). Commit subjects are '<area>: <what changed, stated as a result>' in lower case with no type prefix ('shaderc: ...', 'pvr online: ...', 'vivante: ...', 'docs: ...'), the body explains the design and names the records and commits it rests on, and agent commits end with a Co-Authored-By trailer. Generated files that the gate reproduces byte for byte (src/pvr/internal.rs, src/vivante/internal.rs, tests/reference/*.rs, src/pvr/csbgen.rs, driver/rust/src/soc/imx8mp/regs.rs, the pinned count fixtures under tests/fixtures/) are regenerated in the same commit as the change that moves them, and a new feature or knob joins check.sh's lists in the same commit. docs/HANDOFF.md ('State of main', the open work in order, the known defects with their GitHub issue numbers) is updated in the same commit as any result that changes it; tools/cts/RESULTS.md (the measurement log, cells citing the commit and the record directory) and tools/cts/STATUS.md (the summary, in Japanese) in the same push as the numbers they describe; README.md's Status tables when a board's conformance or glmark2 figure changes. Records (records/<board>/<YYYYMMDD-HHMM>-<name>-<sha8>/) are gitignored and redacted; board addresses, UART paths and credentials come from the environment and never go in a file; driver/src/fw/pvr_fw_blob.h is never committed."
# No stage runs after the merge into the integration branch: the whole
# pre-landing proof is the review gate (tools/check.sh), and the board stages
# above run only from the promoted branch.
promote_requires = []
# main moves only through pull requests (the gate runs on the pull request
# and again on main after the merge, .github/workflows/gate.yml); nobody
# pushes main by hand. ccfarm does not promote here (promote_to = ""), so it
# pushes nothing; turn this on together with promote_to = "main".
push = false
