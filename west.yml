#
# West manifest for building YakoGL's Zephyr samples from this repository
# alone (Verdin AM62P A53, Verdin iMX8M Plus A53, Raspberry Pi 4):
#
#   west init -m https://github.com/signal-slot/yakogl --mr main yakogl-ws
#   cd yakogl-ws && west update
#
# The repository lands in yakogl-ws/yakogl and is a Zephyr module by itself
# (zephyr/module.yml). The samples add driver/ (the GPU and display drivers
# and the Verdin A53 board support: boards/, soc/, dts/) to the module list on
# their own (driver/samples/zephyr/common/yakogl_dir.cmake).
# driver/samples/zephyr/README.md has the build commands.
#
# Zephyr is pinned to the revision the samples were built and run against.
# Only the modules the A53 images need are imported.
manifest:
  self:
    path: yakogl
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject
      revision: af17c0c8aa2a82a0b714a423915ad3610063ee68
      import:
        name-allowlist:
          - fatfs          # the deqp sample's embedded file system
          - hal_nxp        # Verdin iMX8M Plus (pinctrl, clocks, UART)
          - hal_ti         # Verdin AM62P (TI K3)
          - picolibc
          - zephyr-lang-rust   # group "optional": inactive unless enabled
