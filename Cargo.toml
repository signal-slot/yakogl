#
# The workspace: the library crate `yakogl` (this directory), the C-ABI
# archive crate `yakogl-capi` (capi/), the display/SoC driver archive
# `yakogl-drivers` (driver/rust/; its path is also named once in
# driver/zephyr/CMakeLists.txt, YAKOGL_DRIVERS_CRATE_DIR) and the gl_test
# runner `yakogl-gltest-runner` (driver/tools/pvrlab/runner, an rlib the
# archive takes behind `gl-test-runner`). Host tools join as further members:
# adding one is one line in `members`. `default-members` is the library only,
# so a plain `cargo build` / `cargo test` / `cargo check` here never builds the
# archive crate or a host tool; the C builds (CMakeLists.txt, baremetal.mk,
# zephyr/) always name their package (`-p yakogl-capi`), so feature
# unification never mixes a host tool's features into the no_std archive.
[workspace]
members = [
    ".",
    "capi",
    "driver/rust",
    "driver/samples/zephyr/boot_stage2/loader",
    "driver/tools/pvrlab/runner",
    "examples/femtovg/check",
    "examples/slint/check",
    "examples/triangle/check",
    "examples/triangle/rust",
    "examples/triangle-rust",
    "tools/yakogl-tools",
    "tools/precompile",
    "tools/mali/panthor",
]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88: slice::as_chunks (1.88), statics in constants (1.83), `&raw const`
# and Option::is_none_or (1.82). Checked: 1.88 builds, 1.79 does not.
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[package]
name = "yakogl"
description = "Portable OpenGL ES + EGL for GPUs with no operating system driver (PowerVR BXS-4-64)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
publish.workspace = true

# The library is an rlib only: it has no panic handler and is never a
# staticlib itself. C applications link the archive built from capi/
# (libyakogl.a); a Rust application depends on this crate directly and brings
# its own panic handler (README.md, "Linking").
[lib]
crate-type = ["rlib"]

[features]
default = ["osal-linux"]
# The OSAL whose ops table is the compile-time default of `g_osal`. At most
# one (several are a compile error). With none, `g_osal` starts null and the
# application calls `osal_set_ops()` before the first GL call. The OSALs are C
# (src/osal/<name>.c) and are linked by the build system, not by cargo.
osal-linux = []
osal-zephyr = []
osal-baremetal = []
# Report OpenGL ES 2.0 instead of ES 3.0: glGetString(GL_VERSION) says
# "OpenGL ES 2.0", GL_SHADING_LANGUAGE_VERSION "OpenGL ES GLSL ES 1.00", the
# ES 3.0-only queries (GL_MAJOR_VERSION, GL_MINOR_VERSION, GL_NUM_EXTENSIONS)
# are GL_INVALID_ENUM, and GL_EXTENSIONS lists the ES 2.0 extensions ES 3.0
# has in core (GL_OES_texture_npot and the depth-texture pair). A conformance run must
# have this: a client that reads GL_MAJOR_VERSION and gets an answer concludes
# it is talking to ES 3 whatever the version string said. The ES 3.0-only
# enums and rules go with the version (`crate::REPORT_ES2`, src/lib.rs), the
# in-process compiler refuses a `#version 300 es` source
# (src/shaderc/online/pp.rs) and GL_EXT_color_buffer_float is not listed
# (src/gl/state.rs). Off by default here; the C builds turn it on by default
# (CMake YAKOGL_REPORT_ES2, Kconfig YAKOGL_REPORT_ES2, make REPORT_ES2) and a
# build that needs an ES 3.0 context (Qt's RHI, dEQP-GLES3) turns it off.
report-es2 = []
# The GPU whose backend and offline shader table are compiled in. Exactly one
# of `gpu-powervr`, `gpu-vivante`, `gpu-v3d` and `gpu-mali` is in a build
# (src/lib.rs refuses none and two). `default` names none: a default GPU would
# be wrong on every board but one and would make `--features gpu-vivante` a
# two-GPU build.
#
# The AM62P's PowerVR BXS-4-64 (`pvr/`).
gpu-powervr = []
# The i.MX8MP's Vivante GC7000 (`vivante/`), which changes the shader ABI
# (`struct shc_shader` grows its GC7000 half) and the table the shader back
# end looks shaders up in.
gpu-vivante = []
# The Raspberry Pi 4's Broadcom V3D 4.2 (`v3d/`): the GL core draws through
# the frame builder in driver/src/v3d/ (docs/online-shaderc/v3d-backend.md,
# "M6"). The only shader back end for this GPU is the in-process compiler:
# there is no offline table, so it needs `shaderc-online` and takes no
# table (`no-shader-table` in the host tests; src/lib.rs says so at compile time rather than building
# a library that cannot compile a shader). Like the GC7000, `struct shc_shader`
# grows a V3D half (`ShcShader::v3d`).
gpu-v3d = []
# The NanoPC-T6's Arm Mali-G610 (RK3588, Valhall arch 10; `mali/`): a
# skeleton. The descriptor packers are generated from Mesa's v10.xml
# (src/mali/genxml/v10.rs, tools/mali/gen_pack_rs.py); the backend refuses
# every draw and the shader back end every compile, each by name, until
# their milestones land (driver/docs/nanopc-t6-mali.md). As on the V3D, the
# only shader back end is the in-process compiler: it needs `shaderc-online`
# and takes no table (`no-shader-table` in the host tests).
gpu-mali = []
# The Vivante depth canary (the C's CONFIG_YAKOGL_VIVANTE_DEPTH_GUARD): a
# guard either side of the depth surface, filled with a pattern, so what the
# pixel engine writes outside the surface can be read back. Bring-up only.
vivante-depth-guard = ["gpu-vivante"]
# The test knobs: C entry points the on-silicon suites (gl_test.c, the dEQP
# sample) set to run an experiment's arms or to probe the backend's state,
# and the switches behind them. Without it none of them is in the build and
# the backend behaves as each knob's default. Off by default; the gl_test
# (i.MX8MP) and deqp Zephyr images turn it on (CONFIG_YAKOGL_TEST_KNOBS),
# a product image never does (tools/check.sh "no test knob in the
# artefact"). A knob's C symbol is in its GPU's debug namespace, which is
# what that row reads: the GC7000's gc_debug_* (gc_debug_msaa and its
# scratch probes, issue #4; gc_debug_flip_experiment; gc_debug_narrow_la),
# the PowerVR's pvr_debug_* (pvr_debug_split_zs, pvr_debug_narrow_la) and
# its backend options marked TEST KNOB in src/pvr/pvr_backend.h, which
# pvr_backend_set_option refuses without the feature.
test-knobs = []
# ES 3.0 multisample renderbuffers (docs/notes/es3-msaa-renderbuffers.md).
# No code reads it: no `cfg(feature = "msaa-fbo")` is in src/. The capability
# is the back end table's `max_samples` (src/backend.rs), which the GL core
# reads whatever this feature says (src/gl/msaa.rs): the PowerVR back end
# reports 4 (src/pvr/backend.rs), the others 0. Off by default; CMake's
# YAKOGL_MSAA_FBO names it (capi/yakogl_capi.cmake), and it changes nothing.
msaa-fbo = []
# ES 3.0 float colour targets (plan #360, docs/notes/es3-float-targets.md):
# a build that claims `GL_EXT_color_buffer_float`, for a GPU whose back end
# draws and reads back the float formats. Today that is the V3D: with
# `gpu-v3d` the three extension float surfaces are renderable
# (`FLOAT_RT_FORMATS`, src/backend.rs), a float output to a 32F target is a
# 32-bit TLB write (`F32_RT_WRITES`, src/v3d/backend.rs) and a 32F clear
# takes Mesa's words (`F32_CLEAR_AS_MESA`, src/v3d/state.rs); the GL core
# lists the extension in an ES 3.0 build of it
# (`COLOR_BUFFER_FLOAT_EXTENSION`, src/gl/state.rs). On the other GPUs the
# feature builds and claims nothing. Off by default; without it the
# extension is not listed.
color-buffer-float = []
# The PowerVR back end's hardware instance divisors (P3,
# docs/notes/instanceid-per-draw.md, row "P3 (full path)"): with it the back
# end reports `max_instance_divisor` 0xffff and divides per stream in the PDS
# (a multiplier and a shift, as Mesa's pvr_pipeline_pds.c does), so an
# instanced draw with a divisor above 1 is one draw; without it it takes
# divisor 1 only and the GL core draws instance by instance
# (`max_instance_divisor`, `stream_divisor` and `base_to_streams` in
# src/pvr/backend.rs). Off by default; a board image turns it on with
# Kconfig YAKOGL_PVR_INSTANCE_DIVISOR (default n), a CMake build with
# YAKOGL_PVR_INSTANCE_DIVISOR.
pvr-instance-divisor = []
# Host tests only: links std so the test harness can unwind, and starts with a
# null `g_backend` (the tests install mocks). Never enable it in a product:
# it is a compile error on bare-metal targets and in the C archive.
#   cargo test --no-default-features --features host-test,gpu-powervr
host-test = []
# The in-process ("online") shader compiler: src/shaderc/online/, a GLSL ES
# 1.00 front end (and GLSL ES 3.00 in a build without `report-es2`) and the
# code generator of the build's GPU (powervr/, vivante/, v3d/, mali/ there)
# that run on the target, so a Zephyr or bare-metal image can compile a
# shader an application hands it instead of looking the text up in a table.
# It is no_std and heap-free (the crate has no allocator): the caller lends
# it a scratch buffer and owns the output. It also owns the instruction sets
# themselves - for the PowerVR the USC decoder, encoder and disassembler,
# gated by a byte-exact round trip over every blob of the Mesa reference
# table (docs/online-shaderc/isa.md). It is the only back end that needs no
# build-time table, so it is the one a product can ship with an application
# that writes its shaders at run time, and the only one of `gpu-v3d` and
# `gpu-mali` (src/lib.rs). With the feature in it is `g_shaderc`
# (src/shaderc/mod.rs). A build that also links the Mesa reference table
# (`cfg(mesa_reference)`) starts at the offline back end, and the first call
# installs the compiler over it (`select_once`,
# src/shaderc/online/backend.rs), except in a `host-test` build, whose tests
# install their own back ends.
shaderc-online = []
# The precompiled shaders: a table our own compiler made of
# tools/shaders/precompiled.list at image-build time (yakogl-precompile,
# tools/precompile), looked up by the same record key the compiler's cache
# uses. With `shaderc-online` it is the tier in front of the compiler: a hit
# runs no compile, a miss compiles. Without it, it is the whole back end (an
# image with no compiler, no front end and no scratch region): a miss is
# refused by name, -ENOENT. The table is a file build.rs is pointed at
# with YAKOGL_PRECOMPILED_TABLE (the C builds generate it into their build
# directory: Kconfig YAKOGL_PRECOMPILED_SHADERS, CMake
# YAKOGL_PRECOMPILED_SHADERS); its toolchain mark must name this build's GPU
# and ES level or the build stops. Off by default.
precompiled-shaders = []
# MEASUREMENT IMAGES ONLY: link the Mesa reference table
# (tests/reference/blobs.rs, PowerVR, from pco_shc; vivante_blobs.rs, GC7000,
# from etna_shc) as this build's shader table, behind the offline back end
# (src/shaderc/offline.rs, `g_shaderc` = `SHC_OFFLINE`). It exists so that an
# image can still be built with Mesa's code for an A/B against our compiler
# (gl_test 193..195's "table image"; Kconfig YAKOGL_SHADERC_OFFLINE, the C
# builds' SHADERC offline, select it). build.rs turns it into
# `cfg(mesa_reference)`, which is what the code reads; the PowerVR and the
# GC7000 only (src/lib.rs refuses it with `gpu-v3d`, `gpu-mali` and
# `no-shader-table`). It will be replaced by the precompiled table our own
# compiler makes (`precompiled-shaders`, tools/precompile; what is left:
# #1214, #1215). Off by default: without it no product build links a Mesa-built
# row (tools/check.sh, "no Mesa reference in the artefact"), and a build
# with none of this, `shaderc-online` and `precompiled-shaders` has no shader
# back end and is refused (src/lib.rs). The host tests compile the reference
# without it (`host-test`), to compare our compiler with it.
mesa-reference-table = []
# Leave the Mesa reference table OUT of a host-test build too.
#
# Outside the host tests the table is only ever in a build that asks for it
# (`mesa-reference-table`); `host-test` compiles it, because the tests
# compare the compiler with it in one process, and this takes it out again:
# the build-only image configurations of tools/check.sh and the V3D, which
# has no table. A product build may pass it as well (the C builds do with
# the in-process compiler); it changes nothing there.
#
# Requires a back end that needs no table (`shaderc-online`); the build stops
# otherwise, rather than producing a library that cannot compile anything.
no-shader-table = []

[dependencies]

# build.rs compiles Mesa's QPU packer (third_party/mesa-26.2.1/src/broadcom/qpu)
# for a `gpu-v3d` build and the PowerVR backend's csbgen packer wrappers
# (driver/src/pvr/generated/csbgen_wrap.c) for a `gpu-powervr` build; the GC7000
# build compiles no C here.
[build-dependencies]
cc = "1.2"

[profile.dev]
panic = "abort"
opt-level = 1

# The tests (`cargo test`, every test row of tools/check.sh) at opt-level 3.
# The profile inherits `dev` otherwise, and opt-level 1 halves the speed of
# the compiler-heavy tests (docs/ci.md, section 3.4). Debug assertions and
# overflow checks stay on, as in `dev`. cargo ignores `panic` for tests (the
# harness needs unwinding), so dev's `panic = "abort"` is unchanged where it
# applies. The edit loop's `dev` profile keeps opt-level 1.
#
# `debug = false`: no DWARF in test builds. Every integration test is its own
# binary and statically links the whole library, so each binary carried its own
# copy of the library's debug information: of `es3_srgb`'s 30 MiB, 29.2 MiB was
# debug sections and 1 MiB was code (measured with `size -A`, 2026-11-26). The
# gate builds this once per feature set and per test file, which is where a
# full run's 121.5 GiB came from (docs/ci.md 3.9). A failing test still prints
# its file and line (the panic location is not DWARF) and, with RUST_BACKTRACE,
# the function names (the symbol table is kept); a debugger session builds the
# tests with CARGO_PROFILE_TEST_DEBUG=true.
[profile.test]
opt-level = 3
debug = false
debug-assertions = true
overflow-checks = true

# The C archive's dev build (YAKOGL_CARGO_PROFILE=dev): dev semantics
# (overflow checks, debug assertions) but one LTO object, which the archive
# post-processing (capi/assemble.cmake) needs to hide the Rust runtime symbols.
[profile.dev-lto]
inherits = "dev"
lto = true
codegen-units = 1
incremental = false

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = true

# The whole-suite test rows build one integration test binary per tests/ file for every
# feature set they run (10 such rows today), each statically linking the whole library:
# 8,920 binaries per full run, measured 15 MiB each with the `dev` DWARF. A file whose
# whole-file `#![cfg(...)]` gate cannot hold under the row's features compiles to an empty
# crate, so 5,876 of those were 0-test husks of the library (docs/ci.md 3.9). These
# entries carry the gates into cargo's target selection: `required-features` are the plain
# feature atoms of the file's cfg gate, so a feature set that cannot satisfy a gate does
# not link that file's binary at all, and every binary that ran tests before still runs.
# A `--test` name of a target the feature set cannot build is a cargo error; tools/check.sh
# filters its `--changed` tests-scope pick with tools/check_test_features.py --live.
#
# The rule is mechanical, and tools/check_test_features.py --check is its row: a file
# gated on host-test alone gets no entry (it skips nothing); a gate with any(...) or
# not(...) parts contributes only its atoms, which are necessary conditions, so cargo
# skips only where the gate is false anyway. Change a gate in a tests/ file and this
# row goes red until its entry moves with it, the way the generated tables' rows compare
# bytes with their generators.

